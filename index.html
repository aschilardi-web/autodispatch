<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102d4c">
<title>AutoDispatch</title>
<style>
:root{--navy:#102d4c;--blue:#2675a9;--pale:#edf5fb;--ink:#20384e;--muted:#74879a;--line:#e2e9ef;--bg:#f4f7fa;--green:#24784d;--amber:#9a6b18;--red:#a54b48}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Arial,Helvetica,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #4a9cdc;outline-offset:2px}
@keyframes shimmer{0%{left:-80%}100%{left:120%}}
.loading-bar{position:fixed;top:0;left:0;right:0;height:3px;background:#1a3f6a;z-index:200;display:none;overflow:hidden}.loading-bar.on{display:block}.loading-bar::before{content:'';position:absolute;top:0;left:-80%;width:60%;height:100%;background:linear-gradient(90deg,transparent,#5ab0e8,transparent);animation:shimmer 1.2s ease-in-out infinite}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg)}.auth-card{background:white;border:1px solid var(--line);border-radius:12px;padding:32px;width:360px;box-shadow:0 8px 32px #102d4c14}.auth-brand{font-size:22px;font-weight:800;color:var(--navy);margin-bottom:6px}.auth-brand span{color:#98c9e9;font-weight:400}.auth-brand small{display:block;font-size:9px;letter-spacing:2px;color:var(--muted);margin-top:4px}.auth-title{font-size:17px;font-weight:700;margin:22px 0 18px}.auth-err{color:var(--red);font-size:12px;min-height:18px;margin:8px 0 4px}
.shell{min-height:100vh;display:flex}.sidebar{width:230px;background:var(--navy);color:#d4e2ee;position:fixed;inset:0 auto 0 0;padding:24px 13px;display:flex;flex-direction:column;z-index:5}.brand{font-size:20px;font-weight:800;color:white;padding:0 12px 28px;letter-spacing:-.5px}.brand span{color:#98c9e9;font-weight:400}.brand small{display:block;color:#7799b4;font-size:8px;letter-spacing:2px;margin-top:5px}.nav-label{font-size:10px;letter-spacing:1.5px;color:#7f9bb3;padding:12px 12px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#b7cadb;border-radius:7px;text-align:left;padding:11px 12px;display:flex;gap:11px;align-items:center;font-weight:600}.nav button:hover,.nav button.active{background:#244a70;color:white}.nav .icon{width:21px;text-align:center;font-size:16px}.sidebar-foot{margin-top:auto;border-top:1px solid #294d6c;padding:16px 10px;font-size:11px;color:#acc2d4;line-height:1.6}.main{margin-left:230px;width:calc(100% - 230px);min-height:100vh}.topbar{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}.crumb{font-size:12px;color:var(--muted)}.crumb strong{color:var(--ink);font-size:14px}.top-actions{display:flex;gap:9px}.btn{border:1px solid #d8e2ea;background:#fff;color:#33536e;padding:9px 12px;border-radius:7px;font-weight:700;font-size:12px}.btn:hover{background:#f3f8fc}.btn.primary{border-color:var(--blue);background:var(--blue);color:white}.btn.soft{border-color:#d2e4f1;background:var(--pale);color:#1e6592}.btn.danger{color:var(--red)}.content{padding:25px 28px;max-width:1450px;margin:auto}.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}.eyebrow{font-size:10px;font-weight:800;letter-spacing:1.5px;color:#6e879e}.heading h1{font-size:25px;margin:5px 0 0;letter-spacing:-.5px}.heading p{margin:6px 0 0;color:var(--muted);font-size:12px}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}.stat,.panel,.card{background:white;border:1px solid var(--line);border-radius:9px}.stat{padding:17px}.stat small{color:var(--muted);font-size:11px}.stat strong{display:block;font-size:23px;margin-top:9px}.stat em{font-style:normal;color:#8094a6;font-size:11px}.panel{padding:17px;margin-bottom:16px}.panel-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.panel-title h2{font-size:15px;margin:0}.panel-title small{font-weight:400;color:var(--muted)}.recent-list{display:grid}.recent-row{display:grid;grid-template-columns:130px 1.15fr 1fr 1fr 110px 80px;gap:10px;align-items:center;padding:12px 4px;border-top:1px solid #eef1f4;font-size:12px}.recent-row:first-child{border-top:0}.recent-row strong{font-size:12px}.recent-row small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.badge{display:inline-flex;align-items:center;border-radius:20px;background:#eff3f6;color:#536a7d;padding:5px 8px;font-size:10px;font-weight:700;white-space:nowrap}.badge.green{background:#e7f4ec;color:var(--green)}.badge.amber{background:#fff4df;color:var(--amber)}.badge.blue{background:#e7f2fa;color:#286d99}.toolbar{display:flex;gap:9px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.toolbar input,.toolbar select{border:1px solid #dbe4eb;border-radius:7px;padding:9px 10px;background:white;color:var(--ink);font-size:12px}.toolbar input[type=search]{min-width:220px;flex:1}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px;background:white}table{border-collapse:collapse;width:100%;min-width:850px}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid #edf1f4;vertical-align:middle;font-size:12px}th{position:sticky;top:0;background:#f8fafc;color:#60778b;font-size:10px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}th button{border:0;background:none;color:inherit;font-size:inherit;font-weight:800;text-transform:inherit;letter-spacing:inherit;padding:0}tbody tr:hover{background:#fbfdff}td strong{font-size:12px}td small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.check-cell{width:38px}.check-cell input{width:16px;height:16px;accent-color:var(--blue)}.bulkbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:#edf6fc;border:1px solid #d6e7f2;border-radius:8px;padding:12px;margin:0 0 12px}.bulkbar strong{font-size:12px;margin-right:auto}.bulkbar select,.bulkbar input{padding:8px;border:1px solid #d4e1ea;border-radius:6px;background:#fff;font-size:12px}.cards{grid-template-columns:repeat(3,minmax(0,1fr))}.entity-card{padding:16px}.entity-card h3{margin:0 0 5px;font-size:14px}.entity-card p{font-size:11px;color:var(--muted);line-height:1.55;margin:6px 0}.entity-card .card-actions{display:flex;gap:7px;margin-top:12px}.route{display:grid;grid-template-columns:1fr 1fr;gap:12px}.routebox{border:1px solid var(--line);border-radius:8px;padding:13px}.routebox small{display:block;font-size:9px;letter-spacing:1px;color:#71879a;font-weight:800}.routebox strong{display:block;margin-top:7px;font-size:13px}.routebox p{margin:5px 0 0;color:var(--muted);font-size:11px;line-height:1.5}.mission-list{display:grid;gap:9px}.empty{padding:32px;text-align:center;color:var(--muted);font-size:13px}.notice{margin:10px 0;padding:10px;border-radius:7px;background:#eaf5ee;color:#287247;font-size:12px}.notice.error{background:#faeeee;color:#984745}.modal-backdrop{position:fixed;inset:0;background:#132d456b;z-index:20;display:none;align-items:center;justify-content:center;padding:15px}.modal-backdrop.open{display:flex}.modal{background:white;border-radius:12px;width:min(760px,100%);max-height:92vh;overflow:auto;padding:21px;box-shadow:0 20px 60px #0d233533}.modal-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}.modal-header h2{margin:0;font-size:19px}.modal-header p{margin:5px 0 0;color:var(--muted);font-size:12px}.x{border:0;background:none;font-size:23px;color:#8091a1}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{display:grid;gap:5px}.field.wide{grid-column:1/-1}.field label{font-size:10px;font-weight:800;color:#5f7589}.field input,.field select,.field textarea{width:100%;border:1px solid #d9e2e9;border-radius:6px;padding:9px;font-size:12px;background:white;color:var(--ink)}.field textarea{min-height:62px;resize:vertical}.form-section{grid-column:1/-1;border-top:1px solid var(--line);padding-top:13px;margin-top:3px;font-size:12px;font-weight:800}.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.car-form{display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;gap:8px;align-items:end}.car-form .field input{min-width:0}.mission-detail{position:fixed;inset:0 0 0 auto;width:min(640px,100%);background:white;z-index:12;box-shadow:-15px 0 50px #102d4c26;transform:translateX(105%);transition:transform .2s;overflow:auto;padding:24px}.mission-detail.open{transform:none}.detail-head{display:flex;justify-content:space-between}.detail-head h2{margin:3px 0 5px}.detail-head p{margin:0;color:var(--muted);font-size:12px}.detail-block{padding:15px 0;border-bottom:1px solid var(--line)}.detail-block h3{font-size:12px;margin:0 0 10px}.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.info-grid span{font-size:10px;color:var(--muted)}.info-grid strong{display:block;color:var(--ink);font-size:12px;margin-top:4px}.notification{background:#f4f9fc;border:1px solid #dfeaf1;border-radius:8px;padding:12px;margin:8px 0}.notification h4{font-size:12px;margin:0 0 6px}.notification p{font-size:11px;color:#60778b;line-height:1.5}.notification-actions{display:flex;gap:6px;flex-wrap:wrap}.doc-row{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:9px 0;font-size:11px}.doc-row:first-of-type{border-top:0}.summary{line-height:1.65;font-size:13px;color:#526a7d}.summary h3{font-size:14px;color:var(--ink);margin:18px 0 5px}.summary ul{margin:5px 0;padding-left:20px}.hide{display:none!important}
@media(max-width:950px){.sidebar{width:190px}.main{margin-left:190px;width:calc(100% - 190px)}.stats{grid-template-columns:repeat(2,1fr)}.recent-row{grid-template-columns:100px 1fr 1fr 100px}.recent-row>*:nth-child(3){display:none}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){.sidebar{width:62px;padding:14px 6px}.brand{padding:5px 9px 20px;font-size:0}.brand:before{content:'AD';font-size:16px;color:white}.brand span,.brand small,.nav-label,.nav button:not(.active) .label,.nav .label,.sidebar-foot{display:none}.nav button{justify-content:center;padding:12px 4px}.nav .icon{font-size:17px}.main{margin-left:62px;width:calc(100% - 62px)}.topbar{padding:0 13px;height:60px}.content{padding:17px 12px}.heading{align-items:flex-start;flex-direction:column}.heading h1{font-size:22px}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:19px}.cards{grid-template-columns:1fr}.route{grid-template-columns:1fr}.recent-row{grid-template-columns:88px 1fr 90px}.recent-row>*:nth-child(4){display:none}.form-grid{grid-template-columns:1fr}.field.wide,.form-section{grid-column:1}.car-form{grid-template-columns:1fr 1fr}.mission-mini{grid-template-columns:24px 1fr 95px}.heading>.btn{align-self:flex-start}.toolbar input[type=search]{min-width:100%}}
</style>
</head>
<body>

<div class="loading-bar" id="loading-bar"></div>

<!-- ═══════════ AUTH ═══════════ -->
<div id="auth-screen" class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">auto<span>dispatch</span><small>TRANSPORT MANAGEMENT</small></div>
    <div class="auth-title">Connexion</div>
    <div class="field"><label>E-MAIL</label><input id="login-email" type="email" placeholder="votre@email.com" autocomplete="email"></div>
    <div class="field" style="margin-top:9px"><label>MOT DE PASSE</label><input id="login-pwd" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"></div>
    <div class="auth-err" id="login-err"></div>
    <button class="btn primary" style="width:100%;padding:11px" onclick="login()">Se connecter</button>
  </div>
</div>

<!-- ═══════════ APP ═══════════ -->
<div class="shell" id="app-shell" style="display:none">
  <aside class="sidebar">
    <div class="brand">auto<span>dispatch</span><small>TRANSPORT MANAGEMENT</small></div>
    <div class="nav-label">ESPACE DE TRAVAIL</div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div id="user-info" style="margin-bottom:10px;word-break:break-all"></div>
      <button onclick="logout()" style="width:100%;background:transparent;border:1px solid #294d6c;color:#acc2d4;border-radius:6px;padding:8px;font-size:11px;font-weight:600;cursor:pointer">Déconnexion</button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="crumb">AutoDispatch　›　<strong id="crumb">Vue d'ensemble</strong></div>
      <div class="top-actions">
        <button class="btn" onclick="refreshAll()">↺ Actualiser</button>
        <button class="btn primary" onclick="openMissionForm()">＋ Nouvelle mission</button>
      </div>
    </header>
    <div class="content"><section id="view"></section></div>
  </main>
</div>

<div class="modal-backdrop" id="modal"><div class="modal" id="modal-content"></div></div>
<aside id="detail" class="mission-detail"></aside>

<!-- Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════
//  CONFIG — remplace les deux valeurs ci-dessous par celles de
//  ton projet Supabase : Settings → API → Project URL & anon key
// ═══════════════════════════════════════════════════════════════
const SUPABASE_URL  = 'https://XXXX.supabase.co';
const SUPABASE_ANON = 'eyJ...';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

// ─── STATE ──────────────────────────────────────────────────────
const NAV=[["Vue d'ensemble",'⌂'],['Planning','▦'],['Missions','▤'],['Véhicules','▣'],['Clients','◫'],['Transporteurs','▰'],['Documents','▧'],['Finance','€'],['Résumé','i']];
let db={clients:[],carriers:[],missions:[],selectedIds:[],sort:'ref',direction:1};
let current="Vue d'ensemble",search='',filterStatus='Tous les statuts';
let editingMission=null,detailId=null,currentUser=null;

// ─── UTILS ──────────────────────────────────────────────────────
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const getClient=m=>db.clients.find(x=>x.id===m.clientId)||{};
const getCarrier=m=>db.carriers.find(x=>x.id===m.carrierId)||{};
const pretty=d=>d?new Date(d+'T12:00:00').toLocaleDateString('fr-BE',{day:'numeric',month:'short',year:'numeric'}):'À confirmer';
const val=id=>document.getElementById(id)?.value.trim()||'';
const setLoading=on=>document.getElementById('loading-bar').classList.toggle('on',on);

// ─── AUTH ────────────────────────────────────────────────────────
async function checkAuth(){
  setLoading(true);
  const {data:{session}}=await sb.auth.getSession();
  setLoading(false);
  if(session){currentUser=session.user;await initApp();}
  else{document.getElementById('auth-screen').style.display='flex';}
}

async function login(){
  const email=document.getElementById('login-email').value.trim();
  const pwd=document.getElementById('login-pwd').value;
  const err=document.getElementById('login-err');
  err.textContent='';
  if(!email||!pwd){err.textContent='Complète les deux champs.';return;}
  setLoading(true);
  const {error}=await sb.auth.signInWithPassword({email,password:pwd});
  setLoading(false);
  if(error){err.textContent=error.message;return;}
  const {data:{session}}=await sb.auth.getSession();
  currentUser=session.user;
  await initApp();
}

async function logout(){
  await sb.auth.signOut();
  currentUser=null;
  db={clients:[],carriers:[],missions:[],selectedIds:[],sort:'ref',direction:1};
  document.getElementById('app-shell').style.display='none';
  document.getElementById('auth-screen').style.display='flex';
  document.getElementById('login-err').textContent='';
}

async function initApp(){
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('app-shell').style.display='flex';
  document.getElementById('user-info').textContent=currentUser?.email||'';
  await loadData();
  boot();
}

// ─── DATA LOAD ───────────────────────────────────────────────────
function mapPartner(x){
  return{id:x.id,name:x.name||'',contact:x.contact||'',email:x.email||'',
    billingEmail:x.billing_email||'',vat:x.vat||'',phone:x.phone||'',
    street:x.street||'',postal:x.postal||'',city:x.city||'',country:x.country||''};
}

async function loadData(){
  setLoading(true);
  try{
    const[r1,r2,r3,r4,r5,r6]=await Promise.all([
      sb.from('clients').select('*').order('name'),
      sb.from('carriers').select('*').order('name'),
      sb.from('missions').select('*').order('created_at'),
      sb.from('cars').select('*'),
      sb.from('notifications').select('*').order('created_at'),
      sb.from('documents').select('*')
    ]);
    db.clients=(r1.data||[]).map(mapPartner);
    db.carriers=(r2.data||[]).map(mapPartner);
    const cars=r4.data||[],notifs=r5.data||[],docs=r6.data||[];
    db.missions=(r3.data||[]).map(m=>({
      id:m.id,ref:m.ref||'',
      clientId:m.client_id||'',carrierId:m.carrier_id||'',
      pickupSite:m.pickup_site||'',pickupStreet:m.pickup_street||'',
      pickupPostal:m.pickup_postal||'',pickupCity:m.pickup_city||'',
      pickupCountry:m.pickup_country||'',pickupContact:m.pickup_contact||'',
      deliverySite:m.delivery_site||'',deliveryStreet:m.delivery_street||'',
      deliveryPostal:m.delivery_postal||'',deliveryCity:m.delivery_city||'',
      deliveryCountry:m.delivery_country||'',deliveryContact:m.delivery_contact||'',
      pickupDate:m.pickup_date||'',deliveryDate:m.delivery_date||'',
      status:m.status||'à planifier',
      cars:cars.filter(c=>c.mission_id===m.id).map(c=>({
        id:c.id,make:c.make||'',model:c.model||'',vin:c.vin||'',plate:c.plate||'',
        status:c.status||'à charger',
        docs:docs.filter(d=>d.car_id===c.id).map(d=>({id:d.id,name:d.name||'',phase:d.phase||'',date:d.date||''}))
      })),
      notifications:notifs.filter(n=>n.mission_id===m.id).map(n=>({
        id:n.id,kind:n.kind||'',status:n.status||'pending',
        pickupDate:n.pickup_date||'',deliveryDate:n.delivery_date||'',createdAt:n.created_at
      }))
    }));
  }catch(e){console.error(e);alert('Erreur de chargement : '+e.message);}
  setLoading(false);
}

async function refreshAll(){
  await loadData();render();
  if(detailId)openDetail(detailId);
}

// ─── DB WRITE ────────────────────────────────────────────────────
async function dbUpsertMission(m){
  const{error}=await sb.from('missions').upsert({
    id:m.id,ref:m.ref,client_id:m.clientId||null,carrier_id:m.carrierId||null,
    pickup_site:m.pickupSite,pickup_street:m.pickupStreet,pickup_postal:m.pickupPostal,
    pickup_city:m.pickupCity,pickup_country:m.pickupCountry,pickup_contact:m.pickupContact,
    delivery_site:m.deliverySite,delivery_street:m.deliveryStreet,delivery_postal:m.deliveryPostal,
    delivery_city:m.deliveryCity,delivery_country:m.deliveryCountry,delivery_contact:m.deliveryContact,
    pickup_date:m.pickupDate||null,delivery_date:m.deliveryDate||null,status:m.status
  });
  if(error)console.error('mission',error);
}

async function dbUpsertCar(c,missionId){
  const{error}=await sb.from('cars').upsert({
    id:c.id,mission_id:missionId,make:c.make,model:c.model,
    vin:c.vin||null,plate:c.plate||null,status:c.status
  });
  if(error)console.error('car',error);
}

async function dbUpsertNotif(n,missionId){
  const{error}=await sb.from('notifications').upsert({
    id:n.id,mission_id:missionId,kind:n.kind,
    pickup_date:n.pickupDate||null,delivery_date:n.deliveryDate||null,status:n.status
  });
  if(error)console.error('notif',error);
}

async function dbUpsertPartner(table,p){
  const{error}=await sb.from(table).upsert({
    id:p.id,name:p.name,contact:p.contact||null,email:p.email||null,
    billing_email:p.billingEmail||null,vat:p.vat||null,phone:p.phone||null,
    street:p.street||null,postal:p.postal||null,city:p.city||null,country:p.country||null
  });
  if(error)console.error('partner',error);
}

async function dbDelete(table,id){
  const{error}=await sb.from(table).delete().eq('id',id);
  if(error)console.error('delete',error);
}

// ─── NAV & RENDER ────────────────────────────────────────────────
function setView(v){
  current=v;
  document.getElementById('crumb').textContent=v;
  render();
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.name===v));
}

function boot(){
  document.getElementById('nav').innerHTML=NAV.map(([n,i])=>
    `<button data-name="${esc(n)}" onclick="setView('${esc(n)}')"><span class="icon">${i}</span><span class="label">${esc(n)}</span></button>`
  ).join('');
  setView(current);
}

function render(){
  const view=document.getElementById('view');if(!view)return;
  if(current==="Vue d'ensemble")view.innerHTML=dashboard();
  else if(current==='Résumé')view.innerHTML=summary();
  else if(current==='Clients'||current==='Transporteurs')view.innerHTML=partnersPage(current==='Clients'?'clients':'carriers');
  else if(current==='Planning')view.innerHTML=planning();
  else if(current==='Missions')view.innerHTML=missionsPage();
  else if(current==='Véhicules')view.innerHTML=vehiclesPage();
  else if(current==='Documents')view.innerHTML=documentsPage();
  else view.innerHTML=financePage();
}

function heading(title,sub,button=''){
  return `<div class="heading"><div><div class="eyebrow">AUTODISPATCH</div><h1>${title}</h1><p>${sub}</p></div>${button}</div>`;
}

// ─── VIEWS ───────────────────────────────────────────────────────
function dashboard(){
  const cars=db.missions.reduce((n,m)=>n+m.cars.length,0);
  const loaded=db.missions.reduce((n,m)=>n+m.cars.filter(c=>c.status==='chargé'||c.status==='livré').length,0);
  return heading("Vue d'ensemble",'Suivi des missions et des véhicules.')+
  `<div class="grid stats">
    <div class="stat"><small>Missions actives</small><strong>${db.missions.filter(m=>m.status!=='livré').length}</strong><em>${db.missions.length} au total</em></div>
    <div class="stat"><small>Véhicules</small><strong>${cars}</strong><em>${loaded} chargés ou livrés</em></div>
    <div class="stat"><small>Clients</small><strong>${db.clients.length}</strong><em>dans le répertoire</em></div>
    <div class="stat"><small>Transporteurs</small><strong>${db.carriers.length}</strong><em>dans le répertoire</em></div>
  </div>
  <div class="panel"><div class="panel-title"><h2>Missions récentes <small>· ${db.missions.length}</small></h2><button class="btn" onclick="setView('Missions')">Toutes les missions</button></div>
  <div class="recent-list">${db.missions.length?db.missions.slice().reverse().slice(0,6).map(m=>`<div class="recent-row"><strong>${esc(m.ref)}<small>${esc(getClient(m).name||'—')}</small></strong><span>${esc(m.pickupCity||'—')} → ${esc(m.deliveryCity||'—')}</span><span>Chargement ${pretty(m.pickupDate)}<small>Livraison ${pretty(m.deliveryDate)}</small></span>${badge(m.status)}</div>`).join(''):'<div class="empty">Aucune mission. Crée une mission pour commencer.</div>'}</div></div>
  <div class="panel"><div class="panel-title"><h2>Actions rapides</h2></div><div class="toolbar"><button class="btn soft" onclick="setView('Planning')">Ouvrir le planning</button><button class="btn soft" onclick="setView('Clients')">Gérer les clients</button><button class="btn soft" onclick="setView('Transporteurs')">Gérer les transporteurs</button></div></div>`;
}

function badge(s){return `<span class="badge ${s==='livré'||s==='chargé'||s==='payé'?'green':s==='en transport'?'blue':s==='à planifier'?'amber':''}">${esc(s)}</span>`}

function filterTool(){return `<div class="toolbar"><input type="search" placeholder="Rechercher client, mission, VIN, plaque…" value="${esc(search)}" oninput="search=this.value;render()"><select onchange="filterStatus=this.value;render()"><option>Tous les statuts</option>${['à planifier','attribué','à charger','en transport','livré','à facturer','facturé','payé'].map(x=>`<option ${filterStatus===x?'selected':''}>${x}</option>`).join('')}</select></div>`}

function filteredMissions(){return db.missions.filter(m=>(filterStatus==='Tous les statuts'||m.status===filterStatus)&&JSON.stringify([m,getClient(m),getCarrier(m)]).toLowerCase().includes(search.toLowerCase()))}

function tableRows(selectable=false,rows=filteredMissions()){
  let entries=rows.flatMap(m=>m.cars.map(c=>({m,c})));
  entries.sort((a,b)=>String(a.m[db.sort]||a.c[db.sort]||'').localeCompare(String(b.m[db.sort]||b.c[db.sort]||''),'fr',{numeric:true})*db.direction);
  return entries.map(({m,c})=>`<tr>${selectable?`<td class="check-cell"><input type="checkbox" ${db.selectedIds.includes(c.id)?'checked':''} onchange="toggleSelected('${esc(c.id)}',this.checked)"></td>`:''}<td><strong>${esc(m.ref)}</strong><small>${esc(getClient(m).name||'—')}</small></td><td><strong>${esc(c.make)} ${esc(c.model)}</strong><small>${esc(c.vin||'VIN à ajouter')}</small></td><td>${esc(c.plate||'—')}</td><td>${esc(m.pickupCity||'—')}</td><td>${esc(m.deliveryCity||'—')}</td><td>${pretty(m.pickupDate)}</td><td>${pretty(m.deliveryDate)}</td><td>${badge(c.status)}</td><td><button class="btn" onclick="openDetail('${esc(m.id)}')">Ouvrir</button></td></tr>`).join('')||`<tr><td colspan="10" class="empty">Aucun véhicule à afficher.</td></tr>`;
}

function dataTable(selectable=false){return `<div class="table-wrap"><table><thead><tr>${selectable?'<th class="check-cell">✓</th>':''}${[['ref','Mission / client'],['make','Véhicule / VIN'],['plate','Plaque'],['pickupCity','Ville chargement'],['deliveryCity','Ville déchargement'],['pickupDate','Date chargement'],['deliveryDate','Date livraison'],['status','Statut']].map(([k,l])=>`<th><button onclick="sortBy('${k}')">${l}　↕</button></th>`).join('')}<th></th></tr></thead><tbody>${tableRows(selectable)}</tbody></table></div>`}

function sortBy(k){if(db.sort===k)db.direction*=-1;else{db.sort=k;db.direction=1}render();}

function planning(){
  const count=db.selectedIds.length;
  return heading('Planning','Sélectionne plusieurs véhicules, puis affecte-les en une fois.')+
  `<div class="panel"><div class="panel-title"><h2>Véhicules à planifier</h2><small>La case de sélection se trouve à gauche de Mission / client.</small></div><div class="bulkbar"><strong>${count} véhicule(s) sélectionné(s)</strong><select id="bulk-carrier"><option value="">Choisir le transporteur…</option>${db.carriers.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}</select><button class="btn" onclick="assignCarrier()">Affecter au transporteur</button><input type="email" id="bulk-email" placeholder="E-mail transporteur"><button class="btn primary" onclick="openCarrierDraft()">Ouvrir le bon groupé</button><input type="email" id="yard-email" placeholder="E-mail du parc"><button class="btn" onclick="openYardDraft()">Annonce parc</button><button class="btn" onclick="selectAll(true)">Tout cocher</button><button class="btn" onclick="selectAll(false)">Tout décocher</button></div>${filterTool()}${dataTable(true)}</div>`;
}

function missionsPage(){return heading('Missions','Toutes les missions, avec recherche et tri.')+`<div class="panel">${filterTool()}${dataTable(false)}</div>`;}
function vehiclesPage(){return heading('Véhicules','VIN, plaques, villes et dates de transport.')+`<div class="panel">${filterTool()}${dataTable(false)}</div>`;}

function financePage(){

  return heading('Récapitulatif','Architecture et fonctions couvertes par AutoDispatch.')+
  `<div class="panel summary"><h3>Flux opérationnel</h3><ul><li>Créer une mission client avec adresses complètes, sites, contacts et plusieurs véhicules.</li><li>VIN 17 caractères sans I/O/Q et plaques par véhicule.</li><li>Planifier : date de chargement et date prévue de livraison.</li><li>Sélection groupée dans Planning et affectation en une fois à un transporteur.</li><li>Bon de transport groupé et annonce au parc par e-mail.</li><li>Répertoire clients et transporteurs avec TVA, téléphone, e-mail et adresse.</li><li>Notifications client de planification et de chargement, avec brouillon e-mail.</li></ul><h3>Architecture</h3><ul><li>Base de données PostgreSQL sur Supabase — données partagées entre tous les utilisateurs authentifiés.</li><li>Authentification par e-mail et mot de passe via Supabase Auth.</li><li>Fichiers et photos : à connecter via Supabase Storage (prochaine étape).</li><li>Hébergement sur GitHub Pages ou Vercel — déploiement automatique à chaque push.</li><li>Ce fichier HTML unique se connecte directement à Supabase via le SDK JS.</li></ul></div>`;
}

// ─── ACTIONS ─────────────────────────────────────────────────────
function toggleSelected(id,on){db.selectedIds=db.selectedIds.filter(x=>x!==id);if(on)db.selectedIds.push(id);render();}
function selectAll(on){db.selectedIds=on?db.missions.flatMap(m=>m.cars.map(c=>c.id)):[];render();}
function selectedVehicles(){return db.missions.flatMap(m=>m.cars.filter(c=>db.selectedIds.includes(c.id)).map(c=>({m,c})));}

async function assignCarrier(){
  const id=document.getElementById('bulk-carrier').value;
  if(!id){alert('Choisis un transporteur.');return;}
  const items=selectedVehicles();
  if(!items.length){alert('Coche au moins un véhicule.');return;}
  setLoading(true);
  const mids=[...new Set(items.map(({m})=>m.id))];
  for(const mid of mids){const m=db.missions.find(x=>x.id===mid);m.carrierId=id;await sb.from('missions').update({carrier_id:id}).eq('id',mid);}
  setLoading(false);
  alert('Transporteur affecté.');render();
}

function openCarrierDraft(){
  const items=selectedVehicles(),email=document.getElementById('bulk-email').value.trim();
  if(!items.length){alert("Coche d'abord les véhicules.");return;}
  if(!email){alert("Ajoute l'e-mail du transporteur.");return;}
  const body="Bonjour,\n\nMerci de prendre en charge les véhicules suivants :\n\n"+items.map(({m,c},i)=>`${i+1}. ${c.make} ${c.model} · VIN ${c.vin||'à renseigner'} · Plaque ${c.plate||'à renseigner'}\nMission ${m.ref} · Client ${getClient(m).name||'—'}\nChargement ${m.pickupCity} le ${pretty(m.pickupDate)} → Livraison ${m.deliveryCity} le ${pretty(m.deliveryDate)}`).join('\n\n')+'\n\nCordialement';
  location.href=`mailto:${encodeURIComponent(email)}?subject=${encodeURIComponent(`Bon de transport · ${items.length} véhicule(s)`)}&body=${encodeURIComponent(body)}`;
}

function openYardDraft(){
  const items=selectedVehicles(),email=document.getElementById('yard-email').value.trim();
  if(!items.length){alert("Coche d'abord les véhicules.");return;}
  if(!email){alert("Ajoute l'e-mail du parc.");return;}
  const body="Bonjour,\n\nAnnonce des véhicules à charger :\n\n"+items.map(({m,c},i)=>`${i+1}. ${c.make} ${c.model} · VIN ${c.vin||'à renseigner'} · Plaque ${c.plate||'à renseigner'}\nParc : ${m.pickupSite} · ${pretty(m.pickupDate)} · Mission ${m.ref}`).join('\n\n')+'\n\nCordialement';
  location.href=`mailto:${encodeURIComponent(email)}?subject=${encodeURIComponent(`Annonce parc · ${items.length} véhicule(s)`)}&body=${encodeURIComponent(body)}`;
}

ille *</label><input id="f-delivcity" value="${esc(m?.deliveryCity||'')}"></div><div class="field"><label>Pays *</label><input id="f-delivcountry" value="${esc(m?.deliveryCountry||'Belgique')}"></div><div class="form-section">DATES</div><div class="field"><label>Date de chargement</label><input id="f-load-date" type="date" value="${esc(m?.pickupDate||'')}"></div><div class="field"><label>Date prévue de livraison</label><input id="f-deliv-date" type="date" value="${esc(m?.deliveryDate||'')}"></div><div class="form-section">VÉHICULE</div><div class="car-form"><div class="field"><label>Marque *</label><input id="f-make" value="${esc(m?.cars?.[0]?.make||'')}" placeholder="BMW"></div><div class="field"><label>Modèle *</label><input id="f-model" value="${esc(m?.cars?.[0]?.model||'')}" placeholder="X5"></div><div class="field"><label>VIN</label><input id="f-vin" value="${esc(m?.cars?.[0]?.vin||'')}" placeholder="17 caractères"></div><div class="field"><label>Plaque</label><input id="f-plate" value="${esc(m?.cars?.[0]?.plate||'')}"></div><button class="btn" onclick="addVehicleField()">＋ véhicule</button></div><div id="extra-cars" class="field wide"></div></div><div id="form-error"></div><div class="modal-footer"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="saveMission()">${m?'Enregistrer':'Créer la mission'}</button></div>`;

function addVehicleField(){
  const node=document.createElement('div');
  node.className='car-form';node.style.marginTop='8px';
  node.innerHTML='<div class="field"><label>Marque</label><input data-extra="make"></div><div class="field"><label>Modèle</label><input data-extra="model"></div><div class="field"><label>VIN</label><input data-extra="vin"></div><div class="field"><label>Plaque</label><input data-extra="plate"></div><button class="btn" type="button" onclick="this.parentElement.remove()">Retirer</button>';
  document.getElementById('extra-cars').appendChild(node);
}

async function saveMission(){
  const err=document.getElementById('form-error');
  const vin=val('f-vin').toUpperCase();
  if(!val('f-client')||!val('f-picksite')||!val('f-pickstreet')||!val('f-pickpostal')||!val('f-pickcity')||!val('f-delivsite')||!val('f-delivstreet')||!val('f-delivpostal')||!val('f-delivcity')||!val('f-make')||!val('f-model')){err.innerHTML='<div class="notice error">Complète le client, les noms de site, les deux adresses et la marque / le modèle.</div>';return;}
  if(vin&&!/^[A-HJ-NPR-Z0-9]{17}$/.test(vin)){err.innerHTML='<div class="notice error">Le VIN doit faire 17 caractères sans I, O ni Q.</div>';return;}
  const old=editingMission?db.missions.find(x=>x.id===editingMission):null;
  let cars=old?[...old.cars]:[];
  if(old)cars[0]={...cars[0],make:val('f-make'),model:val('f-model'),vin,plate:val('f-plate')};
  else cars=[{id:crypto.randomUUID(),make:val('f-make'),model:val('f-model'),vin,plate:val('f-plate'),status:'à charger',docs:[]}];
  document.querySelectorAll('#extra-cars .car-form').forEach(row=>{
    const get=k=>row.querySelector(`[data-extra="${k}"]`).value.trim();
    cars.push({id:crypto.randomUUID(),make:get('make'),model:get('model'),vin:get('vin').toUpperCase(),plate:get('plate').toUpperCase(),status:'à charger',docs:[]});
  });
  const m={...(old||{}),id:old?.id||crypto.randomUUID(),ref:val('f-ref'),clientId:val('f-client'),
    pickupSite:val('f-picksite'),pickupContact:val('f-pickcontact'),pickupStreet:val('f-pickstreet'),
    pickupPostal:val('f-pickpostal'),pickupCity:val('f-pickcity'),pickupCountry:val('f-pickcountry'),
    deliverySite:val('f-delivsite'),deliveryContact:val('f-delivcontact'),deliveryStreet:val('f-delivstreet'),
    deliveryPostal:val('f-delivpostal'),deliveryCity:val('f-delivcity'),deliveryCountry:val('f-delivcountry'),
    pickupDate:val('f-load-date'),deliveryDate:val('f-deliv-date'),
    status:old?.status||'à planifier',cars,notifications:old?.notifications||[]};
  if(old&&(old.pickupDate!==m.pickupDate||old.deliveryDate!==m.deliveryDate)&&(m.pickupDate||m.deliveryDate))
    m.notifications.push({id:crypto.randomUUID(),kind:'planned',pickupDate:m.pickupDate,deliveryDate:m.deliveryDate,status:'pending',createdAt:new Date().toISOString()});
  if(!old&&(m.pickupDate||m.deliveryDate))
    m.notifications.push({id:crypto.randomUUID(),kind:'planned',pickupDate:m.pickupDate,deliveryDate:m.deliveryDate,status:'pending',createdAt:new Date().toISOString()});
  setLoading(true);
  await dbUpsertMission(m);
  for(const c of m.cars)await dbUpsertCar(c,m.id);
  for(const n of m.notifications)await dbUpsertNotif(n,m.id);
  setLoading(false);
  if(old)db.missions=db.missions.map(x=>x.id===old.id?m:x);else db.missions.push(m);
  closeModal();render();
}

function partnerForm(kind,id){
  const arr=db[kind],p=id?arr.find(x=>x.id===id):{};
  document.getElementById('modal-content').innerHTML=`<div class="modal-header"><div><h2>${id?'Modifier':'Ajouter'} ${kind==='clients'?'un client':'un transporteur'}</h2><p>Coordonnées de contact et facturation.</p></div><button class="x" onclick="closeModal()">×</button></div><div class="form-grid"><div class="field"><label>SOCIÉTÉ *</label><input id="p-name" value="${esc(p.name||'')}"></div><div class="field"><label>TVA</label><input id="p-vat" value="${esc(p.vat||'')}"></div><div class="field"><label>CONTACT</label><input id="p-contact" value="${esc(p.contact||'')}"></div><div class="field"><label>TÉLÉPHONE</label><input id="p-phone" value="${esc(p.phone||'')}"></div><div class="field"><label>E-MAIL PRINCIPAL</label><input id="p-email" type="email" value="${esc(p.email||'')}"></div><div class="field"><label>E-MAIL FACTURATION</label><input id="p-billing" type="email" value="${esc(p.billingEmail||'')}"></div><div class="field wide"><label>RUE ET NUMÉRO</label><input id="p-street" value="${esc(p.street||'')}"></div><div class="field"><label>CODE POSTAL</label><input id="p-postal" value="${esc(p.postal||'')}"></div><div class="field"><label>VILLE</label><input id="p-city" value="${esc(p.city||'')}"></div><div class="field"><label>PAYS</label><input id="p-country" value="${esc(p.country||'Belgique')}"></div></div><div id="form-error"></div><div class="modal-footer"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="savePartner('${kind}','${esc(id||'')}')">Enregistrer</button></div>`;
  document.getElementById('modal').classList.add('open');
}

async function savePartner(kind,id){
  if(!val('p-name')){document.getElementById('form-error').innerHTML='<div class="notice error">Indique le nom de la société.</div>';return;}
  const p={id:id||crypto.randomUUID(),name:val('p-name'),vat:val('p-vat'),contact:val('p-contact'),phone:val('p-phone'),email:val('p-email'),billingEmail:val('p-billing'),street:val('p-street'),postal:val('p-postal'),city:val('p-city'),country:val('p-country')};
  const table=kind==='clients'?'clients':'carriers';
  setLoading(true);
  await dbUpsertPartner(table,p);
  setLoading(false);
  db[kind]=id?db[kind].map(x=>x.id===id?p:x):[...db[kind],p];
  closeModal();render();
}

async function deletePartner(kind,id){
  if(!confirm('Supprimer cette fiche ?'))return;
  const table=kind==='clients'?'clients':'carriers';
  setLoading(true);
  await dbDelete(table,id);
  setLoading(false);
  db[kind]=db[kind].filter(x=>x.id!==id);render();
}

function closeModal(){document.getElementById('modal').classList.remove('open');}

function openDetail(id){
  detailId=id;
  const m=db.missions.find(x=>x.id===id);if(!m)return;
  const d=document.getElementById('detail');
  d.innerHTML=`<div class="detail-head"><div><div class="eyebrow">FICHE MISSION</div><h2>${esc(m.ref)}</h2><p>${esc(getClient(m).name||'—')} · ${badge(m.status)}</p></div><button class="x" onclick="closeDetail()">×</button></div><div class="detail-block"><h3>Dates et adresses</h3><div class="route"><div class="routebox"><small>ENLÈVEMENT · ${pretty(m.pickupDate)}</small><strong>${esc(m.pickupSite)}</strong><p>${esc([m.pickupStreet,m.pickupPostal,m.pickupCity,m.pickupCountry].filter(Boolean).join(', '))}<br>Contact : ${esc(m.pickupContact||'—')}</p></div><div class="routebox"><small>LIVRAISON · ${pretty(m.deliveryDate)}</small><strong>${esc(m.deliverySite)}</strong><p>${esc([m.deliveryStreet,m.deliveryPostal,m.deliveryCity,m.deliveryCountry].filter(Boolean).join(', '))}<br>Contact : ${esc(m.deliveryContact||'—')}</p></div></div><p><button class="btn" onclick="openMissionForm('${esc(m.id)}')">Modifier la mission / dates</button></p></div><div class="detail-block"><h3>Transporteur</h3><div class="info-grid"><span>Société<strong>${esc(getCarrier(m).name||'À attribuer')}</strong></span><span>E-mail<strong>${esc(getCarrier(m).email||'—')}</strong></span></div></div><div class="detail-block"><h3>Notifications client</h3>${m.notifications?.length?m.notifications.map(n=>`<div class="notification"><h4>${n.kind==='planned'?'Mission planifiée':'Chargement confirmé'} · ${n.status==='sent'?'envoyé':'à préparer'}</h4><p>Chargement ${pretty(n.pickupDate)} · Livraison prévue ${pretty(n.deliveryDate)}<br>Le brouillon doit être vérifié puis envoyé dans Outlook.</p>${n.status!=='sent'?`<div class="notification-actions"><button class="btn primary" onclick="draftClient('${esc(m.id)}','${esc(n.id)}')">Ouvrir l'e-mail client</button><button class="btn" onclick="markSent('${esc(m.id)}','${esc(n.id)}')">Marquer envoyé</button></div>`:''}</div>`).join(''):'<p style="font-size:12px;color:var(--muted)">La notification apparaîtra quand une date sera enregistrée.</p>'}</div><div class="detail-block"><h3>Véhicules · ${m.cars.length}</h3>${m.cars.map(c=>`<div class="notification"><h4>${esc(c.make)} ${esc(c.model)} · ${badge(c.status)}</h4><p>VIN ${esc(c.vin||'—')}<br>Plaque ${esc(c.plate||'—')}</p><div class="toolbar"><select onchange="vehicleStatus('${esc(m.id)}','${esc(c.id)}',this.value)">${['à charger','chargé','livré'].map(s=>`<option ${c.status===s?'selected':''}>${s}</option>`).join('')}</select><label class="btn">Ajouter document<input type="file" hidden onchange="addDoc('${esc(m.id)}','${esc(c.id)}',this.files[0])"></label></div>${(c.docs||[]).map(x=>`<div class="doc-row">${esc(x.name)} <small>${esc(x.phase)}</small></div>`).join('')}</div>`).join('')}</div><div class="detail-block"><h3>Suivi</h3><select onchange="missionStatus('${esc(m.id)}',this.value)">${['à planifier','attribué','à charger','en transport','livré','à facturer','facturé','payé'].map(s=>`<option ${m.status===s?'selected':''}>${s}</option>`).join('')}</select> <button class="btn" onclick="notifyLoaded('${esc(m.id)}')">Confirmer chargé et notifier</button></div>`;
  d.classList.add('open');
}

function closeDetail(){document.getElementById('detail').classList.remove('open');detailId=null;}
function refreshDetail(){render();if(detailId)openDetail(detailId);}

function draftClient(mid,nid){
  const m=db.missions.find(x=>x.id===mid),n=m.notifications.find(x=>x.id===nid);
  const email=getClient(m).email||getClient(m).billingEmail;
  if(!email){alert('Ajoute une adresse e-mail à la fiche client.');return;}
  const loaded=n.kind==='loaded';
  const subject=loaded?`Véhicule chargé · ${m.ref}`:`Planification du véhicule · ${m.ref}`;
  const body=`Bonjour,\n\n${loaded?`Le chargement de la mission ${m.ref} est confirmé.`:`La mission ${m.ref} est planifiée.`}\n\nDate chargement : ${pretty(n.pickupDate)}\nDate prévue de livraison : ${pretty(n.deliveryDate)}\n\nVéhicules :\n${m.cars.map(c=>`${c.make} ${c.model} · VIN ${c.vin||'à renseigner'} · Plaque ${c.plate||'à renseigner'}`).join('\n')}\n\nCordialement`;
  location.href=`mailto:${encodeURIComponent(email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

async function markSent(mid,nid){
  if(!confirm('As-tu bien envoyé le message depuis ta messagerie ?'))return;
  const m=db.missions.find(x=>x.id===mid),n=m.notifications.find(x=>x.id===nid);
  n.status='sent';
  await sb.from('notifications').update({status:'sent'}).eq('id',nid);
  refreshDetail();
}

async function notifyLoaded(id){
  const m=db.missions.find(x=>x.id===id);
  if(m.notifications.some(n=>n.kind==='loaded')){alert('La notification de chargement existe déjà.');return;}
  m.status='en transport';m.cars.forEach(c=>c.status='chargé');
  setLoading(true);
  await sb.from('missions').update({status:'en transport'}).eq('id',id);
  for(const c of m.cars)await sb.from('cars').update({status:'chargé'}).eq('id',c.id);
  const n={id:crypto.randomUUID(),kind:'loaded',pickupDate:m.pickupDate,deliveryDate:m.deliveryDate,status:'pending',createdAt:new Date().toISOString()};
  m.notifications.push(n);
  await dbUpsertNotif(n,id);
  setLoading(false);
  refreshDetail();
}

async function missionStatus(id,status){
  const m=db.missions.find(x=>x.id===id);m.status=status;
  setLoading(true);
  await sb.from('missions').update({status}).eq('id',id);
  if(status==='en transport'&&!m.notifications.some(n=>n.kind==='loaded')){
    const n={id:crypto.randomUUID(),kind:'loaded',pickupDate:m.pickupDate,deliveryDate:m.deliveryDate,status:'pending',createdAt:new Date().toISOString()};
    m.notifications.push(n);await dbUpsertNotif(n,id);
  }
  setLoading(false);refreshDetail();
}

async function vehicleStatus(mid,vid,status){
  const m=db.missions.find(x=>x.id===mid),c=m.cars.find(x=>x.id===vid);
  c.status=status;
  await sb.from('cars').update({status}).eq('id',vid);
  if(status==='chargé'&&m.cars.every(x=>x.status==='chargé'||x.status==='livré')&&!m.notifications.some(n=>n.kind==='loaded'))
    await notifyLoaded(mid);
  else refreshDetail();
}

async function addDoc(mid,vid,file){
  if(!file)return;
  const m=db.missions.find(x=>x.id===mid),c=m.cars.find(x=>x.id===vid);
  const doc={id:crypto.randomUUID(),name:file.name,phase:c.status==='livré'?'livraison':'chargement',date:new Date().toLocaleDateString('fr-BE')};
  c.docs=c.docs||[];c.docs.push(doc);
  await sb.from('documents').insert({id:doc.id,car_id:vid,mission_id:mid,name:doc.name,phase:doc.phase,date:doc.date});
  refreshDetail();
  alert("Document enregistré. Le fichier lui-même sera stocké dans Supabase Storage lors de la prochaine étape.");
}

document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});

checkAuth();
</script>
</body>
</html>
