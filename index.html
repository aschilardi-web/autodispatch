/* ── TOAST NOTIFICATIONS ── */
#toast-container{position:fixed;bottom:22px;right:22px;z-index:900;display:flex;flex-direction:column-reverse;gap:10px;pointer-events:none}
.toast{background:white;border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:10px;padding:14px 38px 14px 14px;box-shadow:0 8px 28px #102d4c1f;min-width:270px;max-width:360px;pointer-events:all;display:flex;gap:11px;align-items:flex-start;animation:toast-in .22s ease;position:relative}
@keyframes toast-in{from{transform:translateX(115%);opacity:0}to{transform:none;opacity:1}}
.toast.out{animation:toast-out .28s ease forwards}
@keyframes toast-out{to{transform:translateX(115%);opacity:0}}
.toast.success{border-left-color:var(--green)}
.toast.warning{border-left-color:var(--amber)}
.toast-icon{font-size:19px;line-height:1;flex-shrink:0;margin-top:1px}
.toast-body{flex:1;min-width:0}
.toast-title{font-weight:800;font-size:12px;color:var(--navy)}
.toast-msg{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.4}
.toast-action{display:inline-block;margin-top:7px;background:var(--pale);color:var(--blue);border:none;padding:4px 9px;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer}
.toast-close{position:absolute;top:7px;right:9px;border:none;background:none;color:#aab6c2;font-size:17px;cursor:pointer;line-height:1}
.notif-bell{position:relative;display:inline-flex}
.notif-badge{position:absolute;top:-5px;right:-6px;background:#e8534a;color:white;font-size:9px;font-weight:800;border-radius:10px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 3px}
/* ── PORTAIL INSPECTION ── */
#inspection-portal{min-height:100vh;background:#f0f4f8;font-family:Arial,Helvetica,sans-serif}
.insp-header{background:var(--navy);color:white;padding:18px 16px 22px;position:sticky;top:0;z-index:10}
.insp-header .brand{font-size:18px;font-weight:800;padding:0;letter-spacing:-.3px}
.insp-header .brand span{color:#98c9e9;font-weight:400}
.insp-body{max-width:600px;margin:0 auto;padding:14px 12px 80px}
.insp-card{background:white;border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.insp-card h3{font-size:13px;font-weight:800;margin:0 0 12px;color:var(--navy)}
.insp-zone-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.insp-zone-btn{background:#f4f7fa;border:2px solid var(--line);border-radius:8px;padding:10px 8px;font-size:11px;font-weight:700;color:var(--ink);cursor:pointer;text-align:center;transition:background .15s,border-color .15s}
.insp-zone-btn:hover,.insp-zone-btn:active{background:#e0ecf7;border-color:var(--blue)}
.insp-zone-btn.has-damage{background:#fff4df;border-color:var(--amber);color:var(--amber)}
.damage-item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.damage-item:first-child{border-top:0}
.damage-thumb{width:60px;height:60px;object-fit:cover;border-radius:6px;border:1px solid var(--line);flex-shrink:0}
.damage-thumb-placeholder{width:60px;height:60px;background:#f4f7fa;border-radius:6px;border:1px dashed var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px}
.insp-sig-canvas{width:100%;height:160px;border:2px dashed #c5d4e0;border-radius:8px;touch-action:none;background:#fafcfe;cursor:crosshair}
.insp-submit-bar{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);padding:12px 16px;z-index:20}
.insp-camera-modal{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column}
.insp-camera-preview{flex:1;object-fit:cover;width:100%}
.insp-loading-photos{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.insp-loading-photo{width:80px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line);flex-shrink:0}
.car-svg-zone{cursor:pointer;transition:opacity .15s}
.car-svg-zone:hover,.car-svg-zone.active{opacity:.7}
.car-svg-zone.has-damage{fill:#ffe8a1 !important}
/* ── PORTAIL TRANSPORTEUR ── */
.portal-wrap{min-height:100vh;background:#f0f4f8;padding:0 0 60px}
.portal-header{background:var(--navy);color:white;padding:20px 16px 24px;position:sticky;top:0;z-index:5}
.portal-header .brand{font-size:18px;font-weight:800;padding:0 0 14px;letter-spacing:-.3px}
.portal-header .brand span{color:#98c9e9;font-weight:400}
.portal-body{max-width:600px;margin:0 auto;padding:16px}
.portal-mission-bar{background:white;border:1px solid var(--line);border-radius:10px;padding:15px;margin-bottom:16px}
.portal-car{background:white;border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.portal-car-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.portal-section{border:1px solid var(--line);border-radius:8px;padding:13px;margin-top:10px}
.portal-section.done{border-color:#c3e6cb;background:#f0fbf4}
.portal-section.locked{opacity:.55;pointer-events:none}
.portal-section-label{font-size:10px;font-weight:800;letter-spacing:1px;color:var(--muted);margin-bottom:10px}
.portal-section.done .portal-section-label{color:var(--green)}
.portal-photos{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.portal-photos img{width:80px;height:62px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:pointer}
.portal-upload-btn{display:block;width:100%;background:var(--blue);color:white;text-align:center;padding:13px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;border:none;margin-top:6px}
.portal-confirm-btn{width:100%;background:var(--green);color:white;border:none;padding:13px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;margin-top:8px}
.portal-add-photo{display:block;border:2px dashed #c3e6cb;color:var(--green);text-align:center;padding:9px;border-radius:7px;margin-top:8px;font-size:12px;cursor:pointer;background:none;width:100%}
.portal-confirm-btn:disabled{background:#9eb8a0;cursor:not-allowed}
@media(max-width:950px){.sidebar{width:190px}.main{margin-left:190px;width:calc(100% - 190px)}.stats{grid-template-columns:repeat(2,1fr)}.recent-row{grid-template-columns:100px 1fr 1fr 100px}.recent-row>*:nth-child(3){display:none}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){.sidebar{width:62px;padding:14px 6px}.brand{padding:5px 9px 20px;font-size:0}.brand:before{content:'AD';font-size:16px;color:white}.brand span,.brand small,.nav-label,.nav button:not(.active) .label,.nav .label,.sidebar-foot{display:none}.nav button{justify-content:center;padding:12px 4px}.nav .icon{font-size:17px}.main{margin-left:62px;width:calc(100% - 62px)}.topbar{padding:0 13px;height:60px}.content{padding:17px 12px}.heading{align-items:flex-start;flex-direction:column}.heading h1{font-size:22px}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:19px}.cards{grid-template-columns:1fr}.route{grid-template-columns:1fr}.recent-row{grid-template-columns:88px 1fr 90px}.recent-row>*:nth-child(4){display:none}.form-grid{grid-template-columns:1fr}.field.wide,.form-section{grid-column:1}.car-form{grid-template-columns:1fr 1fr}.mission-mini{grid-template-columns:24px 1fr 95px}.heading>.btn{align-self:flex-start}.toolbar input[type=search]{min-width:100%}}
</style>
</head>

function detectLang(countryStr){
  if(!countryStr)return'en';
  const k=(countryStr||'').toUpperCase().trim();
  if(COUNTRY_LANG[k])return COUNTRY_LANG[k]; // code ISO (nouvelles valeurs)
  return _COUNTRY_LANG_LEGACY[(countryStr||'').toLowerCase().trim()]||'en'; // ancienne valeur texte
}
function countryLabel(code){
  if(!code)return'—';
  const c=COUNTRIES.find(([k])=>k===code);
  return c?`${c[1]}`:code; // si texte ancien, affiche tel quel
}
function countrySelectHtml(id,currentValue,placeholder='Choisir un pays…'){
  const opts=COUNTRIES.map(([code,name])=>`<option value="${code}"${currentValue===code?' selected':''}>${code} — ${name}</option>`).join('');
  return `<select id="${id}"><option value="">${placeholder}</option>${opts}</select>`;
}
function portalLang(){
  // Portail : langue du navigateur du transporteur
  const nav=navigator.language||navigator.userLanguage||'en';
  const code=nav.split('-')[0].toLowerCase();
  return['fr','en','ro','pl','lt','lv','et','de','es','it','nl','cs','sk','hu','bg','sl','hr','sr'].includes(code)?code:'en';
}

// ─── AUTH & ROUTING ──────────────────────────────────────────────
async function checkAuth(){
  // Portail transporteur : pas de login requis
  if(CARRIER_TOKEN){
    await initCarrierPortal();
    return;
  }
  // Portail inspection livraison : pas de login requis
  if(INSPECTION_TOKEN){
    await initInspectionPage(INSPECTION_TOKEN);
    return;
  }
  setLoading(true);
  const {data:{session}}=await sb.auth.getSession();
  setLoading(false);
  if(session){currentUser=session.user;await initApp();}
  else{document.getElementById('auth-screen').style.display='flex';}
}

async function login(){
  const email=document.getElementById('login-email').value.trim();
  const pwd=document.getElementById('login-pwd').value;
  const err=document.getElementById('login-err');
  err.textContent='';
  if(!email||!pwd){err.textContent='Complète les deux champs.';return;}
  setLoading(true);
  try{
    const ping=await fetch(SUPABASE_URL+'/auth/v1/health',{headers:{'apikey':SUPABASE_ANON}}).catch(e=>({ok:false,_err:e}));
    if(!ping.ok&&ping._err){
      setLoading(false);
      err.textContent='Réseau bloqué: '+ping._err.message+' — vérifiez que le site n\'est pas bloqué par un antivirus ou VPN.';
      return;
    }
    const {data,error}=await sb.auth.signInWithPassword({email,password:pwd});
    setLoading(false);
    if(error){err.textContent='Erreur auth: '+error.message+(error.status?' ('+error.status+')':(error.code?' ('+error.code+')':''));return;}
    currentUser=data.user;
    await initApp();
  }catch(e){
    setLoading(false);
    err.textContent='Exception: '+e.name+': '+e.message;
  }
}

async function logout(){
  await sb.auth.signOut();
  currentUser=null;
  db={clients:[],carriers:[],missions:[],selectedIds:[],sort:'ref',direction:1};
  document.getElementById('app-shell').style.display='none';
  document.getElementById('auth-screen').style.display='flex';
  document.getElementById('login-err').textContent='';
}

async function initApp(){
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('app-shell').style.display='flex';
  document.getElementById('user-info').textContent=currentUser?.email||'';
  await loadData();
  boot();
  realtimeSetup(); // Option 3 : écoute les événements transporteur en temps réel
}

  return{id:x.id,name:x.name||'',contact:x.contact||'',email:x.email||'',
    billingEmail:x.billing_email||'',vat:x.vat||'',phone:x.phone||'',
    street:x.street||'',postal:x.postal||'',city:x.city||'',country:x.country||''};
}

async function loadData(){
  setLoading(true);
  try{
    const[r1,r2,r3,r4,r5,r6]=await Promise.all([
      sb.from('clients').select('*').order('name'),
      sb.from('carriers').select('*').order('name'),
      sb.from('missions').select('*').order('created_at'),
      sb.from('cars').select('*'),
      sb.from('notifications').select('*').order('created_at'),
      sb.from('documents').select('*')
    ]);
    db.clients=(r1.data||[]).map(mapPartner);
    db.carriers=(r2.data||[]).map(mapPartner);
    // carrier_events : table optionnelle (créée par le SQL portail)
    try{const r7=await sb.from('carrier_events').select('*').order('confirmed_at');db.carrierEvents=r7.data||[];}
    catch(e){console.warn('carrier_events non disponible:',e.message);db.carrierEvents=[];};

    catch(e){console.warn('delivery_inspections non disponible:',e.message);db.deliveryInspections=[];};

      id:m.id,ref:m.ref||'',

      })),
      notifications:notifs.filter(n=>n.mission_id===m.id).map(n=>({
        id:n.id,kind:n.kind||'',status:n.status||'pending',
        pickupDate:n.pickup_date||'',deliveryDate:n.delivery_date||'',createdAt:n.created_at
      }))
    }));
  }catch(e){console.error(e);alert('Erreur de chargement : '+e.message);}
  setLoading(false);
}

// ─── REALTIME + TOAST NOTIFICATIONS ─────────────────────────────
let _realtimeChannel=null,_inspChannel=null,_notifCount=0;

function showToast(title,msg,type,missionId){
  const c=document.getElementById('toast-container');if(!c)return;
  const id='t'+Date.now()+Math.random().toString(36).slice(2,6);
  const icons={success:title.includes('Livraison')?'✅':'🚛',info:'📷',warning:'⚠️',cmr:'📄'};
  const icon=type==='inspection'?'📋':(type==='cmr'?icons.cmr:(type==='success'?icons.success:icons.info));
  const div=document.createElement('div');
  div.className='toast '+(type==='cmr'?'info':type==='inspection'?'success':type||'info');
  div.id=id;
  div.innerHTML=`<div class="toast-icon">${icon}</div>
    <div class="toast-body">
      <div class="toast-title">${title}</div>
      <div class="toast-msg">${msg}</div>
      ${missionId?`<button class="toast-action" onclick="openDetail('${missionId}');dismissToast('${id}')">Voir la mission →</button>`:''}
    </div>
    <button class="toast-close" onclick="dismissToast('${id}')">×</button>`;
  c.appendChild(div);
  _notifCount++;_updateNotifBell();
  setTimeout(()=>dismissToast(id),12000);
}

function dismissToast(id){
  const el=document.getElementById(id);if(!el)return;
  el.classList.add('out');
  setTimeout(()=>{el.remove();_notifCount=Math.max(0,_notifCount-1);_updateNotifBell();},300);
}

function _updateNotifBell(){
  const btn=document.getElementById('notif-btn');
  const badge=document.getElementById('notif-badge');
  if(!btn||!badge)return;
  if(_notifCount>0){btn.style.display='';badge.textContent=_notifCount;}
  else{btn.style.display='none';}
}

function clearNotifBadge(){
  _notifCount=0;_updateNotifBell();
  document.querySelectorAll('.toast').forEach(t=>dismissToast(t.id));
}

async function handleCarrierEvent(ev){
  if(!ev)return;
  // Met à jour le cache local
  if(!db.carrierEvents.find(e=>e.id===ev.id))db.carrierEvents.push(ev);
  // Retrouve mission + véhicule dans l'état local
  const m=db.missions.find(x=>x.id===ev.mission_id);
  const car=m?.cars?.find(x=>x.id===ev.car_id);
  const mRef=m?m.ref:(ev.mission_id||'').slice(0,8)+'…';
  const vLabel=car?`${car.make} ${car.model}`:'Véhicule';
  const phase=ev.event_type==='loading'||ev.event_type==='confirmed_loading'?'Chargement':'Livraison';

  let title,msg,type;
  if(ev.event_type==='confirmed_loading'){
    title='🚛 Chargement confirmé';
    msg=`${mRef} — ${vLabel}`;type='success';
    if(car)car.status='chargé';
    // Si tous les véhicules sont chargés/livrés → déclencher notifyLoaded automatiquement
    if(m&&m.cars.every(c=>c.status==='chargé'||c.status==='livré')&&!m.notifications.some(n=>n.kind==='loaded')){
      setTimeout(()=>notifyLoaded(m.id),600);
    }
  } else if(ev.event_type==='confirmed_delivery'){
    title='✅ Livraison confirmée';
    msg=`${mRef} — ${vLabel}`;type='success';
    if(car)car.status='livré';
    // Si tous livrés → passer mission en "livré" et déclencher notification livraison
    if(m&&m.cars.every(c=>c.status==='livré')&&m.status!=='livré'){
      m.status='livré';
      await sb.from('missions').update({status:'livré'}).eq('id',m.id);
      if(!m.notifications.some(n=>n.kind==='delivered')){
        const n={id:crypto.randomUUID(),kind:'delivered',pickupDate:m.pickupDate,deliveryDate:m.deliveryDate,status:'pending',createdAt:new Date().toISOString()};
        m.notifications.push(n);await dbUpsertNotif(n,m.id);
      }
    }
  } else if(ev.notes&&(ev.notes.startsWith('cmr')||ev.notes==='cmr_loading'||ev.notes==='cmr_delivery')){
    title='📄 CMR reçu';
    msg=`${mRef} — ${vLabel} — ${phase}`;type='cmr';
  } else {
    title='📷 Photo reçue';
    msg=`${mRef} — ${vLabel} — ${phase}`;type='info';
  }

  showToast(title,msg,type,ev.mission_id);
  // Rafraîchit la liste + panneau détail
  render();
  if(detailId===ev.mission_id){try{refreshDetail();}catch(_){}}
}

function realtimeSetup(){
  if(_realtimeChannel){try{_realtimeChannel.unsubscribe();}catch(_){}}
  _realtimeChannel=sb.channel('carrier-events-admin-v1')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'carrier_events'},
      payload=>{ handleCarrierEvent(payload.new); }
    )
    .subscribe(status=>{
      if(status==='SUBSCRIBED')console.info('[Realtime] ✓ connecté — carrier_events');
      else if(status==='CHANNEL_ERROR')console.warn('[Realtime] ✗ erreur connexion — carrier_events');
    });
  // Cloche + notification quand une inspection de véhicule est terminée (PDF rattaché sur cars)
  if(_inspChannel){try{_inspChannel.unsubscribe();}catch(_){}}
  _inspChannel=sb.channel('inspection-done-admin-v1')
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'cars'},
      payload=>{ handleInspectionDone(payload.new); }
    )
    .subscribe(status=>{
      if(status==='SUBSCRIBED')console.info('[Realtime] ✓ connecté — inspections (cars)');
      else if(status==='CHANNEL_ERROR')console.warn('[Realtime] ✗ erreur connexion — inspections (cars)');
    });
}

// Une inspection de véhicule vient d'être terminée (PDF rattaché) : met à jour l'état local + toast + cloche.
// N'affecte AUCUN statut et ne crée aucune notification client (pas d'automatisme).
function handleInspectionDone(row){
  if(!row||!row.inspection_pdf_url)return;
  const m=db.missions.find(x=>x.id===row.mission_id);
  const car=m?m.cars.find(c=>c.id===row.id):null;
  if(car&&car.inspectionPdfUrl===row.inspection_pdf_url)return;   // déjà connue : simple mise à jour de statut
  if(car){
    car.inspectionSubmittedAt=row.inspection_submitted_at||'';
    car.inspectionSigner=row.inspection_signer||'';
    car.inspectionPdfUrl=row.inspection_pdf_url;
  }
  const label=car?`${car.make||''} ${car.model||''}`.trim():'Véhicule';
  showToast('📋 Inspection terminée',esc(`${m?m.ref:''} — ${label}`),'inspection',row.mission_id);
  render();
  if(detailId&&detailId===row.mission_id){try{refreshDetail();}catch(_){}}
}

async function dbUpsertMission(m){
  const row={
    id:m.id,ref:m.ref,client_id:m.clientId||null,carrier_id:m.carrierId||null,
    pickup_site:m.pickupSite,pickup_street:m.pickupStreet,pickup_postal:m.pickupPostal,
    pickup_city:m.pickupCity,pickup_country:m.pickupCountry,pickup_contact:m.pickupContact,
    delivery_site:m.deliverySite,delivery_street:m.deliveryStreet,delivery_postal:m.deliveryPostal,
    delivery_city:m.deliveryCity,delivery_country:m.deliveryCountry,delivery_contact:m.deliveryContact,
    delivery_email:m.deliveryEmail||null,
    pickup_date:m.pickupDate||null,delivery_date:m.deliveryDate||null,status:m.status,
    delivery_token:m.deliveryToken||null,
    price_sell:m.priceSell??null,price_buy:m.priceBuy??null,distance_km:m.distanceKm??null
  };
  let{error}=await sb.from('missions').upsert(row);
  // Sécurité de transition : si la colonne distance_km n'existe pas encore en base, on réessaie sans elle
  if(error&&/distance_km/i.test(error.message||'')){
    console.warn('distance_km absente en base — enregistrement sans distance');
    delete row.distance_km;
    ({error}=await sb.from('missions').upsert(row));
  }
  if(error)console.error('mission',error);
  return error||null;
}

function dashboard(){

  const isDone=s=>['livré','facturé','payé'].includes(s);

  const activeMissions=db.missions.filter(m=>!isDone(m.status));
  const lateMissions=db.missions.filter(m=>{
    if(isDone(m.status)||!m.deliveryDate)return false;
    return new Date(m.deliveryDate+'T12:00:00')<todayD;
  });
  const toLoadToday=db.missions.filter(m=>{
    if(!m.pickupDate)return false;
    const d=new Date(m.pickupDate+'T12:00:00');
    return sameDay(d,todayD)&&!isDone(m.status);
  });
  const deliveredToday=db.missions.filter(m=>{
    if(!m.deliveryDate||m.status!=='livré')return false;
    return sameDay(new Date(m.deliveryDate+'T12:00:00'),todayD);
  });
  const totalVehicles=db.missions.reduce((n,m)=>n+m.cars.length,0);
  const inTransit=db.missions.reduce((n,m)=>n+m.cars.filter(c=>c.status==='en transport'||c.status==='chargé').length,0);

  const kpiStyle=(color)=>`color:${color};font-size:26px;margin-top:9px;display:block`;
  return heading("Vue d'ensemble","Tableau de bord opérationnel · "+new Date().toLocaleDateString('fr-BE',{weekday:'long',day:'numeric',month:'long'}))+

    <div class="stat"><small>Missions actives</small><strong style="${kpiStyle('var(--blue)')}">${activeMissions.length}</strong><em>${db.missions.length} total · ${inTransit} en transit</em></div>
    <div class="stat" style="${lateMissions.length?'background:#fff5f5;border-color:#fcd4d4':''}"><small style="${lateMissions.length?'color:var(--red);font-weight:800':''}">⚠ En retard</small><strong style="${kpiStyle(lateMissions.length?'var(--red)':'var(--green)')}">${lateMissions.length}</strong><em>${lateMissions.length?lateMissions.slice(0,2).map(m=>m.ref).join(', ')+(lateMissions.length>2?' +'+( lateMissions.length-2):''):'Tout est à jour ✓'}</em></div>
    <div class="stat" style="${toLoadToday.length?'background:#fffbf0;border-color:#f5dfa0':''}"><small style="${toLoadToday.length?'color:var(--amber);font-weight:800':''}">📦 À charger aujourd'hui</small><strong style="${kpiStyle(toLoadToday.length?'var(--amber)':'#8094a6')}">${toLoadToday.length}</strong><em>${toLoadToday.length?toLoadToday.map(m=>m.ref).join(', '):'Rien de prévu'}</em></div>

  </div>

    <div class="panel-title" style="margin-bottom:10px"><h2 style="color:var(--red)">⚠ Missions en retard (${lateMissions.length})</h2><button class="btn" onclick="filterStatus='à charger';setView('Missions')">Voir toutes</button></div>

function weekCalendar(){
  const today=new Date();today.setHours(0,0,0,0);
  const dow=today.getDay()||7;
  const monday=new Date(today);monday.setDate(today.getDate()-(dow-1)+(weekOffset*7));
  const days=Array.from({length:7},(_,i)=>{const d=new Date(monday);d.setDate(monday.getDate()+i);return d;});
  const sameDay=(d1,d2)=>d1.getFullYear()===d2.getFullYear()&&d1.getMonth()===d2.getMonth()&&d1.getDate()===d2.getDate();

  const weekLabel=`Semaine du ${fmt(days[0])} au ${fmt(days[6])}`;

  const cols=days.map((d,i)=>{
    const loads=db.missions.filter(m=>{const p=m.pickupDate?new Date(m.pickupDate):null;return p&&sameDay(p,d);});
    const delivs=db.missions.filter(m=>{const v=m.deliveryDate?new Date(m.deliveryDate):null;return v&&sameDay(v,d);});

        <div style="font-size:10.5px;color:#536a7d">Chargement · ${m.cars.length} véh.</div>
        <div style="font-size:10.5px;color:#536a7d">${esc(place(m.pickupCountry,m.pickupCity))}${m.deliveryCity?' → '+esc(place(m.deliveryCountry,m.deliveryCity)):''}</div>
        <div style="font-size:10px;color:#8094a6;margin-top:2px">${esc(getClient(m).name||'—')} · ${esc(getCarrier(m).name||'À attribuer')}</div>
      </div>`),

        <div style="display:flex;align-items:center;gap:5px;margin-bottom:3px"><span style="width:7px;height:7px;border-radius:50%;background:#24784d;flex-shrink:0"></span><strong style="font-size:11px">${esc(m.ref)}</strong></div>
        <div style="font-size:10.5px;color:#536a7d">Livraison · ${m.cars.length} véh.</div>
        <div style="font-size:10.5px;color:#536a7d">${esc(place(m.deliveryCountry,m.deliveryCity))}</div>
        <div style="font-size:10px;color:#8094a6;margin-top:2px">${esc(getClient(m).name||'—')} · ${esc(getCarrier(m).name||'À attribuer')}</div>
      </div>`)
    ];

function handleXlsxDrop(file){
  if(!file)return;
  const xl=window.XLSX;
  if(!xl){alert('SheetJS non chargé, vérifiez votre connexion.');return;}
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=xl.read(e.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=xl.utils.sheet_to_json(ws,{defval:''});
      if(!rows.length){document.getElementById('xl-status').textContent='⚠ Fichier vide ou non reconnu.';return;}
      _xlsxRows=rows;
      _xlsxHeaders=Object.keys(rows[0]);
      buildXlsxMappingUI();
    }catch(err){document.getElementById('xl-status').textContent='❌ Erreur lecture : '+err.message;}
  };
  reader.readAsArrayBuffer(file);
}

const _xlNorm=x=>String(x??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[_\-]+/g,' ').replace(/\s+/g,' ').trim();
const _XL_STATUSES=['à planifier','attribué','à charger','en transport','livré','à facturer','facturé','payé'];

  const FIELDS=[
    {key:'ref',label:'Référence mission',required:true},
    {key:'clientName',label:'Client (nom)'},
    {key:'carrierName',label:'Transporteur (nom)'},
    {key:'status',label:'Statut'},

    {key:'deliveryDate',label:'Date livraison'},
    {key:'pickupSite',label:'Chargement — site / nom'},
    {key:'pickupContact',label:'Chargement — contact'},
    {key:'pickupStreet',label:'Chargement — rue et numéro'},
    {key:'pickupCountry',label:'Chargement — pays'},
    {key:'pickupPostal',label:'Chargement — code postal'},
    {key:'pickupCity',label:'Chargement — ville'},
    {key:'deliverySite',label:'Livraison — site / nom'},
    {key:'deliveryContact',label:'Livraison — contact'},
    {key:'deliveryEmail',label:'Livraison — e-mail'},
    {key:'deliveryStreet',label:'Livraison — rue et numéro'},
    {key:'deliveryCountry',label:'Livraison — pays'},

    {key:'carVin',label:'Véhicule — VIN'},
    {key:'carPlate',label:'Véhicule — plaque'},
  ];

  // Détection automatique : correspondance exacte d'abord, puis mot contenu (colonnes déjà prises exclues)
  const SYN={
    ref:['ref','reference','mission','n mission','numero','num','n'],
    clientName:['client','acheteur','buyer','societe'],
    carrierName:['transporteur','carrier'],
    status:['statut','status','etat'],
    pickupDate:['date chargement','date enlevement','date charg','pickup date','chargement','enlevement'],
    deliveryDate:['date livraison','date livr','delivery date','date dechargement','livraison'],
    pickupSite:['site chargement','site enlevement','nom chargement','pickup site','site charg'],
    pickupContact:['contact chargement','contact charg','contact enlevement'],
    pickupStreet:['rue chargement','adresse chargement','adresse enlevement','pickup street','rue charg','adresse charg'],
    pickupCountry:['pays chargement','pays charg','pays enlevement','pickup country'],
    pickupPostal:['cp chargement','code postal chargement','cp charg','pickup postal','postal chargement'],
    pickupCity:['ville chargement','ville charg','ville enlevement','pickup city'],
    deliverySite:['site livraison','site dechargement','nom livraison','delivery site','site livr'],
    deliveryContact:['contact livraison','contact livr','contact dechargement'],
    deliveryEmail:['email livraison','mail livraison','e mail livraison','delivery email'],
    deliveryStreet:['rue livraison','adresse livraison','adresse dechargement','delivery street','rue livr','adresse livr'],
    deliveryCountry:['pays livraison','pays livr','pays dechargement','delivery country'],
    deliveryPostal:['cp livraison','code postal livraison','cp livr','delivery postal','postal livraison'],
    deliveryCity:['ville livraison','ville livr','ville dechargement','delivery city'],

    carMake:['marque','make','brand'],carModel:['modele','model'],
    carVin:['vin','chassis'],carPlate:['plaque','immatriculation','plate'],
  };
  const _taken=new Set();
  const autoMatch=field=>{
    const words=SYN[field]||[];
    const hs=_xlsxHeaders.map(h=>({h,n:_xlNorm(h)})).filter(x=>!_taken.has(x.h));
    let f=hs.find(x=>words.includes(x.n));
    if(!f)f=hs.find(x=>words.some(w=>w.length>=5&&x.n.includes(w)));
    if(f){_taken.add(f.h);return f.h;}

  };

  _xlsxMapping={};
  FIELDS.forEach(f=>{_xlsxMapping[f.key]=autoMatch(f.key);});

      <tbody>${rows}</tbody>

  // Preview first 5 rows
  const prev=_xlsxRows.slice(0,5);

    </table></div>

  document.getElementById('xl-mapping-area').style.display='block';
  document.getElementById('xl-dropzone').style.display='none';
}

function _xlDate(v){
  if(v==null||v==='')return null;
  const ok=(y,m,d)=>y>=1990&&y<=2100&&m>=1&&m<=12&&d>=1&&d<=31?`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`:null;
  if(v instanceof Date&&!isNaN(v))return v.toISOString().slice(0,10);
  if(typeof v==='number'){
    const d=(window.XLSX&&XLSX.SSF)?XLSX.SSF.parse_date_code(v):null;
    return d?ok(d.y,d.m,d.d):null;
  }
  const t=String(v).trim();
  let m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return ok(+m[1],+m[2],+m[3]);
  m=t.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
  if(m){let y=+m[3];if(y<100)y+=2000;return ok(y,+m[2],+m[1]);}   // format européen jour/mois/année
  return null;
}
function _xlCountry(v){
  const t=String(v??'').trim();if(!t)return '';
  const up=t.toUpperCase();
  if(COUNTRIES.some(([c])=>c===up))return up;
  const n=_xlNorm(t);
  const f=COUNTRIES.find(([,name])=>_xlNorm(name)===n);
  return f?f[0]:t;
}

  const status=document.getElementById('xl-status');
  btn.disabled=true;btn.textContent='⏳ Import en cours…';
  const map=_xlsxMapping;
  const get=(r,k)=>map[k]?String(r[map[k]]??'').trim():'';
  const rawv=(r,k)=>map[k]?r[map[k]]:'';
  const existing=new Set(db.missions.map(x=>_xlNorm(x.ref)));

  // Regroupe les lignes par référence : une référence = une mission, une ligne = un véhicule
  const groups=new Map();let skipped=0;
  _xlsxRows.forEach(r=>{
    const ref=get(r,'ref');
    if(!ref){skipped++;return;}
    const k=_xlNorm(ref);
    if(!groups.has(k))groups.set(k,{ref,rows:[]});
    groups.get(k).rows.push(r);
  });

  let imported=0,dups=0,nbCars=0,noDate=0;
  const errors=[],unknownClients=new Set(),unknownCarriers=new Set();

  for(const g of groups.values()){
    if(existing.has(_xlNorm(g.ref))){dups++;continue;}      // jamais de doublon de référence
    const r=g.rows[0];
    const clientName=get(r,'clientName'),carrierName=get(r,'carrierName');
    const client=clientName?db.clients.find(c=>_xlNorm(c.name)===_xlNorm(clientName)):null;
    const carrier=carrierName?db.carriers.find(c=>_xlNorm(c.name)===_xlNorm(carrierName)):null;
    if(clientName&&!client)unknownClients.add(clientName);
    if(carrierName&&!carrier)unknownCarriers.add(carrierName);
    const stIn=_xlNorm(get(r,'status'));
    const statut=_XL_STATUSES.find(x=>_xlNorm(x)===stIn)||(carrier?'attribué':'à planifier');
    const pDate=_xlDate(rawv(r,'pickupDate')),dDate=_xlDate(rawv(r,'deliveryDate'));
    if((rawv(r,'pickupDate')!==''&&!pDate)||(rawv(r,'deliveryDate')!==''&&!dDate))noDate++;
    const missionId=crypto.randomUUID();
    const payload={
      id:missionId,ref:g.ref,client_id:client?client.id:null,carrier_id:carrier?carrier.id:null,
      pickup_site:get(r,'pickupSite'),pickup_contact:get(r,'pickupContact'),pickup_street:get(r,'pickupStreet'),
      pickup_postal:get(r,'pickupPostal'),pickup_city:get(r,'pickupCity'),pickup_country:_xlCountry(rawv(r,'pickupCountry')),
      delivery_site:get(r,'deliverySite'),delivery_contact:get(r,'deliveryContact'),delivery_email:get(r,'deliveryEmail')||null,
      delivery_street:get(r,'deliveryStreet'),delivery_postal:get(r,'deliveryPostal'),delivery_city:get(r,'deliveryCity'),
      delivery_country:_xlCountry(rawv(r,'deliveryCountry')),
      pickup_date:pDate,delivery_date:dDate,status:statut,
      price_sell:parseNum(rawv(r,'price_sell')),price_buy:parseNum(rawv(r,'price_buy')),
    };
    const{error:mErr}=await sb.from('missions').insert(payload);
    if(mErr){errors.push(`${g.ref} : ${mErr.message}`);continue;}
    let cars=g.rows.map(x=>({mission_id:missionId,make:get(x,'carMake'),model:get(x,'carModel'),
      vin:get(x,'carVin').toUpperCase()||null,plate:get(x,'carPlate').toUpperCase()||null,status:'à charger'}))
      .filter(c=>c.make||c.model||c.vin||c.plate);
    if(!cars.length)cars=[{mission_id:missionId,make:'À préciser',model:'',vin:null,plate:null,status:'à charger'}];  // sans véhicule, la mission serait invisible
    const{error:cErr}=await sb.from('cars').insert(cars);
    if(cErr)errors.push(`${g.ref} (véhicules) : ${cErr.message}`);else nbCars+=cars.length;
    existing.add(_xlNorm(g.ref));
    imported++;
  }

  await loadData();render();
  btn.textContent='✓ Import terminé';
  const lines=[`✅ ${imported} mission${imported!==1?'s':''} importée${imported!==1?'s':''} (${nbCars} véhicule${nbCars!==1?'s':''}).`];
  if(dups)lines.push(`ℹ ${dups} mission${dups!==1?'s':''} ignorée${dups!==1?'s':''} : référence déjà existante.`);
  if(skipped)lines.push(`ℹ ${skipped} ligne${skipped!==1?'s':''} ignorée${skipped!==1?'s':''} (référence vide).`);
  if(unknownClients.size)lines.push(`⚠ Client introuvable (mission importée sans client) : ${[...unknownClients].slice(0,5).join(', ')}${unknownClients.size>5?'…':''}`);
  if(unknownCarriers.size)lines.push(`⚠ Transporteur introuvable : ${[...unknownCarriers].slice(0,5).join(', ')}${unknownCarriers.size>5?'…':''}`);
  if(noDate)lines.push(`⚠ ${noDate} mission${noDate!==1?'s':''} avec une date non reconnue (laissée vide).`);
  if(errors.length)lines.push(`❌ ${errors.length} erreur${errors.length!==1?'s':''} : ${errors.slice(0,3).join(' · ')}${errors.length>3?'…':''}`);
  const clean=!errors.length&&!unknownClients.size&&!unknownCarriers.size&&!noDate;
  status.style.cssText='color:'+(errors.length?'#a54b48':(clean?'#24784d':'#9a6b18'))+';white-space:pre-wrap;font-size:13px';
  status.textContent=lines.join('\n');
  if(clean&&imported)setTimeout(()=>document.getElementById('modal-import-excel')?.remove(),2200);
}

// ─── RAPPORTS ───────────────────────────────────────────────────────────────
function reportsPage(){
  const isDone=s=>['livré','facturé','payé'].includes(s);
  const todayD=new Date();todayD.setHours(0,0,0,0);

  // --- Filtres ---
  const now=new Date();
  const rpFilterEl=document.getElementById('rp-period')||{value:'30'};
  const rpPeriod=parseInt(rpFilterEl.value||'30',10);
  const rpClientEl=document.getElementById('rp-client')||{value:''};
  const rpCarrierEl=document.getElementById('rp-carrier')||{value:''};
  const rpClientF=rpClientEl.value||'';
  const rpCarrierF=rpCarrierEl.value||'';

  const cutoff=new Date(now);cutoff.setDate(cutoff.getDate()-rpPeriod);

  const inPeriod=m=>{
    const d=m.deliveryDate||m.pickupDate;
    if(!d)return false;
    return new Date(d+'T12:00:00')>=cutoff;
  };

  let missions=db.missions.filter(inPeriod);
  if(rpClientF)missions=missions.filter(m=>m.clientId===rpClientF);
  if(rpCarrierF)missions=missions.filter(m=>m.carrierId===rpCarrierF);

  const total=missions.length;
  const done=missions.filter(m=>isDone(m.status));
  const late=missions.filter(m=>{
    if(isDone(m.status)||!m.deliveryDate)return false;
    return new Date(m.deliveryDate+'T12:00:00')<todayD;
  });
  const onTime=done.filter(m=>{
    if(!m.deliveryDate)return false;
    return new Date(m.deliveryDate+'T12:00:00')>=todayD||isDone(m.status);
  });
  const deliveredOnTime=done.filter(m=>!late.includes(m));
  const rateOnTime=done.length?Math.round(deliveredOnTime.length/done.length*100):0;

  // Délai moyen pickup→delivery
  const avgDays=arr=>{
    const vals=arr.filter(m=>m.pickupDate&&m.deliveryDate).map(m=>{
      const a=new Date(m.pickupDate+'T12:00:00'),b=new Date(m.deliveryDate+'T12:00:00');
      return Math.max(0,Math.round((b-a)/86400000));
    });
    return vals.length?Math.round(vals.reduce((s,v)=>s+v,0)/vals.length):null;
  };
  const avgD=avgDays(missions);

  // Véhicules total
  const totalVeh=missions.reduce((n,m)=>n+m.cars.length,0);

  // Prix moyen vente (si champ existe)
  const withPrice=missions.filter(m=>m.priceSell>0);
  const avgSell=withPrice.length?Math.round(withPrice.reduce((s,m)=>s+m.priceSell,0)/withPrice.length):null;

  // ── Activité par mois (12 derniers mois) ──
  const monthlyData={};
  for(let i=11;i>=0;i--){
    const d=new Date(now);d.setMonth(d.getMonth()-i);
    const key=d.getFullYear()+'-'+(String(d.getMonth()+1).padStart(2,'0'));
    monthlyData[key]={label:d.toLocaleDateString('fr-BE',{month:'short',year:'2-digit'}),count:0,done:0};
  }
  db.missions.forEach(m=>{
    const d=m.pickupDate||m.deliveryDate;if(!d)return;
    const key=d.substring(0,7);
    if(monthlyData[key]){monthlyData[key].count++;if(isDone(m.status))monthlyData[key].done++;}
  });
  const months=Object.values(monthlyData);
  const maxMonth=Math.max(1,...months.map(m=>m.count));

  // ── Top clients ──
  const byClient={};
  missions.forEach(m=>{
    const cId=m.clientId;if(!cId)return;
    if(!byClient[cId])byClient[cId]={name:db.clients.find(c=>c.id===cId)?.name||'Inconnu',count:0,done:0};
    byClient[cId].count++;if(isDone(m.status))byClient[cId].done++;
  });
  const topClients=Object.values(byClient).sort((a,b)=>b.count-a.count).slice(0,5);

  // ── Top transporteurs ──
  const byCarrier={};
  missions.forEach(m=>{
    const cId=m.carrierId;if(!cId)return;
    if(!byCarrier[cId])byCarrier[cId]={name:db.carriers.find(c=>c.id===cId)?.name||'Inconnu',count:0,done:0,late:0};
    byCarrier[cId].count++;
    if(isDone(m.status))byCarrier[cId].done++;
    if(late.includes(m))byCarrier[cId].late++;
  });
  const topCarriers=Object.values(byCarrier).sort((a,b)=>b.count-a.count).slice(0,5);

  // ── Routes fréquentes ──
  const byRoute={};
  missions.forEach(m=>{
    const from=(m.pickupAddress||'').split(',').pop().trim()||'?';
    const to=(m.deliveryAddress||'').split(',').pop().trim()||'?';
    const key=from+' → '+to;
    byRoute[key]=(byRoute[key]||0)+1;
  });
  const topRoutes=Object.entries(byRoute).sort((a,b)=>b[1]-a[1]).slice(0,5);

  // ── Statuts distribution ──
  const byStatus={};
  missions.forEach(m=>{byStatus[m.status]=(byStatus[m.status]||0)+1;});
  const statusColors={'livré':'var(--green)','facturé':'#2ecc71','payé':'#27ae60','en transport':'var(--blue)','chargé':'#3498db','en attente':'#95a5a6','annulé':'var(--red)'};

  const kpi=(val,label,sub,color='var(--blue)',icon='')=>`
    <div class="stat" style="text-align:center">
      <small style="font-size:12px;color:#666">${icon} ${label}</small>
      <strong style="display:block;font-size:28px;margin-top:6px;color:${color}">${val}</strong>
      ${sub?`<em style="font-size:11px;color:#888">${sub}</em>`:''}
    </div>`;

  const bar=(pct,color,bg='#e8eef5')=>`<div style="height:8px;background:${bg};border-radius:4px;overflow:hidden"><div style="width:${Math.min(100,pct)}%;height:100%;background:${color};border-radius:4px;transition:width .4s"></div></div>`;

  const clientOpts=db.clients.map(c=>`<option value="${esc(c.id)}" ${rpClientF===c.id?'selected':''}>${esc(c.name)}</option>`).join('');
  const carrierOpts=db.carriers.map(c=>`<option value="${esc(c.id)}" ${rpCarrierF===c.id?'selected':''}>${esc(c.name)}</option>`).join('');

  return heading('Rapports','Statistiques opérationnelles · actualisation automatique')+
  // ── Filtres ──
  `<div class="panel" style="margin-bottom:10px;padding:12px 16px">
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <span style="font-size:13px;font-weight:600;color:#555">📅 Période :</span>
      <select id="rp-period" style="padding:5px 10px;border:1px solid #cdd;border-radius:7px;font-size:13px" onchange="render()">
        <option value="7" ${rpPeriod===7?'selected':''}>7 derniers jours</option>
        <option value="30" ${rpPeriod===30?'selected':''}>30 derniers jours</option>
        <option value="90" ${rpPeriod===90?'selected':''}>3 derniers mois</option>
        <option value="180" ${rpPeriod===180?'selected':''}>6 derniers mois</option>
        <option value="365" ${rpPeriod===365?'selected':''}>12 derniers mois</option>
        <option value="3650" ${rpPeriod===3650?'selected':''}>Tout</option>
      </select>
      <select id="rp-client" style="padding:5px 10px;border:1px solid #cdd;border-radius:7px;font-size:13px" onchange="render()">
        <option value="">Tous les clients</option>${clientOpts}
      </select>
      <select id="rp-carrier" style="padding:5px 10px;border:1px solid #cdd;border-radius:7px;font-size:13px" onchange="render()">
        <option value="">Tous les transporteurs</option>${carrierOpts}
      </select>
      ${(rpClientF||rpCarrierF)?`<button class="btn" style="font-size:12px;padding:4px 10px" onclick="document.getElementById('rp-client').value='';document.getElementById('rp-carrier').value='';render()">✕ Réinitialiser</button>`:''}
    </div>
  </div>`+

  // ── KPIs ──
  `<div class="grid stats" style="grid-template-columns:repeat(5,minmax(0,1fr));margin-bottom:10px">
    ${kpi(total,'Missions','sur la période sélectionnée','var(--blue)','📋')}
    ${kpi(totalVeh,'Véhicules','transportés','#5b6af0','🚗')}
    ${kpi(rateOnTime+'%','Livraisons à temps',done.length+' livrées au total',rateOnTime>=90?'var(--green)':rateOnTime>=70?'var(--orange)':'var(--red)','✅')}
    ${kpi(late.length,'En retard','missions actives dépassées',late.length?'var(--red)':'var(--green)','⚠')}
    ${kpi(avgD!==null?avgD+'j':'—','Délai moyen',avgD!==null?'de la prise en charge à livraison':'données insuffisantes','#8e44ad','⏱')}
  </div>`+

  // ── Graphique activité mensuelle ──
  `<div class="panel" style="margin-bottom:10px">
    <div style="font-weight:700;font-size:14px;margin-bottom:14px">📈 Activité mensuelle (12 mois)</div>
    <div style="display:flex;align-items:flex-end;gap:6px;height:100px">
      ${months.map(m=>{
        const pct=Math.round(m.count/maxMonth*100);
        const donePct=m.count?Math.round(m.done/m.count*100):0;
        return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px" title="${m.label}: ${m.count} missions, ${m.done} livrées">
          <div style="font-size:10px;color:#888">${m.count||''}</div>
          <div style="width:100%;background:#e8f0fe;border-radius:4px 4px 0 0;position:relative;height:${pct}px;min-height:${m.count?4:0}px">
            <div style="position:absolute;bottom:0;left:0;right:0;height:${donePct}%;background:var(--green);border-radius:4px 4px 0 0;opacity:.85"></div>
            <div style="position:absolute;bottom:0;left:0;right:0;height:100%;background:var(--blue);border-radius:4px 4px 0 0;opacity:.25"></div>
          </div>
          <div style="font-size:9px;color:#999;writing-mode:vertical-rl;transform:rotate(180deg);line-height:1">${m.label}</div>
        </div>`;
      }).join('')}
    </div>
    <div style="display:flex;gap:14px;margin-top:10px;font-size:11px;color:#666">
      <span><span style="display:inline-block;width:10px;height:10px;background:var(--blue);opacity:.25;border-radius:2px;margin-right:4px"></span>Total missions</span>
      <span><span style="display:inline-block;width:10px;height:10px;background:var(--green);opacity:.85;border-radius:2px;margin-right:4px"></span>Livrées</span>
    </div>
  </div>`+

  // ── 3 colonnes : Statuts / Top clients / Top transporteurs ──
  `<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px">

    <div class="panel">
      <div style="font-weight:700;font-size:14px;margin-bottom:12px">🎯 Distribution des statuts</div>
      ${Object.entries(byStatus).sort((a,b)=>b[1]-a[1]).map(([s,n])=>`
        <div style="margin-bottom:8px">
          <div style="display:flex;justify-content:space-between;margin-bottom:3px">
            <span style="font-size:12px;color:#444">${esc(s)}</span>
            <span style="font-size:12px;font-weight:700">${n}</span>
          </div>
          ${bar(Math.round(n/Math.max(1,total)*100),statusColors[s]||'#95a5a6')}
        </div>`).join('')||'<div style="color:#aaa;font-size:13px">Aucune donnée</div>'}
    </div>

    <div class="panel">
      <div style="font-weight:700;font-size:14px;margin-bottom:12px">🏆 Top clients</div>
      ${topClients.length?topClients.map((c,i)=>`
        <div style="margin-bottom:9px">
          <div style="display:flex;justify-content:space-between;margin-bottom:3px">
            <span style="font-size:12px;font-weight:600">${i===0?'🥇':i===1?'🥈':i===2?'🥉':'  '} ${esc(c.name)}</span>
            <span style="font-size:12px;color:#666">${c.count} miss.</span>
          </div>
          ${bar(Math.round(c.count/(topClients[0]?.count||1)*100),'var(--blue)')}
        </div>`).join(''):'<div style="color:#aaa;font-size:13px">Aucune donnée</div>'}
    </div>

    <div class="panel">
      <div style="font-weight:700;font-size:14px;margin-bottom:12px">🚛 Classement transporteurs</div>
      ${topCarriers.length?topCarriers.map((c,i)=>{
        const rate=c.count?Math.round((c.count-c.late)/c.count*100):100;
        return `<div style="margin-bottom:9px">
          <div style="display:flex;justify-content:space-between;margin-bottom:3px">
            <span style="font-size:12px;font-weight:600">${esc(c.name)}</span>
            <span style="font-size:11px;color:${rate>=90?'var(--green)':rate>=70?'var(--orange)':'var(--red)'};font-weight:700">${rate}% ponct.</span>
          </div>
          ${bar(rate,rate>=90?'var(--green)':rate>=70?'var(--orange)':'var(--red)')}
          <div style="font-size:10px;color:#aaa;margin-top:2px">${c.count} missions · ${c.late} en retard</div>
        </div>`}).join(''):'<div style="color:#aaa;font-size:13px">Aucune donnée</div>'}
    </div>
  </div>`+

  // ── Routes fréquentes + prix moyen ──
  `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
    <div class="panel">
      <div style="font-weight:700;font-size:14px;margin-bottom:12px">🗺 Routes fréquentes</div>
      ${topRoutes.length?topRoutes.map(([route,n],i)=>`
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
          <div style="min-width:20px;font-size:12px;color:#999;font-weight:700">${i+1}.</div>
          <div style="flex:1">
            <div style="font-size:12px;font-weight:600;color:#333">${esc(route)}</div>
            ${bar(Math.round(n/(topRoutes[0]?.[1]||1)*100),'#5b6af0')}
          </div>
          <div style="min-width:30px;text-align:right;font-size:12px;font-weight:700;color:#555">${n}×</div>
        </div>`).join(''):'<div style="color:#aaa;font-size:13px">Aucune donnée</div>'}
    </div>

    <div class="panel">
      <div style="font-weight:700;font-size:14px;margin-bottom:12px">💶 Indicateurs financiers</div>
      ${avgSell!==null?`
        <div style="margin-bottom:12px">
          <div style="font-size:12px;color:#666;margin-bottom:4px">Prix de vente moyen</div>
          <div style="font-size:24px;font-weight:800;color:var(--green)">${avgSell.toLocaleString('fr-BE')} €</div>
          <div style="font-size:11px;color:#aaa">${withPrice.length} missions avec prix</div>
        </div>`:`<div style="color:#aaa;font-size:13px;margin-bottom:12px">Prix de vente non renseigné<br><small>Ajoutez price_sell dans vos missions</small></div>`}
      <div style="border-top:1px solid #eee;padding-top:12px">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <div style="text-align:center;background:#f7fbf4;border-radius:8px;padding:10px">
            <div style="font-size:11px;color:#666">Livrées</div>
            <div style="font-size:20px;font-weight:800;color:var(--green)">${done.length}</div>
          </div>
          <div style="text-align:center;background:${late.length?'#fff5f5':'#f7fbf4'};border-radius:8px;padding:10px">
            <div style="font-size:11px;color:#666">En retard</div>
            <div style="font-size:20px;font-weight:800;color:${late.length?'var(--red)':'var(--green)'}">${late.length}</div>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function documentsPage(){
  // ── Groupement par VIN (un groupe = un véhicule) ──────────────────────
  const groups=new Map(); // clé = car.vin || car.id

  function getGroup(key,car,mission){
    if(!groups.has(key)){
      const carrier=getCarrier(mission);
      groups.set(key,{
        vin:car.vin||'',plate:car.plate||'',
        make:car.make||'',model:car.model||'',
        vehicleLabel:`${car.make||''} ${car.model||''}`.trim()||'—',
        missionRef:mission.ref||'—',clientName:getClient(mission).name||'—',
        carrierName:carrier?carrier.name||'—':'—',
        missionId:mission.id,carId:car.id,
        carInspSubmittedAt:car.inspectionSubmittedAt||'',carInspSigner:car.inspectionSigner||'',carInspPdfUrl:car.inspectionPdfUrl||'',
        missInspSubmittedAt:mission.inspectionSubmittedAt||'',missInspSigner:mission.inspectionSigner||'',missInspPdfUrl:mission.inspectionPdfUrl||'',
        inspectionSubmittedAt:'',inspectionSigner:'',inspectionPdfUrl:'',
        docs:[],photos:[],videos:[],inspDamages:[],
      });
    }
    return groups.get(key);
  }

  // Documents manuels importés
  db.missions.forEach(m=>m.cars.forEach(c=>{
    const g=getGroup(c.vin||c.id,c,m);
    (c.docs||[]).forEach(d=>g.docs.push({label:d.name,phase:d.phase||'',date:d.date||'',url:d.url||''}));
  }));

  // Dommages inspection (delivery_inspections)
  (db.deliveryInspections||[]).forEach(e=>{
    const m=db.missions.find(x=>String(x.id)===String(e.mission_id));if(!m)return;
    // Cherche la voiture par car_id, ou à défaut la première de la mission
    const car=(e.car_id?m.cars.find(c=>String(c.id)===String(e.car_id)):null)||m.cars[0];
    if(!car)return;
    const g=getGroup(car.vin||car.id,car,m);
    g.inspDamages.push({
      url:e.photo_url||null,
      zone:e.zone||'',
      description:e.description||'',
      date:e.created_at?new Date(e.created_at).toLocaleDateString('fr-BE'):'—',

  // Photos & vidéos transporteur — on exclut les événements de confirmation sans média
  (db.carrierEvents||[]).filter(e=>!String(e.event_type||'').startsWith('confirmed')).forEach(e=>{

    const m=db.missions.find(x=>x.id===e.mission_id);if(!m)return;
    const car=m.cars.find(c=>c.id===e.car_id);if(!car)return;
    const g=getGroup(car.vin||car.id,car,m);
    const label=e.event_type==='loading'?'Chargement':'Livraison';
    const phase=e.event_type==='loading'?'chargement':'livraison';
    const date=e.confirmed_at?new Date(e.confirmed_at).toLocaleDateString('fr-BE'):(e.created_at?new Date(e.created_at).toLocaleDateString('fr-BE'):'—');
    if(e.photo_url) g.photos.push({url:e.photo_url,label,phase,date});
    if(e.video_url) g.videos.push({url:e.video_url,label,phase,date});
  });

  const allGroups=[...groups.values()].sort((a,b)=>a.missionRef.localeCompare(b.missionRef,'fr'));
  // Inspection par véhicule ; repli sur l'ancienne inspection de mission seulement si ce véhicule a des dommages enregistrés

    g.inspectionPdfUrl=g.carInspPdfUrl||(legacy?g.missInspPdfUrl:'');
  });

  const totalVideos=allGroups.reduce((s,g)=>s+g.videos.length,0);
  const totalDocs=allGroups.reduce((s,g)=>s+g.docs.length,0);

  const docSearchVal=typeof docSearch!=='undefined'?docSearch:'';
  const docFilterVal=typeof docFilter!=='undefined'?docFilter:'';

  const filtered=allGroups.filter(g=>{
    const q=docSearchVal.toLowerCase();
    if(q&&![g.missionRef,g.vehicleLabel,g.vin,g.plate,g.clientName,g.carrierName].join(' ').toLowerCase().includes(q))return false;
    if(docFilterVal==='chargement')return g.photos.some(p=>p.phase==='chargement');
    if(docFilterVal==='livraison')return g.photos.some(p=>p.phase==='livraison');
    if(docFilterVal==='doc')return g.docs.length>0;
    if(docFilterVal==='photo')return g.photos.length>0;
    return true;
  });

// ─── DISTANCE (km) : géocodage Nominatim + itinéraire OSRM (services publics gratuits, sans clé) ───
const _geoCache={};
let _lastGeo=0;
const _sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function geocodeAddr(street,postal,city,country){
  const iso=/^[A-Za-z]{2}$/.test(country||'')?String(country).toLowerCase():'';
  const attempts=[{street,postalcode:postal,city},{postalcode:postal,city},{city}].filter(a=>a.city||a.postalcode);
  for(const a of attempts){
    const key=JSON.stringify([a,iso||country||'']);
    if(_geoCache[key])return _geoCache[key];
    const wait=1100-(Date.now()-_lastGeo);if(wait>0)await _sleep(wait);   // Nominatim : 1 requête / seconde maximum
    _lastGeo=Date.now();
    const p=new URLSearchParams({format:'jsonv2',limit:'1'});
    Object.entries(a).forEach(([k,v])=>{if(v)p.set(k,v);});
    if(iso)p.set('countrycodes',iso);else if(country)p.set('country',country);
    const res=await fetch('https://nominatim.openstreetmap.org/search?'+p.toString());
    if(!res.ok)throw new Error('Géocodage indisponible ('+res.status+')');
    const j=await res.json();
    if(j&&j[0]){const r={lat:parseFloat(j[0].lat),lng:parseFloat(j[0].lon)};_geoCache[key]=r;return r;}
  }
  return null;
}
// Itinéraire : Valhalla (profil poids lourd) en premier choix, puis OSRM en secours. Services publics gratuits, sans clé.
async function routeKm(a,b){
  try{
    const q=encodeURIComponent(JSON.stringify({locations:[{lat:a.lat,lon:a.lng},{lat:b.lat,lon:b.lng}],costing:'truck',directions_options:{units:'kilometers'}}));
    const res=await fetch('https://valhalla1.openstreetmap.de/route?json='+q);
    if(res.ok){const j=await res.json();const k=j&&j.trip&&j.trip.summary?j.trip.summary.length:null;if(k!=null)return Math.round(k);}
  }catch(_){}
  for(const base of ['https://routing.openstreetmap.de/routed-car','https://router.project-osrm.org']){
    try{
      const res=await fetch(`${base}/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=false`);
      if(res.ok){const j=await res.json();const d=j&&j.routes&&j.routes[0]?j.routes[0].distance:null;if(d!=null)return Math.round(d/1000);}
    }catch(_){}
  }
  throw new Error('service d\'itinéraire indisponible pour le moment');
}
async function computeDistanceKm(m){
  if(!m.pickupCity||!m.deliveryCity)return null;
  const a=await geocodeAddr(m.pickupStreet,m.pickupPostal,m.pickupCity,m.pickupCountry);
  const b=await geocodeAddr(m.deliveryStreet,m.deliveryPostal,m.deliveryCity,m.deliveryCountry);
  if(!a||!b)return null;
  return await routeKm(a,b);
}
async function calcKmFromForm(){
  const st=document.getElementById('km-status');
  const m={pickupStreet:val('f-pickstreet'),pickupPostal:val('f-pickpostal'),pickupCity:val('f-pickcity'),pickupCountry:val('f-pickcountry'),
    deliveryStreet:val('f-delivstreet'),deliveryPostal:val('f-delivpostal'),deliveryCity:val('f-delivcity'),deliveryCountry:val('f-delivcountry')};
  if(!m.pickupCity||!m.deliveryCity){st.textContent='Renseigne d\'abord la ville de chargement et de livraison.';return;}
  st.textContent='⏳ Calcul en cours…';
  try{
    const km=await computeDistanceKm(m);
    if(km==null){st.textContent='Adresse introuvable : vérifie la ville, le code postal et le pays, ou saisis les km à la main.';return;}
    document.getElementById('f-km').value=km;
    st.textContent='✓ '+km+' km (itinéraire poids lourd — indicatif)';
  }catch(e){st.textContent='Calcul impossible : '+e.message+'. Tu peux saisir les km à la main.';}
}
async function calcKmForMission(id){
  const m=db.missions.find(x=>x.id===id);if(!m)return;
  setLoading(true);
  try{
    const km=await computeDistanceKm(m);
    if(km==null){alert('Adresse introuvable : modifie la mission pour corriger l\'adresse ou saisir les km à la main.');}
    else{
      const{error}=await sb.from('missions').update({distance_km:km}).eq('id',id);
      if(error)alert('Km non enregistrés : '+error.message);else{m.distanceKm=km;}
    }
  }catch(e){alert('Calcul impossible : '+e.message);}
  setLoading(false);refreshDetail();
}

function toggleSelected(id,on){db.selectedIds=db.selectedIds.filter(x=>x!==id);if(on)db.selectedIds.push(id);render();}

function selectedVehicles(){return db.missions.flatMap(m=>m.cars.filter(c=>db.selectedIds.includes(c.id)).map(c=>({m,c})));}

async function assignCarrier(){
  const carrierId=document.getElementById('bulk-carrier').value;
  if(!carrierId){alert('Choisis un transporteur.');return;}
  const items=selectedVehicles();
  if(!items.length){alert('Coche au moins un véhicule.');return;}
  setLoading(true);
  const mids=[...new Set(items.map(({m})=>m.id))];
  const tokens=[];
  const earlyStatuses=['à planifier','attribué'];
  for(const mid of mids){
    const m=db.missions.find(x=>x.id===mid);
    m.carrierId=carrierId;
    const shouldUpgradeStatus=earlyStatuses.includes(m.status);
    if(shouldUpgradeStatus)m.status='attribué';
    // Récupère le carrier_token depuis Supabase (généré automatiquement par la DB)
    const updatePayload={carrier_id:carrierId};
    if(shouldUpgradeStatus)updatePayload.status='attribué';
    const {data,error}=await sb.from('missions')
      .update(updatePayload)
      .eq('id',mid)
      .select('carrier_token,ref')
      .single();
    if(data?.carrier_token){
      m.carrierToken=data.carrier_token;
      tokens.push({m,token:data.carrier_token});
    }
  }
  setLoading(false);
  render();

  if(!tokens.length){alert('Transporteur affecté.');return;}

  const emailInput=document.getElementById('bulk-email').value.trim();
  const carrier=db.carriers.find(x=>x.id===carrierId);
  const carrierEmail=emailInput||carrier?.email||'';
  const baseUrl=window.location.origin+window.location.pathname;

  if(tokens.length===1){
    const {m,token}=tokens[0];
    const link=`${baseUrl}?t=${token}`;
    if(carrierEmail){
      const subject=`AutoDispatch · Transport Confirmation · ${m.ref}`;
      const body=buildCarrierEmail(m,link,carrier?.name||'');
      showEmailDraft(carrierEmail,subject,body);
    } else {
      try{await navigator.clipboard.writeText(link);}catch(e){}
      alert(`✓ Transporteur affecté !\n\nLien portail copié dans le presse-papier :\n${link}\n\nTu peux l'envoyer par e-mail au transporteur.`);
    }
  } else {
    const allLinks=tokens.map(({m,token})=>`${m.ref} : ${baseUrl}?t=${token}`).join('\n');
    if(carrierEmail){
      const subject=`AutoDispatch · Transport Confirmation · ${tokens.map(t=>t.m.ref).join(', ')}`;
      const missionBlocks=tokens.map(({m,token})=>{
        const link=`${baseUrl}?t=${token}`;
        const allDocs=m.cars.flatMap(c=>(c.docs||[]).filter(d=>d.url).map(d=>({car:c,doc:d})));
        const docsSection=allDocs.length
          ?`\n  📎 Documents:\n`+allDocs.map(({car,doc})=>`    • ${car.make} ${car.model}${car.plate?' ('+car.plate+')':''} – ${doc.name||doc.phase||'Document'}: ${doc.url}`).join('\n')
          :'';
        return `Order ${m.ref} · Portal link: ${link}${docsSection}`;
      }).join('\n\n');
      const body=`Dear,\n\nPlease use the links below to confirm loading and delivery of the vehicles:\n\n${missionBlocks}\n\nKind regards`;
      showEmailDraft(carrierEmail,subject,body);
    } else {
      try{await navigator.clipboard.writeText(allLinks);}catch(e){}
      alert(`✓ Transporteur affecté pour ${tokens.length} missions !\n\nLiens copiés dans le presse-papier.`);
    }
  }
}

// Helper — formats an address block on separate lines
function fmtAddr(site,street,postal,city,country){
  return [site,street,[postal,city].filter(Boolean).join(' '),country].filter(Boolean).join('\n');
}

function buildCarrierEmail(m,link,carrierName){
  const allDocs=m.cars.flatMap(c=>(c.docs||[]).filter(d=>d.url).map(d=>({car:c,doc:d})));
  const docsSection=allDocs.length
    ?`\n\n📎 DOCUMENTS TO DOWNLOAD (${allDocs.length}):\n`
      +allDocs.map(({car,doc})=>`  • ${car.make} ${car.model}${car.plate?' ('+car.plate+')':''} – ${doc.name||doc.phase||'Document'}:\n    ${doc.url}`).join('\n')
    :'';
  const sep='─────────────────────────────';
  const clientObj=getClient(m);
  const billingLines=clientObj.name?[
    ``,sep,
    `🧾 TRANSPORT TO BE INVOICED TO:`,
    `   ${clientObj.name}${clientObj.vat?' · VAT: '+clientObj.vat:''}`,
    ...(clientObj.street?[`   ${clientObj.street}${clientObj.postal?' · '+clientObj.postal:''}${clientObj.city?' '+clientObj.city:''}`]:[]),
    ...(clientObj.billingEmail?[`   Billing e-mail: ${clientObj.billingEmail}`]:[]),
    sep
  ]:[];
  return [
    `Dear${carrierName?' '+carrierName:''},`,
    ``,
    `Please use the tracking link below to confirm loading and delivery of the vehicles:`,
    ``,
    link,
    ``,
    sep,
    `Transport Order : ${m.ref}`,
    `Vehicles        : ${m.cars.length}`,
    sep,
    ``,
    `📦 COLLECTION`,
    fmtAddr(m.pickupSite,m.pickupStreet,m.pickupPostal,m.pickupCity,m.pickupCountry)||'—',
    `Date: ${pretty(m.pickupDate)}`,
    ``,
    `🏁 DELIVERY`,
    fmtAddr(m.deliverySite,m.deliveryStreet,m.deliveryPostal,m.deliveryCity,m.deliveryCountry)||'—',
    `Date: ${pretty(m.deliveryDate)}`,
    sep,
    ``,
    `VEHICLES:`,
    ...m.cars.map((c,i)=>`  ${i+1}. ${c.make} ${c.model}\n     VIN   : ${c.vin||'—'}\n     Plate : ${c.plate||'—'}`),
    docsSection||null,
    ``,
    `Via this link you will be able to:`,
    `  • Confirm loading of each vehicle with photos`,
    `  • Photograph CMRs at pickup and at delivery`,
    `  • Confirm delivery of each vehicle`,
    ...billingLines,
    ``,
    `Kind regards`
  ].filter(x=>x!==null).join('\n');
}

function copyPortalLink(missionId){
  const m=db.missions.find(x=>x.id===missionId);
  if(!m?.carrierToken){alert('Aucun lien portail disponible pour cette mission.');return;}
  const link=`${window.location.origin}${window.location.pathname}?t=${m.carrierToken}`;
  navigator.clipboard.writeText(link).then(()=>alert('Lien copié !\n'+link)).catch(()=>alert('Lien portail :\n'+link));
}

function getYardLang(items){
  // Detect language from first item's pickup country
  const country=(items[0]?.m?.pickupCountry||'');
  const code=detectLang(country);
  return YARD_I18N[code]||YARD_I18N.en;
}

function openYardDraft(){
  const items=selectedVehicles(),email=document.getElementById('yard-email').value.trim();
  if(!items.length){alert("Coche d'abord les véhicules.");return;}
  if(!email){alert("Ajoute l'e-mail du parc.");return;}
  const truckPlate=(document.getElementById('truck-plate')?.value||'').trim();
  const driverName=(document.getElementById('driver-name')?.value||'').trim();
  const Y=getYardLang(items);
  const sep='─────────────────────────────';
  const truckLine=(truckPlate||driverName)
    ?[``,`${Y.truck} : ${truckPlate||Y.tbd}`,`${Y.driver} : ${driverName||Y.tbd}`].join('\n')
    :'';
  const vehicleBlocks=items.map(({m,c},i)=>{
    const allDocs=(c.docs||[]).filter(d=>d.url);
    const docLines=allDocs.length
      ?[``,`   📎 ${Y.docs} :`,...allDocs.map(d=>`      ${d.name||d.phase||'Document'}\n      ${d.url}`)].join('\n')
      :'';
    return [
      sep,
      `${i+1}. ${c.make} ${c.model}`,
      `   VIN   : ${c.vin||Y.tbd}`,
      `   Plaque: ${c.plate||Y.tbd}`,
      `   ${Y.order} : ${m.ref}`,
      ``,

async function saveMission(){
  const err=document.getElementById('form-error');
  const vin=val('f-vin').toUpperCase();
  if(!val('f-client')||!val('f-picksite')||!val('f-pickstreet')||!val('f-pickpostal')||!val('f-pickcity')||!val('f-delivsite')||!val('f-delivstreet')||!val('f-delivpostal')||!val('f-delivcity')||!val('f-make')||!val('f-model')){err.innerHTML='<div class="notice error">Complète le client, les noms de site, les deux adresses et la marque / le modèle.</div>';return;}
  if(vin&&!/^[A-HJ-NPR-Z0-9]{17}$/.test(vin)){err.innerHTML='<div class="notice error">Le VIN doit faire 17 caractères sans I, O ni Q.</div>';return;}
  const old=editingMission?db.missions.find(x=>x.id===editingMission):null;
  let cars=old?[...old.cars]:[];
  if(old)cars[0]={...cars[0],make:val('f-make'),model:val('f-model'),vin,plate:val('f-plate')};
  else cars=[{id:crypto.randomUUID(),make:val('f-make'),model:val('f-model'),vin,plate:val('f-plate'),status:'à charger',docs:[]}];
  document.querySelectorAll('#extra-cars .car-form').forEach(row=>{
    const get=k=>row.querySelector(`[data-extra="${k}"]`).value.trim();
    cars.push({id:crypto.randomUUID(),make:get('make'),model:get('model'),vin:get('vin').toUpperCase(),plate:get('plate').toUpperCase(),status:'à charger',docs:[]});
  });
  const m={...(old||{}),id:old?.id||crypto.randomUUID(),ref:val('f-ref'),clientId:val('f-client'),
    pickupSite:val('f-picksite'),pickupContact:val('f-pickcontact'),pickupStreet:val('f-pickstreet'),
    pickupPostal:val('f-pickpostal'),pickupCity:val('f-pickcity'),pickupCountry:val('f-pickcountry'),
    deliverySite:val('f-delivsite'),deliveryContact:val('f-delivcontact'),deliveryEmail:val('f-delivEmail'),deliveryStreet:val('f-delivstreet'),
    deliveryPostal:val('f-delivpostal'),deliveryCity:val('f-delivcity'),deliveryCountry:val('f-delivcountry'),
    pickupDate:val('f-load-date'),deliveryDate:val('f-deliv-date'),keys:val('f-keys'),
    priceSell:parseNum(val('f-price-sell')),priceBuy:parseNum(val('f-price-buy')),distanceKm:parseNum(val('f-km')),
    status:old?.status||'à planifier',cars,notifications:old?.notifications||[]};
  if(old&&(old.pickupDate!==m.pickupDate||old.deliveryDate!==m.deliveryDate)&&(m.pickupDate||m.deliveryDate))
    m.notifications.push({id:crypto.randomUUID(),kind:'planned',pickupDate:m.pickupDate,deliveryDate:m.deliveryDate,status:'pending',createdAt:new Date().toISOString()});
  if(!old&&(m.pickupDate||m.deliveryDate))
    m.notifications.push({id:crypto.randomUUID(),kind:'planned',pickupDate:m.pickupDate,deliveryDate:m.deliveryDate,status:'pending',createdAt:new Date().toISOString()});
  setLoading(true);
  // Distance : si les adresses ont changé, on repart de zéro ; si elle est vide, on tente le calcul automatique
  if(old&&m.distanceKm===old.distanceKm&&['pickupStreet','pickupPostal','pickupCity','pickupCountry','deliveryStreet','deliveryPostal','deliveryCity','deliveryCountry'].some(k=>(old[k]||'')!==(m[k]||'')))m.distanceKm=null;
  if(m.distanceKm==null){try{m.distanceKm=await computeDistanceKm(m);}catch(e){console.warn('Calcul km impossible:',e.message);}}
  const saveErr=await dbUpsertMission(m);
  if(saveErr){setLoading(false);alert('⚠ Mission NON enregistrée : '+saveErr.message);return;}
  for(const c of m.cars)await dbUpsertCar(c,m.id);
  for(const n of m.notifications)await dbUpsertNotif(n,m.id);
  setLoading(false);
  if(old)db.missions=db.missions.map(x=>x.id===old.id?m:x);else db.missions.push(m);
  closeModal();render();
  // Auto-email client si une notification 'planned' vient d'être créée
  const newPlanned=m.notifications.filter(n=>n.kind==='planned'&&n.status==='pending');
  if(newPlanned.length){
    const latest=newPlanned[newPlanned.length-1];
    setTimeout(()=>autoEmailClient(m,latest),400);
  }
}

async function savePartner(kind,id){
  if(!val('p-name')){document.getElementById('form-error').innerHTML='<div class="notice error">Indique le nom de la société.</div>';return;}
  const p={id:id||crypto.randomUUID(),name:val('p-name'),vat:val('p-vat'),contact:val('p-contact'),phone:val('p-phone'),email:val('p-email'),billingEmail:val('p-billing'),street:val('p-street'),postal:val('p-postal'),city:val('p-city'),country:val('p-country')};
  const table=kind==='clients'?'clients':'carriers';
  setLoading(true);
  await dbUpsertPartner(table,p);
  setLoading(false);
  db[kind]=id?db[kind].map(x=>x.id===id?p:x):[...db[kind],p];
  closeModal();render();
}

async function deletePartner(kind,id){
  if(!confirm('Supprimer cette fiche ?'))return;
  const table=kind==='clients'?'clients':'carriers';
  setLoading(true);
  await dbDelete(table,id);
  setLoading(false);
  db[kind]=db[kind].filter(x=>x.id!==id);render();
}

  ${(()=>{
    const kindLabels={planned:'📅 Planification',loaded:'🚛 Chargement',delivered:'✅ Livraison'};
    const sentNots=m.notifications||[];
    const hasSent=k=>sentNots.some(n=>n.kind===k&&n.status==='sent');
    const hasDraft=k=>sentNots.some(n=>n.kind===k);
    const lastOf=k=>sentNots.filter(n=>n.kind===k).slice(-1)[0];
    const notifLang=getClientLang(m);
    const langTag=getClientLangCode(m).toUpperCase();
    const rows=['planned','loaded','delivered'].map(kind=>{
      const n=lastOf(kind);
      const sent=hasSent(kind);
      const draft=hasDraft(kind);
      const readyToSend=(kind==='planned'&&m.carrierId)||(kind==='loaded'&&m.cars.every(c=>c.status==='chargé'||c.status==='livré'))||(kind==='delivered'&&m.status==='livré');
      const label=kindLabels[kind];

      if(draft)return`<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)"><span style="font-size:12px">${label} <span style="color:#e0850c;font-weight:700">⏳ brouillon</span></span><div style="display:flex;gap:6px"><button class="btn primary" style="font-size:11px" onclick="draftClient('${esc(m.id)}','${esc(n.id)}')">Ouvrir email</button><button class="btn" style="font-size:11px" onclick="markSent('${esc(m.id)}','${esc(n.id)}')">Marquer envoyé</button></div></div>`;
      return`<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)"><span style="font-size:12px">${label} <span style="color:var(--muted)">— non envoyée</span></span>${readyToSend?`<button class="btn" style="font-size:11px" onclick="triggerClientNotif('${esc(m.id)}','${kind}')">Préparer (${langTag})</button>`:'<span style="font-size:11px;color:var(--muted)">en attente</span>'}</div>`;
    });
    return`<div style="font-size:11px;color:var(--muted);margin-bottom:8px">Email client en <strong>${langTag}</strong> (pays client de facturation)</div>`+rows.join('');
  })()}
  </div>
  <div class="detail-block"><h3>Véhicules · ${m.cars.length}</h3>${m.cars.map(c=>`<div class="notification"><h4>${esc(c.make)} ${esc(c.model)} · ${badge(c.status)}</h4><p>VIN ${esc(c.vin||'—')}<br>Plaque ${esc(c.plate||'—')}</p><div class="toolbar"><select onchange="vehicleStatus('${esc(m.id)}','${esc(c.id)}',this.value)">${['à charger','chargé','livré'].map(s=>`<option ${c.status===s?'selected':''}>${s}</option>`).join('')}</select><label class="btn">Ajouter document<input type="file" hidden onchange="addDoc('${esc(m.id)}','${esc(c.id)}',this.files[0])"></label></div>${(c.docs||[]).map(x=>`<div class="doc-row">${esc(x.name)}<small>${esc(x.phase)}</small>${x.url?`<a href="${esc(x.url)}" target="_blank" style="color:var(--blue);margin-left:8px">↓ Télécharger</a>`:''}</div>`).join('')}</div>`).join('')}</div>

  d.classList.add('open');
}

function getClientLang(m){
  const clientObj=getClient(m);
  const code=detectLang(clientObj.country||m.deliveryCountry);
  return CLIENT_NOTIF_I18N[code]||CLIENT_NOTIF_I18N.en;
}
function getClientLangCode(m){
  const clientObj=getClient(m);
  return detectLang(clientObj.country||m.deliveryCountry);
}

function buildClientEmail(m,n){
  const clientObj=getClient(m);
  const email=clientObj.email||clientObj.billingEmail;
  if(!email)return null;
  const clientName=clientObj.name||'';
  const kind=n.kind||'planned';
  const C=getClientLang(m);
  const t=C[kind]||C.planned;
  const delivLbl=(kind==='delivered')?C.delivered_lbl:C.delivery_lbl;
  const sep='─────────────────────────────';
  const subject=`${t.subject} ${m.ref}`;
  const body=[
    `${C.hello}${clientName?' '+clientName+',':','}`,
    ``,
    `${t.body_intro} ${m.ref}.`,
    `${t.body_route}`,
    ``,
    sep,
    `📦 ${C.pickup_lbl} : ${pretty(n.pickupDate)}`,
    ``,
    ...fmtAddr(m.pickupSite,m.pickupStreet,m.pickupPostal,m.pickupCity,m.pickupCountry).split('\n'),
    ``,
    `🏁 ${delivLbl} : ${pretty(n.deliveryDate)}`,
    ``,
    ...fmtAddr(m.deliverySite,m.deliveryStreet,m.deliveryPostal,m.deliveryCity,m.deliveryCountry).split('\n'),
    sep,
    ``,
    `${C.vehicles_lbl} :`,
    ...m.cars.map(c=>`  • ${c.make} ${c.model}${c.vin?'  |  VIN '+c.vin:''}${c.plate?'  |  '+c.plate:''}`),
    ``,
    `${C.contact_us}`,
    ``,
    ...((kind==='loaded'||kind==='delivered')&&m.deliveryToken&&!inspectionComplete(m)?[
      ``,
      `─────────────────────────────`,
      ``,
      C.inspection_title||'📋 VEHICLE INSPECTION AT DELIVERY',
      kind==='delivered'
        ?(C.inspection_text_delivery||C.inspection_text||'Please use the link below to report any damage and sign the delivery receipt:')
        :(C.inspection_text||'Please use the link below when your vehicle(s) arrive to report any damage and sign the delivery receipt:'),
      ``,
      `👉 ${window.location.origin}${window.location.pathname}?inspection=${m.deliveryToken}`,
      ``,
      C.inspection_note||'(This link is valid for this delivery only — please complete the form on arrival of the vehicles)',
    ]:[]),
    `${C.regards}`
  ].join('\n');
  return{email,subject,body};
}

// Ouvre le client mail natif (Mail sur Mac) avec l'email pré-rempli
function showEmailDraft(email,subject,body){
  location.href='mailto:'+email+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
}

function draftDeliverySite(mid){
  const m=db.missions.find(x=>x.id===mid);
  if(!m)return;
  const email=m.deliveryEmail;
  if(!email){alert('Ajoute d\'abord l\'e-mail du site de livraison dans la fiche mission.');return;}
  // Générer le delivery_token à la volée si la mission n'en a pas encore (missions antérieures au déploiement)
  if(!m.deliveryToken){
    m.deliveryToken=crypto.randomUUID();
    sb.from('missions').update({delivery_token:m.deliveryToken}).eq('id',mid).then(({error})=>{if(error)console.error('delivery_token save',error);});
  }
  const code=detectLang(m.deliveryCountry);
  const T=DELIVERY_SITE_I18N[code]||DELIVERY_SITE_I18N.en;
  const clientObj=getClient(m);
  const sep='─────────────────────────────';
  const subject=`${T.subject} — ${m.ref}`;
  const body=[
    T.hello,``,
    T.intro,``,sep,
    `${T.date_lbl} ${pretty(m.deliveryDate)}`,``,
    `${m.deliverySite||''}`,
    ...fmtAddr('',m.deliveryStreet,m.deliveryPostal,m.deliveryCity,m.deliveryCountry).split('\n').filter(Boolean),
    sep,``,
    `${T.vehicles_lbl}`,
    ...m.cars.map(c=>`  • ${c.make} ${c.model}${c.vin?'  |  VIN '+c.vin:''}${c.plate?'  |  '+c.plate:''}`),
    ``,
    ...(clientObj.name?[`${T.sender_lbl} ${clientObj.name}`]:[]),
    ``,
    T.contact,``,T.regards,
    // Bloc inspection : inclus si un token existe et que l'état des lieux n'est pas encore soumis
    ...(m.deliveryToken&&!inspectionComplete(m)?[
      ``,sep,``,
      T.insp_title||'📋 VEHICLE CONDITION REPORT',
      T.insp_text||'Please use the link below upon vehicle arrival to report any damage and sign the delivery receipt:',
      ``,
      `👉 ${window.location.origin}${window.location.pathname}?inspection=${m.deliveryToken}`,
      ``,
      T.insp_note||'(One-time link — to be completed upon arrival of the vehicles)',
    ]:[])
  ].join('\n');
  showEmailDraft(email,subject,body);
}

function draftClient(mid,nid){
  const m=db.missions.find(x=>x.id===mid),n=(m.notifications||[]).find(x=>x.id===nid);
  if(!n)return;
  // Générer le delivery_token à la volée si la mission n'en a pas encore (missions antérieures au déploiement)
  if(!m.deliveryToken&&(n.kind==='loaded'||n.kind==='delivered')){
    m.deliveryToken=crypto.randomUUID();
    sb.from('missions').update({delivery_token:m.deliveryToken}).eq('id',mid).then(({error})=>{if(error)console.error('delivery_token save',error);});
  }
  const mail=buildClientEmail(m,n);
  if(!mail){alert('Ajoute une adresse e-mail à la fiche client (onglet Clients).');return;}
  showEmailDraft(mail.email,mail.subject,mail.body);
}

async function triggerClientNotif(mid,kind){
  const m=db.missions.find(x=>x.id===mid);
  if(!m)return;
  if((m.notifications||[]).some(n=>n.kind===kind&&n.status==='sent')){
    if(!confirm('Une notification de ce type a déjà été envoyée. Créer un nouveau brouillon quand même ?'))return;
  }
  // Pour "livraison" : générer le delivery_token si pas encore présent
  if(kind==='delivered'&&!m.deliveryToken){
    m.deliveryToken=crypto.randomUUID();
    sb.from('missions').update({delivery_token:m.deliveryToken}).eq('id',mid).then(({error})=>{if(error)console.error('delivery_token',error);});
  }
  const n={id:crypto.randomUUID(),kind,pickupDate:m.pickupDate,deliveryDate:m.deliveryDate,status:'pending',createdAt:new Date().toISOString()};
  m.notifications=m.notifications||[];
  m.notifications.push(n);
  const mail=buildClientEmail(m,n);
  dbUpsertNotif(n,mid).catch(e=>console.error('notif',e));
  refreshDetail();
  if(mail){
    showEmailDraft(mail.email,mail.subject,mail.body);
  } else {
    alert('Ajoute une adresse e-mail à la fiche client (onglet Clients).');
  }
}

function autoEmailClient(m,n){
  const mail=buildClientEmail(m,n);
  if(mail)showEmailDraft(mail.email,mail.subject,mail.body);
}

async function markSent(mid,nid){
  if(!confirm('As-tu bien envoyé le message depuis ta messagerie ?'))return;
  const m=db.missions.find(x=>x.id===mid),n=m.notifications.find(x=>x.id===nid);
  n.status='sent';
  await sb.from('notifications').update({status:'sent'}).eq('id',nid);
  refreshDetail();
}

async function notifyLoaded(id){
  const m=db.missions.find(x=>x.id===id);
  if(m.notifications.some(n=>n.kind==='loaded')){alert('La notification de chargement existe déjà.');return;}
  m.status='en transport';m.cars.forEach(c=>c.status='chargé');
  setLoading(true);
  // Génère le delivery_token pour la page d'inspection si pas encore existant
  if(!m.deliveryToken){
    m.deliveryToken=crypto.randomUUID();
    await sb.from('missions').update({status:'en transport',delivery_token:m.deliveryToken}).eq('id',id);
  } else {
    await sb.from('missions').update({status:'en transport'}).eq('id',id);
  }
  for(const c of m.cars)await sb.from('cars').update({status:'chargé'}).eq('id',c.id);
  const n={id:crypto.randomUUID(),kind:'loaded',pickupDate:m.pickupDate,deliveryDate:m.deliveryDate,status:'pending',createdAt:new Date().toISOString()};
  m.notifications.push(n);
  await dbUpsertNotif(n,id);
  setLoading(false);
  refreshDetail();
  // Auto-email client : chargement confirmé (avec lien inspection)
  setTimeout(()=>autoEmailClient(m,n),400);
}

async function missionStatus(id,status){
  const m=db.missions.find(x=>x.id===id);m.status=status;
  setLoading(true);
  await sb.from('missions').update({status}).eq('id',id);
  m.notifications=m.notifications||[];
  if(status==='en transport'&&!m.notifications.some(n=>n.kind==='loaded')){
    const n={id:crypto.randomUUID(),kind:'loaded',pickupDate:m.pickupDate,deliveryDate:m.deliveryDate,status:'pending',createdAt:new Date().toISOString()};
    m.notifications.push(n);await dbUpsertNotif(n,id);
  }
  if(status==='livré'&&!m.notifications.some(n=>n.kind==='delivered')){
    const n={id:crypto.randomUUID(),kind:'delivered',pickupDate:m.pickupDate,deliveryDate:m.deliveryDate,status:'pending',createdAt:new Date().toISOString()};
    m.notifications.push(n);await dbUpsertNotif(n,id);
  }
  setLoading(false);refreshDetail();
}

async function vehicleStatus(mid,vid,status){
  const m=db.missions.find(x=>x.id===mid),c=m.cars.find(x=>x.id===vid);
  c.status=status;
  await sb.from('cars').update({status}).eq('id',vid);
  if(status==='chargé'&&m.cars.every(x=>x.status==='chargé'||x.status==='livré')&&!m.notifications.some(n=>n.kind==='loaded'))
    await notifyLoaded(mid);
  else refreshDetail();
}

async function addDoc(mid,vid,file){
  if(!file)return;
  const m=db.missions.find(x=>x.id===mid),c=m.cars.find(x=>x.id===vid);
  setLoading(true);
  try{
    let fileUrl=null;
    const ext=file.name.split('.').pop()||'pdf';
    const path=`docs/${mid}/${vid}/${Date.now()}.${ext}`;
    const {error:uploadErr}=await sb.storage.from('carrier-photos').upload(path,file,{contentType:file.type,upsert:true});
    if(!uploadErr){
      const {data}=sb.storage.from('carrier-photos').getPublicUrl(path);
      fileUrl=data.publicUrl;
    }
    const phase=c.status==='livré'?'livraison':'chargement';
    const doc={id:crypto.randomUUID(),name:file.name,phase,date:new Date().toLocaleDateString('fr-BE'),url:fileUrl};
    c.docs=c.docs||[];c.docs.push(doc);
    await sb.from('documents').insert({id:doc.id,car_id:vid,mission_id:mid,name:doc.name,phase:doc.phase,date:doc.date,url:fileUrl});
    refreshDetail();
    if(uploadErr)alert('Document enregistré mais upload Storage échoué : '+uploadErr.message);
  }catch(e){alert('Erreur : '+e.message);}
  setLoading(false);
}
