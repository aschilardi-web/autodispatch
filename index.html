async function initCarrierPortal(){
  const portal=document.getElementById('carrier-portal');
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('app-shell').style.display='none';
  portal.style.display='block';
  setLoading(true);
  try{
    // Récupère la mission par son token (anon, pas d'auth)
    const {data:missions,error}=await sb.from('missions')
      .select('*, clients(name), carriers(name)')
      .eq('carrier_token',CARRIER_TOKEN);
    if(error)throw error;
    if(!missions||!missions.length){renderPortalError('Lien invalide ou expiré.');setLoading(false);return;}
    portalMission=missions[0];
    const [{data:cars},{data:events},{data:docs}]=await Promise.all([
      sb.from('cars').select('*').eq('mission_id',portalMission.id),
      sb.from('carrier_events').select('*').eq('mission_id',portalMission.id),
      sb.from('documents').select('*').eq('mission_id',portalMission.id)
    ]);
    portalCars=cars||[];
    portalEvents=events||[];
    portalDocs=docs||[];
    renderCarrierPortal();
  }catch(e){
    renderPortalError('Erreur : '+e.message);
  }
  setLoading(false);
}

function portalToast(msg,isError=true){
  const d=document.createElement('div');
  d.style.cssText=`position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:${isError?'#c0392b':'#2e7d52'};color:#fff;padding:14px 22px;border-radius:10px;font-size:14px;font-weight:600;z-index:99999;max-width:90%;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.25)`;
  d.textContent=msg;
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),isError?6000:3000);
}

// Catégories de photos — désormais localisées via getPhotoCatsLoading(lang) / getPhotoCatsDelivery(lang)

function getPortalEvents(carId,type){return portalEvents.filter(e=>e.car_id===carId&&e.event_type===type);}
function getEventsByKey(carId,type,key){return portalEvents.filter(e=>e.car_id===carId&&e.event_type===type&&e.notes===key);}
function phaseComplete(carId,type){
  // Phase complète uniquement quand le transporteur clique "Confirmer" → event_type='confirmed_loading'|'confirmed_delivery'
  return portalEvents.some(e=>e.car_id===carId&&e.event_type==='confirmed_'+type);
}

async function portalUploadVideo(carId,eventType,input){
  const rawFile=input.files[0];
  if(!rawFile)return;
  input.value='';
  const progWrap=document.getElementById(`vid-progress-${carId}-${eventType}`);
  const progBar=document.getElementById(`vid-progress-bar-${carId}-${eventType}`);
  const progLabel=document.getElementById(`vid-progress-label-${carId}-${eventType}`);
  if(progWrap)progWrap.style.display='block';

  // Limite 200MB
  if(rawFile.size>200*1024*1024){
    portalToast('Vidéo trop volumineuse (max 200 Mo). Essayez une vidéo plus courte.');
    if(progWrap)progWrap.style.display='none';
    return;
  }
  try{
    const ext=rawFile.name.split('.').pop().toLowerCase()||'mp4';
    const path=`${portalMission.id}/${carId}/${eventType}_video_${Date.now()}.${ext}`;
    // Upload avec suivi progression via XMLHttpRequest
    const publicUrl=await new Promise((resolve,reject)=>{
      const xhr=new XMLHttpRequest();
      // Construction manuelle de l'URL Supabase Storage
      const supaUrl=SUPABASE_URL.replace(/\/$/,'');
      xhr.open('POST',`${supaUrl}/storage/v1/object/carrier-photos/${path}`);
      xhr.setRequestHeader('Authorization','Bearer '+SUPABASE_ANON);
      xhr.setRequestHeader('x-upsert','true');
      xhr.setRequestHeader('Content-Type',rawFile.type||'video/mp4');
      xhr.upload.onprogress=e=>{
        if(e.lengthComputable){
          const pct=Math.round(e.loaded/e.total*100);
          if(progBar)progBar.style.width=pct+'%';
          if(progLabel)progLabel.textContent=`Envoi en cours… ${pct}%`;
        }
      };
      xhr.onload=()=>{
        if(xhr.status>=200&&xhr.status<300){
          const {data:{publicUrl:pu}}=sb.storage.from('carrier-photos').getPublicUrl(path);
          resolve(pu);
        } else reject(new Error('Upload HTTP '+xhr.status));
      };
      xhr.onerror=()=>reject(new Error('Erreur réseau'));
      xhr.send(rawFile);
    });
    // Enregistrer dans carrier_events
    const{error:evErr}=await sb.from('carrier_events')
      .insert({mission_id:portalMission.id,car_id:carId,event_type:eventType,photo_url:null,video_url:publicUrl,notes:'video'});
    if(evErr)console.warn('[portalUploadVideo] carrier_events:',evErr.message);
    // Rafraîchir les events du portail
    const{data:evts}=await sb.from('carrier_events').select('*').eq('mission_id',portalMission.id);
    portalEvents=evts||[];
    if(progLabel)progLabel.textContent='✓ Vidéo envoyée !';
    if(progBar)progBar.style.width='100%';
    if(progBar)progBar.style.background='var(--green)';
    setTimeout(()=>renderCarrierPortal(),800);
  }catch(err){
    console.error('[portalUploadVideo]',err);
    portalToast('Erreur vidéo : '+err.message);
    if(progWrap)progWrap.style.display='none';
  }
}

// Compresse une image via canvas — max 1920px, JPEG 80% → ~200–400KB au lieu de 3–8MB
function compressImage(file,maxPx=1920,quality=0.80){
  return new Promise((resolve)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(url);
      let{width:w,height:h}=img;
      if(w>maxPx||h>maxPx){const r=Math.min(maxPx/w,maxPx/h);w=Math.round(w*r);h=Math.round(h*r);}
      const canvas=document.createElement('canvas');
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      canvas.toBlob(blob=>resolve(blob||file),'image/jpeg',quality);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);resolve(file);};
    img.src=url;
  });
}

async function portalUploadPhoto(carId,eventType,input,photoKey){
  const rawFile=input.files[0];
  if(!rawFile)return;
  // Reset input pour permettre de reprendre la même photo
  input.value='';
  try{
    const ts=new Date();
    // GPS en arrière-plan (best-effort)
    let lat=null,lng=null;
    try{
      const pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:4000,maximumAge:30000}));
      lat=pos.coords.latitude;lng=pos.coords.longitude;
    }catch(_){}
    // Phase lisible pour le watermark
    const phaseLabel=eventType==='loading'?'Chargement':'Livraison';
    // Catégorie photo lisible (ex: "face_avant" → "Face avant")
    const catLabel=(photoKey||'').replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
    const zoneLabel=`${catLabel} — ${phaseLabel}`;
    // Watermark + compression
    const dataUrl=await watermarkPhoto(rawFile,ts,lat,lng,zoneLabel);
    const blob=await(await fetch(dataUrl)).blob();
    const file=new File([blob],rawFile.name,{type:'image/jpeg'});
    const path=`${portalMission.id}/${carId}/${eventType}_${photoKey}_${Date.now()}.jpg`;
    const {error:uploadErr}=await sb.storage.from('carrier-photos').upload(path,file,{contentType:'image/jpeg'});
    if(uploadErr)throw uploadErr;
    const {data:{publicUrl}}=sb.storage.from('carrier-photos').getPublicUrl(path);
    const {data:ev,error:evErr}=await sb.from('carrier_events')
      .insert({mission_id:portalMission.id,car_id:carId,event_type:eventType,photo_url:publicUrl,notes:photoKey})
      .select().single();
    if(evErr)throw evErr;
    portalEvents.push(ev);
    renderCarrierPortal();
  }catch(e){
    portalToast('Erreur upload : '+e.message+' — Vérifie que le bucket carrier-photos est créé et public dans Supabase Storage.');
  }
}

async function _doPortalConfirm(carId,eventType){
  // Feedback visuel pendant la requête
  const btnId='portal-confirm-doing';
  const existing=document.getElementById(btnId);
  if(existing)existing.textContent='⏳ Confirmation en cours…';

  try{
    const newStatus=eventType==='loading'?'chargé':'livré';
    const {error}=await sb.from('cars').update({status:newStatus}).eq('id',carId);
    if(error)throw error;
    const car=portalCars.find(c=>c.id===carId);
    const evPayload={
      mission_id:portalMission.id,
      car_id:carId,
      event_type:'confirmed_'+eventType,
      photo_url:null,
      notes:`${car?car.make+' '+car.model:'Véhicule'} — confirmed at ${new Date().toISOString()}`
    };
    const {error:evErr}=await sb.from('carrier_events').insert(evPayload);
    if(evErr)console.warn('[_doPortalConfirm] carrier_events insert:',evErr.message);
    if(car)car.status=newStatus;
    renderCarrierPortal();
  }catch(e){
    // Affiche l'erreur inline (alert() bloqué sur GitHub Pages/mobile)
    const errDiv=document.createElement('div');
    errDiv.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#c0392b;color:#fff;padding:14px 22px;border-radius:10px;font-size:14px;font-weight:600;z-index:99999;max-width:90%';
    errDiv.textContent='❌ Erreur : '+e.message;
    document.body.appendChild(errDiv);
    setTimeout(()=>errDiv.remove(),5000);
  }
}

      ${meta?`<div style="font-size:11px;color:#6b7a8d;font-family:monospace;margin-top:3px">${meta}</div>`:''}
    </div>
    ${done
      ?`<div style="text-align:right"><div style="color:#38a169;font-weight:800;font-size:13px">✅ Terminé</div>
         ${c.inspection_pdf_url?`<a href="${esc(c.inspection_pdf_url)}" target="_blank" rel="noopener" style="font-size:12px;color:#2675a9;font-weight:700">📄 Rapport PDF</a>`:''}</div>`
      :`<button onclick="inspSelectCar(${i})" style="background:#102d4c;color:white;border:none;border-radius:10px;padding:12px 18px;font-size:14px;font-weight:700;cursor:pointer">Inspecter →</button>`}
  </div>`;
}

function inspShowHome(){
  const m=inspState.mission;
  const cars=m.cars||[];
  if(!cars.length){renderInspectionPage();return;}
  const todo=cars.filter(c=>!c.inspection_submitted_at);
  if(!todo.length){
    inspShell(`<div style="text-align:center;margin:10px 0 18px"><div style="font-size:44px">✅</div>
      <div style="font-size:18px;font-weight:800;color:#1a2e4a">État des lieux complété</div>
      <div style="font-size:12px;color:#6b7a8d;margin-top:4px">Tous les véhicules ont été inspectés.</div></div>`
      +cars.map((c,i)=>inspCarCardHtml(c,i,true)).join(''));
    return;
  }
  if(cars.length===1){inspSelectCar(0);return;}
  inspShell(`<div style="font-size:13px;color:#1a2e4a;font-weight:600;margin:4px 0 12px">Une inspection est réalisée <strong>pour chaque véhicule</strong>.
    Sélectionnez le véhicule à inspecter (${cars.length-todo.length}/${cars.length} terminé${cars.length-todo.length>1?'s':''}).</div>`
    +cars.map((c,i)=>inspCarCardHtml(c,i,!!c.inspection_submitted_at)).join(''));
}

function inspSelectCar(i){
  inspState.carIdx=i;
  inspState.damages=[];inspState.pendingDamage=null;
  inspState.sigClientDataUrl=null;inspState.signatureDataUrl=null;inspState.sigDriverDataUrl=null;
  renderInspectionPage();
  window.scrollTo(0,0);
}

function inspBackToList(){
  if(inspState.damages.length&&!confirm('Les dommages saisis pour ce véhicule seront perdus. Revenir à la liste ?'))return;
  inspShowHome();
}

function renderInspectionPage(){
  const m=inspState.mission;
  if(!m)return;
  _currentCarIdx=inspState.carIdx||0; // véhicule en cours d'inspection (une inspection par véhicule)
  const curCar=(m.cars&&m.cars[_currentCarIdx])||{};

  // Langue selon le pays de livraison
  const _inspLangCode=detectLang(m.delivery_country||'');
  const _inspL=CLIENT_NOTIF_I18N[_inspLangCode]||CLIENT_NOTIF_I18N.en;

  const multiCar=m.cars&&m.cars.length>1;

  // Véhicule inspecté (une inspection par véhicule) + retour à la liste si plusieurs véhicules
  const carTabsHtml=`<div class="insp-card">
    ${multiCar?`<button onclick="inspBackToList()" style="background:none;border:none;color:#2675a9;font-size:13px;font-weight:700;cursor:pointer;padding:0 0 10px">← Retour à la liste des véhicules</button>`:''}
    <div style="font-size:12px;font-weight:700;color:#6b7a8d;text-transform:uppercase;margin-bottom:8px">Véhicule inspecté</div>
    ${curCar.id?`<span style="display:inline-block;background:#e8edf3;border-radius:6px;padding:3px 10px;font-size:13px;margin:2px;font-weight:600">${esc(curCar.make||'')} ${esc(curCar.model||'')}${curCar.vin?` <span style="color:#6b7a8d;font-weight:400">VIN: ${esc(curCar.vin)}</span>`:''}${curCar.plate?` <span style="color:#6b7a8d;font-weight:400">· ${esc(curCar.plate)}</span>`:''}</span>`:'—'}
  </div>`;

  // Titre du SVG (nom de la voiture courante)
  const firstCar=m.cars&&m.cars[_currentCarIdx];
  const firstCarName=firstCar?`${firstCar.make||''} ${firstCar.model||''}`.trim()||'Voiture 1':'Véhicule';

  const portal=document.getElementById('inspection-portal');
  portal.innerHTML=`
  <div class="insp-header">
    <div style="font-size:11px;opacity:.7;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">État des lieux de livraison</div>
    <div style="font-size:20px;font-weight:800">${esc(m.ref||'Mission')}</div>
    <div style="font-size:12px;opacity:.8;margin-top:4px">${m.delivery_site?esc(m.delivery_site)+' — ':''} ${esc(m.delivery_city||'')} ${esc(m.delivery_country||'')}</div>
  </div>
  <div style="padding:14px;max-width:640px;margin:0 auto;padding-bottom:120px">

    ${carTabsHtml}

    <!-- Photos + Vidéos de chargement -->
    ${((inspState.loadingPhotos||[]).length||(inspState.loadingVideos||[]).length)?`
    <div class="insp-card" id="insp-loading-photos-card" style="${([...(inspState.loadingPhotos||[]),...(inspState.loadingVideos||[])]).filter(p=>p.car_id===curCar.id).length?'':'display:none'}">
      <div style="font-size:12px;font-weight:700;color:#6b7a8d;text-transform:uppercase;margin-bottom:10px">${_inspL.loading_photos_title||'📷 Photos au chargement'}</div>
      <p style="font-size:12px;color:#6b7a8d;margin:0 0 10px">${_inspL.loading_photos_text||'Ces photos ont été prises par le transporteur lors du chargement du véhicule.'}</p>
      <div id="insp-loading-photos" style="display:flex;flex-wrap:wrap;gap:8px">
        ${(inspState.loadingPhotos||[]).filter(p=>p.car_id===curCar.id).map(p=>`<img src="${esc(p.photo_url)}" onclick="inspOpenPhoto('${esc(p.photo_url)}')"
          style="width:90px;height:70px;object-fit:cover;border-radius:8px;border:1px solid #d8e4ec;cursor:pointer">`).join('')}
      </div>
      ${(inspState.loadingVideos||[]).filter(v=>v.car_id===curCar.id).length?`
      <div id="insp-loading-videos" style="margin-top:10px">
        <div style="font-size:11px;font-weight:700;color:#6b7a8d;margin-bottom:6px">🎬 Vidéo au chargement</div>
        ${(inspState.loadingVideos||[]).filter(v=>v.car_id===curCar.id).map(v=>`<video src="${esc(v.video_url)}" controls playsinline style="width:100%;border-radius:8px;max-height:220px;background:#000;border:1px solid #d8e4ec"></video>`).join('')}
      </div>`:''}
    </div>`:''}

    <!-- Schéma voiture -->
    <div class="insp-card">
      <div id="insp-svg-car-title" style="font-size:12px;font-weight:700;color:#6b7a8d;text-transform:uppercase;margin-bottom:10px">🚗 ${esc(firstCarName)} — Cliquez sur la zone endommagée</div>
      ${buildCarSVG()}
      <div style="font-size:11px;color:#6b7a8d;margin-top:8px;text-align:center">Appuyez sur une zone pour photographier et décrire un dommage</div>
    </div>

    <!-- Liste des dommages -->
    <div id="insp-damages-list"></div>

    <div class="insp-card">
      <div style="font-size:12px;font-weight:700;color:#6b7a8d;text-transform:uppercase;margin-bottom:14px">📦 Accessoires remis</div>
      <div style="display:grid;gap:12px">
        <div>
          <label style="font-size:11px;font-weight:800;color:#5f7589;display:block;margin-bottom:6px">🔑 CLEFS REÇUES</label>
          <select id="insp-keys" onchange="checkInspKeys()" style="width:100%;border:1px solid #d1d5db;border-radius:8px;padding:10px 12px;font-size:14px;background:white">
            <option value="">Sélectionner…</option>
            <option value="1" ${(m?.keys||'')=='1'?'selected':''}>1 clef</option>
            <option value="2" ${(m?.keys||'')=='2'?'selected':''}>2 clefs</option>
          </select>
          <div id="insp-keys-warning" style="display:none;margin-top:6px;padding:8px 10px;background:#fff4df;border-radius:6px;font-size:12px;color:#9a6b18;font-weight:600">⚠️ Attention : <span id="insp-keys-declared"></span> clef(s) déclarée(s) au chargement.</div>
        </div>
        <label style="display:flex;align-items:center;gap:12px;padding:12px;border:1px solid #d1d5db;border-radius:8px;cursor:pointer">
          <input type="checkbox" id="insp-manuel" style="width:18px;height:18px;accent-color:var(--blue);flex-shrink:0">
          <span style="font-size:13px;font-weight:600">📖 Manuel d'utilisation du véhicule remis</span>
        </label>
        <label style="display:flex;align-items:center;gap:12px;padding:12px;border:1px solid #d1d5db;border-radius:8px;cursor:pointer">
          <input type="checkbox" id="insp-kit" style="width:18px;height:18px;accent-color:var(--blue);flex-shrink:0">
          <span style="font-size:13px;font-weight:600">🔧 Kit réparation / Roue de secours présent(e)</span>
        </label>
        <label style="display:flex;align-items:center;gap:12px;padding:12px;border:1px solid #d1d5db;border-radius:8px;cursor:pointer">
          <input type="checkbox" id="insp-cable" style="width:18px;height:18px;accent-color:var(--blue);flex-shrink:0">
          <span style="font-size:13px;font-weight:600">🔌 Câble de recharge remis <span style="font-size:11px;font-weight:400;color:#6b7a8d">(véhicule électrique)</span></span>
        </label>
      </div>
    </div>

    <!-- Commentaires libres -->
    <div class="insp-card">
      <div style="font-size:12px;font-weight:700;color:#6b7a8d;text-transform:uppercase;margin-bottom:14px">💬 Commentaires</div>
      <textarea id="insp-comments" rows="4" placeholder="Remarques libres, réserves, observations particulières…" style="width:100%;border:1px solid #d1d5db;border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit;resize:vertical;box-sizing:border-box;color:#1a2e4a"></textarea>
    </div>

    <!-- Signatures -->
    <div class="insp-card" id="insp-sig-section">
      <div style="font-size:12px;font-weight:700;color:#6b7a8d;text-transform:uppercase;margin-bottom:16px">✍️ Signatures</div>

      <!-- Signature client -->
      <div style="margin-bottom:22px">
        <div style="font-size:11px;font-weight:800;color:#5f7589;letter-spacing:.5px;margin-bottom:8px">NOM ET PRÉNOM DU CLIENT (RÉCEPTIONNAIRE)</div>
        <input type="text" id="insp-client-name" placeholder="Nom et prénom du client" style="width:100%;border:1px solid #d1d5db;border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:10px;box-sizing:border-box">
        <canvas id="insp-sig-canvas-client" class="insp-sig-canvas" width="400" height="140"></canvas>
        <button onclick="clearInspSig('client')" style="margin-top:6px;font-size:12px;color:#6b7a8d;background:none;border:none;cursor:pointer;text-decoration:underline">Effacer</button>
      </div>

      <!-- Signature chauffeur -->
      <div>
        <div style="font-size:11px;font-weight:800;color:#5f7589;letter-spacing:.5px;margin-bottom:8px">NOM ET PRÉNOM DU CHAUFFEUR</div>
        <input type="text" id="insp-driver-name" placeholder="Nom et prénom du chauffeur" style="width:100%;border:1px solid #d1d5db;border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:10px;box-sizing:border-box">
        <canvas id="insp-sig-canvas-driver" class="insp-sig-canvas" width="400" height="140"></canvas>
        <button onclick="clearInspSig('driver')" style="margin-top:6px;font-size:12px;color:#6b7a8d;background:none;border:none;cursor:pointer;text-decoration:underline">Effacer</button>
      </div>
    </div>

    <!-- Bouton soumettre -->
    <div class="insp-submit-bar">
      <button id="insp-submit-btn" onclick="submitInspection()" style="width:100%;background:var(--navy);color:white;border:none;border-radius:10px;padding:16px;font-size:16px;font-weight:700;cursor:pointer">
        ✅ Soumettre l'état des lieux
      </button>
    </div>
  </div>

  <input type="file" id="insp-camera-input" accept="image/*" capture="environment" style="display:none" onchange="handleInspPhoto(this)">
  `;

  document.querySelectorAll('.car-svg-zone').forEach(el=>{
    el.addEventListener('click',()=>openZoneCamera(el.dataset.zone,el.dataset.label));
  });

  initInspSignaturePad();
}

let _currentZone=null,_currentZoneLabel=null,_currentCarIdx=0;

function switchCar(idx){
  _currentCarIdx=idx;
  // Mettre à jour les tabs
  document.querySelectorAll('.car-tab-btn').forEach((b,i)=>{
    b.style.background = i===idx ? '#102d4c' : 'white';
    b.style.color = i===idx ? 'white' : '#1a2e4a';
    b.style.fontWeight = i===idx ? '700' : '500';
  });
  // Mettre à jour le titre du SVG
  const m=inspState.mission;
  const car=m.cars[idx];
  const carName=car?`${car.make||''} ${car.model||''}`.trim()||`Voiture ${idx+1}`:'';
  const titleEl=document.getElementById('insp-svg-car-title');
  if(titleEl)titleEl.textContent=`🚗 ${carName} — Cliquez sur la zone endommagée`;
  // Filtrer les photos + vidéos de chargement par voiture
  const photosEl=document.getElementById('insp-loading-photos');
  const videosEl=document.getElementById('insp-loading-videos');
  const card=photosEl?photosEl.closest('.insp-card'):null;
  if(car){
    const filteredPhotos=(inspState.loadingPhotos||[]).filter(p=>p.car_id===car.id);
    const filteredVideos=(inspState.loadingVideos||[]).filter(v=>v.car_id===car.id);
    const hasAny=filteredPhotos.length||filteredVideos.length;
    if(photosEl){
      photosEl.style.display=filteredPhotos.length?'flex':'none';
      photosEl.innerHTML=filteredPhotos.map(p=>`<img src="${esc(p.photo_url)}" onclick="inspOpenPhoto('${esc(p.photo_url)}')" style="width:90px;height:70px;object-fit:cover;border-radius:8px;border:1px solid #d8e4ec;cursor:pointer">`).join('');
    }
    if(videosEl){
      videosEl.style.display=filteredVideos.length?'block':'none';
      videosEl.innerHTML=filteredVideos.length?`<div style="font-size:11px;font-weight:700;color:#6b7a8d;margin-bottom:6px">🎬 Vidéo au chargement</div>${filteredVideos.map(v=>`<video src="${esc(v.video_url)}" controls playsinline style="width:100%;border-radius:8px;max-height:220px;background:#000;border:1px solid #d8e4ec"></video>`).join('')}`:'';
    }
    if(card)card.style.display=hasAny?'':'none';
  } else if(card){
    card.style.display='none';
  }
  // Recolorer les zones selon les dommages de cette voiture
  document.querySelectorAll('.car-svg-zone').forEach(el=>{
    const zone=el.dataset.zone;
    const hasDmg=inspState.damages.some(d=>d.zone===zone&&d.carIdx===idx);
    if(hasDmg){el.setAttribute('fill','#ffd066');el.classList.add('has-damage');}
    else{el.removeAttribute('fill');el.classList.remove('has-damage');}
  });
}

function openZoneCamera(zone,label){
  _currentZone=zone;
  _currentZoneLabel=label;
  document.getElementById('insp-camera-input').value='';
  document.getElementById('insp-camera-input').click();
}

async function handleInspPhoto(input){
  if(!input.files||!input.files[0])return;
  const file=input.files[0];
  let lat=null,lng=null;
  try{
    const pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:5000}));
    lat=pos.coords.latitude;lng=pos.coords.longitude;
  }catch(e){console.warn('Géoloc refusée')}

  const ts=new Date();
  const m=inspState.mission;
  const car=m&&m.cars?m.cars[_currentCarIdx]:null;
  const carLabel=car?`${car.make||''} ${car.model||''}`.trim()||`Voiture ${_currentCarIdx+1}`:`Véhicule`;
  const dataUrl=await watermarkPhoto(file,ts,lat,lng,`${_currentZoneLabel} — ${carLabel}`);

  // Stocker temporairement, puis afficher l'overlay de description
  inspState.pendingDamage={
    zone:_currentZone,
    zoneLabel:_currentZoneLabel,
    carIdx:_currentCarIdx,
    carId:car?car.id:null,
    carLabel,
    description:'',
    photoBlob:file,
    photoDataUrl:dataUrl,
    lat,lng,
    ts:ts.toISOString(),
  };
  showDamageDescOverlay();
}

function showDamageDescOverlay(){
  const d=inspState.pendingDamage;
  if(!d)return;
  let overlay=document.getElementById('insp-desc-overlay');
  if(!overlay){
    overlay=document.createElement('div');
    overlay.id='insp-desc-overlay';
    overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:200;display:flex;align-items:flex-end';
    document.body.appendChild(overlay);
  }
  overlay.innerHTML=`
  <div style="background:white;border-radius:18px 18px 0 0;padding:22px 20px 32px;width:100%;max-height:82vh;overflow-y:auto;box-sizing:border-box">
    <div style="width:36px;height:4px;background:#d1d5db;border-radius:2px;margin:0 auto 18px"></div>
    <div style="font-weight:800;font-size:17px;color:#1a2e4a;margin-bottom:3px">📸 ${esc(d.zoneLabel)}</div>
    <div style="font-size:12px;color:#6b7a8d;margin-bottom:14px">🚗 ${esc(d.carLabel)}</div>
    <img src="${d.photoDataUrl}" style="width:100%;max-height:210px;object-fit:cover;border-radius:10px;margin-bottom:16px;display:block">
    <label style="font-size:11px;font-weight:700;color:#6b7a8d;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:7px">Description du dommage *</label>
    <textarea id="insp-desc-input" placeholder="Ex: rayure profonde sur le flanc gauche, bosse sur le coin, vitre fissurée..."
      style="width:100%;border:2px solid #2675a9;border-radius:10px;padding:12px 14px;font-size:15px;min-height:90px;box-sizing:border-box;resize:none;font-family:inherit;outline:none"></textarea>
    <div id="insp-desc-error" style="color:#e53e3e;font-size:12px;margin-top:5px;display:none">⚠️ Veuillez décrire le dommage</div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button onclick="cancelDamageDesc()" style="flex:1;padding:14px;border:1.5px solid #d1d5db;border-radius:10px;background:white;color:#6b7a8d;font-size:14px;font-weight:600;cursor:pointer">Annuler</button>
      <button onclick="confirmDamageDesc()" style="flex:2;padding:14px;border:none;border-radius:10px;background:#102d4c;color:white;font-size:15px;font-weight:700;cursor:pointer">✅ Confirmer</button>
    </div>
  </div>`;
  overlay.style.display='flex';
  setTimeout(()=>{const t=document.getElementById('insp-desc-input');if(t)t.focus();},120);
}

function cancelDamageDesc(){
  inspState.pendingDamage=null;
  const o=document.getElementById('insp-desc-overlay');
  if(o)o.style.display='none';
}

function confirmDamageDesc(){
  const input=document.getElementById('insp-desc-input');
  const desc=(input?input.value:'').trim();
  if(!desc){
    const err=document.getElementById('insp-desc-error');
    if(err)err.style.display='block';
    if(input){input.style.borderColor='#e53e3e';input.focus();}
    return;
  }
  const d=inspState.pendingDamage;
  d.description=desc;
  inspState.damages.push(d);
  inspState.pendingDamage=null;
  const o=document.getElementById('insp-desc-overlay');
  if(o)o.style.display='none';
  updateSVGZone(d.zone,true,d.carIdx);
  renderDamageList();
  // Upload immédiat en arrière-plan
  _autoUploadDamagePhoto(d);
}

async function _autoUploadDamagePhoto(d){
  if(!d.photoDataUrl||d.photoUrl)return;  // déjà uploadé ou pas de photo
  const missionId=inspState.mission?.id;
  if(!missionId)return;
  try{
    const res=await fetch(d.photoDataUrl);
    const blob=await res.blob();
    const fname=`inspections/${missionId}/car${d.carIdx||0}_${d.zone}_${d.ts?new Date(d.ts).getTime():Date.now()}.jpg`;
    const{error}=await sb.storage.from('carrier-photos').upload(fname,blob,{contentType:'image/jpeg',upsert:true});
    if(!error){
      const{data:urlData}=sb.storage.from('carrier-photos').getPublicUrl(fname);
      d.photoUrl=urlData?.publicUrl||null;  // stocké sur l'objet damage pour réutilisation au submit
      console.log('[AutoSave] photo uploadée:',d.photoUrl);
    }
  }catch(e){console.warn('[AutoSave] photo upload failed:',e.message);}
}

async function watermarkPhoto(file,ts,lat,lng,zoneLabel){
  return new Promise(resolve=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      const canvas=document.createElement('canvas');
      // Limiter à max 1600px pour économiser la mémoire
      const maxW=1600;
      const scale=img.width>maxW?maxW/img.width:1;
      canvas.width=img.width*scale;
      canvas.height=img.height*scale;
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,canvas.width,canvas.height);

      // Barre de watermark en bas
      const barH=Math.round(canvas.height*0.09);
      ctx.fillStyle='rgba(0,0,0,0.62)';
      ctx.fillRect(0,canvas.height-barH,canvas.width,barH);

      const fs=Math.max(12,Math.round(barH*0.28));
      ctx.fillStyle='white';
      ctx.font=`bold ${fs}px Arial`;
      const dateStr=ts.toLocaleString('fr-BE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});
      const gpsStr=lat!=null?`📍 ${lat.toFixed(5)}, ${lng.toFixed(5)}`:'📍 GPS non disponible';
      ctx.fillText(`📅 ${dateStr}`,10,canvas.height-barH+fs+4);
      ctx.fillText(gpsStr,10,canvas.height-barH+fs*2+8);
      ctx.fillText(`🔍 Zone : ${zoneLabel}`,10,canvas.height-barH+fs*3+12);

      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg',0.82));
    };
    img.src=url;
  });
}

function updateSVGZone(zoneId,hasDamage,carIdx){
  const el=document.querySelector(`.car-svg-zone[data-zone="${zoneId}"]`);
  if(!el)return;
  // N'actualiser la zone que si c'est pour la voiture affichée
  const ci=(carIdx!==undefined)?carIdx:_currentCarIdx;
  if(ci!==_currentCarIdx)return;
  if(hasDamage){
    el.classList.add('has-damage');
    el.setAttribute('fill','#ffd066');
  } else {
    el.classList.remove('has-damage');
    el.removeAttribute('fill');
  }
}

function renderDamageList(){
  const el=document.getElementById('insp-damages-list');
  if(!el)return;
  if(!inspState.damages.length){el.innerHTML='';return;}

  // Grouper par carIdx
  const m=inspState.mission;
  const carGroups={};
  inspState.damages.forEach((d,i)=>{
    const key=d.carIdx!==undefined?d.carIdx:0;
    if(!carGroups[key])carGroups[key]=[];
    carGroups[key].push({d,i});
  });

  const multiCar=m&&m.cars&&m.cars.length>1;
  let html='';
  Object.keys(carGroups).sort((a,b)=>a-b).forEach(ci=>{
    const items=carGroups[ci];
    const carLabel=multiCar&&m.cars[ci]?`${m.cars[ci].make||''} ${m.cars[ci].model||''}`.trim()||`Voiture ${Number(ci)+1}`:'';
    html+=`<div class="insp-card">`;
    if(multiCar){html+=`<div style="font-size:11px;font-weight:700;color:#2675a9;text-transform:uppercase;margin-bottom:8px;letter-spacing:.5px">🚗 ${esc(carLabel)} — ${items.length} dommage${items.length>1?'s':''}</div>`;}
    else{html+=`<div style="font-size:12px;font-weight:700;color:#6b7a8d;text-transform:uppercase;margin-bottom:10px">📋 Dommages constatés (${items.length})</div>`;}
    html+=items.map(({d,i})=>`
    <div class="damage-item" style="margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid #f0f0f0">
      <div style="display:flex;align-items:flex-start;gap:10px">
        <img src="${d.photoDataUrl}" style="width:80px;height:60px;object-fit:cover;border-radius:6px;flex-shrink:0;cursor:pointer" onclick="this.style.width=this.style.width==='100%'?'80px':'100%'">
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:13px;color:#1a2e4a;margin-bottom:2px">${esc(d.zoneLabel)}</div>
          <div style="font-size:10px;color:#6b7a8d;margin-bottom:6px">${new Date(d.ts).toLocaleString('fr-BE')}</div>
          <div style="background:#f8f9fa;border-radius:6px;padding:8px 10px;font-size:12px;color:#1a2e4a;line-height:1.4">${esc(d.description)}</div>
        </div>
        <button onclick="removeDamage(${i})" style="color:#e53e3e;background:none;border:none;font-size:18px;cursor:pointer;flex-shrink:0;padding:2px 0 0">🗑</button>
      </div>
    </div>`).join('');
    html+=`</div>`;
  });
  el.innerHTML=html;
}

function removeDamage(i){
  const dmg=inspState.damages[i];
  if(!dmg)return;
  const zone=dmg.zone;
  const carIdx=dmg.carIdx!==undefined?dmg.carIdx:0;
  inspState.damages.splice(i,1);
  // Retirer la couleur SVG si plus de dommage sur cette zone pour cette voiture
  const stillHas=inspState.damages.some(d=>d.zone===zone&&(d.carIdx!==undefined?d.carIdx:0)===carIdx);
  if(!stillHas)updateSVGZone(zone,false,carIdx);
  renderDamageList();
}

function _initOneSigCanvas(canvasId, onSave){
  const canvas=document.getElementById(canvasId);
  if(!canvas)return null;
  const rect=canvas.getBoundingClientRect();
  canvas.width=rect.width||340;canvas.height=140;
  const ctx=canvas.getContext('2d');
  ctx.strokeStyle='#1a2e4a';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';
  let drawing=false;
  const getPos=e=>{const r=canvas.getBoundingClientRect();const src=e.touches?e.touches[0]:e;return{x:(src.clientX-r.left)*(canvas.width/r.width),y:(src.clientY-r.top)*(canvas.height/r.height)};};
  canvas.addEventListener('mousedown',e=>{drawing=true;const p=getPos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);});
  canvas.addEventListener('mousemove',e=>{if(!drawing)return;const p=getPos(e);ctx.lineTo(p.x,p.y);ctx.stroke();});
  canvas.addEventListener('mouseup',()=>{drawing=false;onSave(canvas.toDataURL());});
  canvas.addEventListener('touchstart',e=>{e.preventDefault();drawing=true;const p=getPos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);},{passive:false});
  canvas.addEventListener('touchmove',e=>{e.preventDefault();if(!drawing)return;const p=getPos(e);ctx.lineTo(p.x,p.y);ctx.stroke();},{passive:false});
  canvas.addEventListener('touchend',e=>{e.preventDefault();drawing=false;onSave(canvas.toDataURL());},{passive:false});
  return canvas;
}

function initInspSignaturePad(){

async function submitInspection(){
  const m=inspState.mission;
  const clientName=document.getElementById('insp-client-name')?.value?.trim();
  const driverName=document.getElementById('insp-driver-name')?.value?.trim();
  if(!clientName){alert('Veuillez indiquer le nom et prénom du client (réceptionnaire).');return;}
  if(!driverName){alert('Veuillez indiquer le nom et prénom du chauffeur.');return;}
  if(!inspState.sigClientDataUrl){alert('La signature du client est requise.');return;}
  if(!inspState.sigDriverDataUrl){alert('La signature du chauffeur est requise.');return;}

  const btn=document.getElementById('insp-submit-btn');
  if(btn){btn.disabled=true;btn.textContent='⏳ Envoi en cours…';}

  try{
    const missionId=m.id;
    const car=(m.cars||[])[inspState.carIdx||0];   // une inspection = un véhicule
    const carId=car?car.id:null;
    const ts=new Date().toISOString();

    // Accessoires + commentaires
    const keysReceived=document.getElementById('insp-keys')?.value||null;
    const manuelChecked=document.getElementById('insp-manuel')?.checked||false;
    const kitChecked=document.getElementById('insp-kit')?.checked||false;
    const cableChecked=document.getElementById('insp-cable')?.checked||false;
    const comments=document.getElementById('insp-comments')?.value?.trim()||null;

    // 1. Upload chaque photo + insérer dans delivery_inspections
    for(const d of inspState.damages){
      // Utiliser l'URL déjà uploadée en arrière-plan si disponible
      let photoUrl=d.photoUrl||null;
      if(!photoUrl&&d.photoDataUrl){
        // Fallback : upload maintenant si l'auto-save n'a pas encore terminé
        const res=await fetch(d.photoDataUrl);
        const blob=await res.blob();
        const fname=`inspections/${missionId}/car${d.carIdx||0}_${d.zone}_${Date.now()}.jpg`;
        const{error:upErr}=await sb.storage.from('carrier-photos').upload(fname,blob,{contentType:'image/jpeg',upsert:true});
        if(!upErr){
          const{data:urlData}=sb.storage.from('carrier-photos').getPublicUrl(fname);
          photoUrl=urlData?.publicUrl||null;
        }
      }
      await sb.from('delivery_inspections').insert({
        mission_id:missionId,
        car_id:d.carId||null,
        zone:d.zone,
        description:d.description||null,
        photo_url:photoUrl,
        lat:d.lat||null,
        lng:d.lng||null,
        created_at:d.ts,
      });
    }

    // 2. Upload signature client
    let sigClientUrl=null;
    {
      const res=await fetch(inspState.sigClientDataUrl);
      const blob=await res.blob();
      const fname=`inspections/${missionId}/sig_client_${carId||'x'}_${Date.now()}.png`;
      const{error:sigErr}=await sb.storage.from('carrier-photos').upload(fname,blob,{contentType:'image/png',upsert:true});
      if(!sigErr){const{data:u}=sb.storage.from('carrier-photos').getPublicUrl(fname);sigClientUrl=u?.publicUrl||null;}
    }

    // 2b. Upload signature chauffeur
    let sigDriverUrl=null;
    {
      const res=await fetch(inspState.sigDriverDataUrl);
      const blob=await res.blob();
      const fname=`inspections/${missionId}/sig_driver_${carId||'x'}_${Date.now()}.png`;
      const{error:sigErr}=await sb.storage.from('carrier-photos').upload(fname,blob,{contentType:'image/png',upsert:true});
      if(!sigErr){const{data:u}=sb.storage.from('carrier-photos').getPublicUrl(fname);sigDriverUrl=u?.publicUrl||null;}
    }

    // 3. Mettre à jour la mission — inspection_signer encodé en JSON pour rétrocompat
    const signerPayload=JSON.stringify({
      clientName,driverName,
      keysReceived,manuelChecked,kitChecked,cableChecked,
      comments,
    });
    // Via la fonction serveur finalize_inspection : le visiteur du lien (anon) n'a pas le droit
    // de modifier directement la table missions (RLS), l'update direct échouait silencieusement.
    {
      const{data:finOk,error:finErr}=await sb.rpc('finalize_inspection',{
        p_token:m.delivery_token||INSPECTION_TOKEN,
        p_car_id:carId,
        p_signer:signerPayload,
        p_signature_url:sigClientUrl,
      });
      if(finErr||finOk===false)console.warn('[submitInspection] finalize_inspection:',finErr?finErr.message:'non enregistrée (déjà soumise ?)');
    }

    // 4. Générer le PDF
    const accessories={keysReceived,manuelChecked,kitChecked,cableChecked,keysDeclared:m.keys||null,comments};
    const pdfDataUrl=await generateInspectionPDF({...m,cars:car?[car]:(m.cars||[])},{clientName,driverName},ts,{sigClientUrl,sigDriverUrl},accessories);

    // 4b. Upload du PDF
    let inspectionPdfUrl=null;
    try{
      const pdfRes=await fetch(pdfDataUrl);
      const pdfBlob=await pdfRes.blob();
      const pdfFname=`inspections/${missionId}/rapport_${carId||'x'}_${Date.now()}.pdf`;
      const{error:pdfUpErr}=await sb.storage.from('carrier-photos').upload(pdfFname,pdfBlob,{contentType:'application/pdf',upsert:true});
      if(!pdfUpErr){
        const{data:pdfUrlData}=sb.storage.from('carrier-photos').getPublicUrl(pdfFname);
        inspectionPdfUrl=pdfUrlData?.publicUrl||null;
        const{error:attErr}=await sb.rpc('attach_inspection_pdf',{p_token:m.delivery_token||INSPECTION_TOKEN,p_car_id:carId,p_pdf_url:inspectionPdfUrl});
        if(attErr)console.warn('[submitInspection] attach_inspection_pdf:',attErr.message);
      }
    }catch(pdfErr){console.warn('[submitInspection] PDF upload:',pdfErr.message);}

    // Mémorise l'état de ce véhicule pour la liste (retour à l'accueil)
    if(car){car.inspection_submitted_at=ts;car.inspection_pdf_url=inspectionPdfUrl;car.inspection_signer=signerPayload;}
    const remaining=(m.cars||[]).filter(c=>!c.inspection_submitted_at).length;
    const carName=car?`${car.make||''} ${car.model||''}`.trim():'';
    const carTag=car?(car.plate||car.vin||'').replace(/\s/g,''):'';

    // 5. Page de confirmation
    const portal=document.getElementById('inspection-portal');
    portal.innerHTML=`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#f0f4f8">
      <div style="max-width:400px;text-align:center;background:white;border-radius:16px;padding:36px 28px;box-shadow:0 4px 24px rgba(0,0,0,.1)">
        <div style="font-size:54px;margin-bottom:14px">✅</div>
        <div style="font-size:20px;font-weight:800;color:#1a2e4a;margin-bottom:8px">Contrôle terminé ✅</div>
        <p style="color:#1a2e4a;font-size:14px;font-weight:600;margin-bottom:6px">Le contrôle véhicule est terminé et enregistré dans le système.</p>
        ${carName?`<p style="color:#1a2e4a;font-size:13px;margin-bottom:6px">🚗 <strong>${esc(carName)}</strong>${car&&car.vin?` — VIN ${esc(car.vin)}`:''}</p>`:''}
        <p style="color:#6b7a8d;font-size:13px;margin-bottom:16px">Signé par <strong>${esc(clientName)}</strong> (client) et <strong>${esc(driverName)}</strong> (chauffeur)<br>le ${new Date(ts).toLocaleDateString('fr-BE')} à ${new Date(ts).toLocaleTimeString('fr-BE',{hour:'2-digit',minute:'2-digit'})}.</p>
        ${inspState.damages.length?`<p style="font-size:13px;color:#e57c00;margin-bottom:16px">📋 ${inspState.damages.length} dommage(s) signalé(s) et enregistré(s)</p>`:`<p style="font-size:13px;color:#38a169;margin-bottom:16px">✔ Aucun dommage constaté</p>`}
        <a href="${pdfDataUrl}" download="etat_des_lieux_${(m.ref||'inspection').replace(/\s/g,'_')}${carTag?'_'+carTag:''}.pdf"
          style="display:block;background:var(--navy);color:white;border-radius:10px;padding:14px;font-size:15px;font-weight:700;text-decoration:none;margin-bottom:12px">
          📄 Télécharger le PDF
        </a>
        ${remaining
          ?`<button onclick="inspShowHome()" style="width:100%;background:white;color:#102d4c;border:2px solid #102d4c;border-radius:10px;padding:13px;font-size:15px;font-weight:700;cursor:pointer">Inspecter le véhicule suivant (${remaining} restant${remaining>1?'s':''}) →</button>`
          :`<p style="font-size:13px;color:#38a169;font-weight:700;margin:0">✔ Tous les véhicules de la mission ont été inspectés.</p>`}
      </div></div>`;
  }catch(e){
    console.error(e);
    if(btn){btn.disabled=false;btn.textContent='✅ Soumettre l\'état des lieux';}
    alert('Erreur lors de la soumission : '+e.message);
  }
}

async function generateInspectionPDF(m,signers,ts,sigUrls,accessories){
  // signers = {clientName, driverName}
  // sigUrls = {sigClientUrl, sigDriverUrl}
  // accessories = {keysReceived, manuelChecked, kitChecked, keysDeclared}
  const{jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
  const W=210,margin=14;
  let y=margin;

  const section=(title)=>{
    if(y>252){doc.addPage();y=margin;}
    doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(26,46,74);
    doc.text(title,margin,y);y+=5;
    doc.setDrawColor(220,224,230);doc.line(margin,y,W-margin,y);y+=4;
    doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(50,50,50);
  };

  // ── Header ──
  doc.setFillColor(26,46,74);doc.rect(0,0,W,28,'F');
  doc.setTextColor(255,255,255);doc.setFontSize(15);doc.setFont('helvetica','bold');
  doc.text('ÉTAT DES LIEUX DE LIVRAISON',W/2,11,{align:'center'});
  doc.setFontSize(9);doc.setFont('helvetica','normal');
  doc.text('AutoDispatch — Rapport généré automatiquement',W/2,18,{align:'center'});
  doc.setFontSize(8);doc.text(new Date(ts).toLocaleString('fr-BE'),W/2,24,{align:'center'});
  y=36;

  // ── Infos mission ──
  section('INFORMATIONS DE LA MISSION');
  const infoLines=[
    ['Référence mission',m.ref||'—'],
    ['Lieu de livraison',`${m.delivery_site||''} ${m.delivery_city||''} ${m.delivery_country||''}`.trim()||'—'],
    ['Date de livraison',m.delivery_date?new Date(m.delivery_date).toLocaleDateString('fr-BE'):'—'],
    ['Client (réceptionnaire)',signers.clientName||'—'],
    ['Chauffeur',signers.driverName||'—'],
    ['Date & heure',new Date(ts).toLocaleString('fr-BE')],
  ];
  for(const[k,v]of infoLines){
    doc.setFont('helvetica','bold');doc.text(k+' :',margin,y);
    doc.setFont('helvetica','normal');doc.text(String(v),margin+54,y);
    y+=5;
  }
  y+=4;

  // ── Véhicules ──
  section('VÉHICULE(S)');
  (m.cars||[]).forEach(c=>{
    doc.text(`• ${c.make} ${c.model}${c.vin?' — VIN: '+c.vin:''}${c.plate?' — Plaque: '+c.plate:''}`,margin,y);
    y+=5;
  });
  if(!m.cars||!m.cars.length){doc.text('—',margin,y);y+=5;}
  y+=4;

  // ── Accessoires ──
  if(accessories){
    section('ACCESSOIRES REMIS');
    const keysTxt=accessories.keysReceived?`${accessories.keysReceived} clef(s) reçue(s)`:'Non renseigné';
    const keysDeclTxt=accessories.keysDeclared?` (déclaré au chargement : ${accessories.keysDeclared})`:'';
    const mismatch=accessories.keysReceived&&accessories.keysDeclared&&accessories.keysReceived!==accessories.keysDeclared;
    doc.setFont('helvetica','bold');doc.text('Clefs :',margin,y);
    doc.setFont('helvetica','normal');
    if(mismatch){doc.setTextColor(180,60,0);}
    doc.text(keysTxt+keysDeclTxt+(mismatch?' ⚠ ÉCART':''),margin+28,y);
    doc.setTextColor(50,50,50);y+=5;
    doc.setFont('helvetica','bold');doc.text('Manuel d\'utilisation :',margin,y);
    doc.setFont('helvetica','normal');doc.text(accessories.manuelChecked?'✔ Remis':'✘ Non remis / non vérifié',margin+52,y);y+=5;
    doc.setFont('helvetica','bold');doc.text('Kit réparation / Roue de secours :',margin,y);
    doc.setFont('helvetica','normal');doc.text(accessories.kitChecked?'✔ Présent':'✘ Absent / non vérifié',margin+74,y);y+=5;
    doc.setFont('helvetica','bold');doc.text('Câble de recharge (VE) :',margin,y);
    doc.setFont('helvetica','normal');doc.text(accessories.cableChecked?'✔ Remis':'— Non applicable / non remis',margin+54,y);y+=5;
    if(accessories.comments){
      if(y>252){doc.addPage();y=margin;}
      doc.setFont('helvetica','bold');doc.text('Commentaires :',margin,y);y+=5;
      doc.setFont('helvetica','normal');
      const commentLines=doc.splitTextToSize(accessories.comments,W-margin*2);
      doc.text(commentLines,margin,y);y+=commentLines.length*4.5;
    }
    y+=4;
  }

  // ── Dommages ──
  section('DOMMAGES CONSTATÉS');
  if(!inspState.damages.length){
    doc.setFont('helvetica','italic');doc.setFontSize(9);doc.setTextColor(80,80,80);
    doc.text('Aucun dommage signalé — véhicule(s) réceptionné(s) en bon état.',margin,y);y+=8;
  } else {
    for(let i=0;i<inspState.damages.length;i++){
      const d=inspState.damages[i];
      if(y>240){doc.addPage();y=margin;}
      const hasImg=!!(d.photoDataUrl||d.photoUrl);
      doc.setFillColor(240,244,248);doc.roundedRect(margin,y-2,W-margin*2,hasImg?46:20,3,3,'F');
      doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(26,46,74);
      doc.text(`${i+1}. ${d.zoneLabel}`,margin+3,y+4);
      doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(80,80,80);
      doc.text(new Date(d.ts).toLocaleString('fr-BE'),margin+3,y+9);
      if(d.lat!=null)doc.text(`GPS: ${d.lat.toFixed(5)}, ${d.lng.toFixed(5)}`,margin+3,y+14);
      if(d.description)doc.text(doc.splitTextToSize('Desc: '+d.description,W-margin*2-60),margin+3,y+(d.lat!=null?19:14));
      if(hasImg){
        // Préférer le Data URL (déjà en mémoire) sinon charger depuis Supabase
        let imgSrc=d.photoDataUrl||null;
        if(!imgSrc&&d.photoUrl){
          try{
            const r=await fetch(d.photoUrl);const b=await r.blob();
            imgSrc=await new Promise(res=>{const fr=new FileReader();fr.onload=e=>res(e.target.result);fr.readAsDataURL(b);});
          }catch(_){}
        }
        if(imgSrc){try{doc.addImage(imgSrc,'JPEG',W-margin-44,y-1,44,40);}catch(e){console.warn('Image PDF',e);}}
        y+=48;
      } else {y+=24;}
    }
  }
  y+=4;

  // ── Signatures (deux blocs côte à côte) ──
  if(y>220){doc.addPage();y=margin;}
  section('SIGNATURES');
  const colW=(W-margin*2-10)/2;
  // Bloc client
  doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(26,46,74);
  doc.text('CLIENT (RÉCEPTIONNAIRE)',margin,y);
  doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(50,50,50);
  doc.text(signers.clientName||'—',margin,y+5);
  if(inspState.sigClientDataUrl){
    try{doc.addImage(inspState.sigClientDataUrl,'PNG',margin,y+8,colW,24);}catch(e){}
  }
  // Bloc chauffeur
  const col2x=margin+colW+10;
  doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(26,46,74);
  doc.text('CHAUFFEUR',col2x,y);
  doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(50,50,50);
  doc.text(signers.driverName||'—',col2x,y+5);
  if(inspState.sigDriverDataUrl){
    try{doc.addImage(inspState.sigDriverDataUrl,'PNG',col2x,y+8,colW,24);}catch(e){}
  }
  y+=36;
  doc.setFontSize(8);doc.setTextColor(100,100,100);
  doc.text(`Lu et approuvé — ${new Date(ts).toLocaleString('fr-BE')}`,margin,y);y+=8;

  // ── Footer ──
  const pages=doc.getNumberOfPages();
  for(let p=1;p<=pages;p++){
    doc.setPage(p);
    doc.setFontSize(7);doc.setTextColor(160,160,160);
    doc.text(`AutoDispatch — État des lieux ${m.ref||''} — Page ${p}/${pages}`,W/2,292,{align:'center'});
  }

  return doc.output('datauristring');
}

// ══════════════════════════════════════════════════════════════════
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});


checkAuth();
</script>
