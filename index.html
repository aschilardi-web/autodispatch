/* ── TOAST NOTIFICATIONS ── */
#toast-container{position:fixed;bottom:22px;right:22px;z-index:900;display:flex;flex-direction:column-reverse;gap:10px;pointer-events:none}
.toast{background:white;border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:10px;padding:14px 38px 14px 14px;box-shadow:0 8px 28px #102d4c1f;min-width:270px;max-width:360px;pointer-events:all;display:flex;gap:11px;align-items:flex-start;animation:toast-in .22s ease;position:relative}
@keyframes toast-in{from{transform:translateX(115%);opacity:0}to{transform:none;opacity:1}}
.toast.out{animation:toast-out .28s ease forwards}
@keyframes toast-out{to{transform:translateX(115%);opacity:0}}
.toast.success{border-left-color:var(--green)}
.toast.warning{border-left-color:var(--amber)}
.toast-icon{font-size:19px;line-height:1;flex-shrink:0;margin-top:1px}
.toast-body{flex:1;min-width:0}
.toast-title{font-weight:800;font-size:12px;color:var(--navy)}
.toast-msg{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.4}
.toast-action{display:inline-block;margin-top:7px;background:var(--pale);color:var(--blue);border:none;padding:4px 9px;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer}
.toast-close{position:absolute;top:7px;right:9px;border:none;background:none;color:#aab6c2;font-size:17px;cursor:pointer;line-height:1}
.notif-bell{position:relative;display:inline-flex}
.notif-badge{position:absolute;top:-5px;right:-6px;background:#e8534a;color:white;font-size:9px;font-weight:800;border-radius:10px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 3px}
/* ── PORTAIL TRANSPORTEUR ── */
.portal-wrap{min-height:100vh;background:#f0f4f8;padding:0 0 60px}
.portal-header{background:var(--navy);color:white;padding:20px 16px 24px;position:sticky;top:0;z-index:5}
.portal-header .brand{font-size:18px;font-weight:800;padding:0 0 14px;letter-spacing:-.3px}
.portal-header .brand span{color:#98c9e9;font-weight:400}
.portal-body{max-width:600px;margin:0 auto;padding:16px}
.portal-mission-bar{background:white;border:1px solid var(--line);border-radius:10px;padding:15px;margin-bottom:16px}
.portal-car{background:white;border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.portal-car-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.portal-section{border:1px solid var(--line);border-radius:8px;padding:13px;margin-top:10px}
.portal-section.done{border-color:#c3e6cb;background:#f0fbf4}
.portal-section.locked{opacity:.55;pointer-events:none}
.portal-section-label{font-size:10px;font-weight:800;letter-spacing:1px;color:var(--muted);margin-bottom:10px}
.portal-section.done .portal-section-label{color:var(--green)}
.portal-photos{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.portal-photos img{width:80px;height:62px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:pointer}
.portal-upload-btn{display:block;width:100%;background:var(--blue);color:white;text-align:center;padding:13px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;border:none;margin-top:6px}
.portal-confirm-btn{width:100%;background:var(--green);color:white;border:none;padding:13px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;margin-top:8px}
.portal-add-photo{display:block;border:2px dashed #c3e6cb;color:var(--green);text-align:center;padding:9px;border-radius:7px;margin-top:8px;font-size:12px;cursor:pointer;background:none;width:100%}
.portal-confirm-btn:disabled{background:#9eb8a0;cursor:not-allowed}

async function checkAuth(){
  // Portail transporteur : pas de login requis
  if(CARRIER_TOKEN){
    await initCarrierPortal();
    return;
  }
  setLoading(true);
  const {data:{session}}=await sb.auth.getSession();
  setLoading(false);
  if(session){currentUser=session.user;await initApp();}
  else{document.getElementById('auth-screen').style.display='flex';}
}

async function login(){
  const email=document.getElementById('login-email').value.trim();
  const pwd=document.getElementById('login-pwd').value;
  const err=document.getElementById('login-err');
  err.textContent='';
  if(!email||!pwd){err.textContent='Complète les deux champs.';return;}
  setLoading(true);
  try{
    const ping=await fetch(SUPABASE_URL+'/auth/v1/health',{headers:{'apikey':SUPABASE_ANON}}).catch(e=>({ok:false,_err:e}));
    if(!ping.ok&&ping._err){
      setLoading(false);
      err.textContent='Réseau bloqué: '+ping._err.message+' — vérifiez que le site n\'est pas bloqué par un antivirus ou VPN.';
      return;
    }
    const {data,error}=await sb.auth.signInWithPassword({email,password:pwd});
    setLoading(false);
    if(error){err.textContent='Erreur auth: '+error.message+(error.status?' ('+error.status+')':(error.code?' ('+error.code+')':''));return;}
    currentUser=data.user;
    await initApp();
  }catch(e){
    setLoading(false);
    err.textContent='Exception: '+e.name+': '+e.message;
  }
}

async function logout(){
  await sb.auth.signOut();
  currentUser=null;
  db={clients:[],carriers:[],missions:[],selectedIds:[],sort:'ref',direction:1};
  document.getElementById('app-shell').style.display='none';
  document.getElementById('auth-screen').style.display='flex';
  document.getElementById('login-err').textContent='';
}

async function initApp(){
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('app-shell').style.display='flex';
  document.getElementById('user-info').textContent=currentUser?.email||'';
  await loadData();
  boot();

}

function mapPartner(x){
  return{id:x.id,name:x.name||'',contact:x.contact||'',email:x.email||'',
    billingEmail:x.billing_email||'',vat:x.vat||'',phone:x.phone||'',
    street:x.street||'',postal:x.postal||'',city:x.city||'',country:x.country||''};
}

async function loadData(){
  setLoading(true);
  try{
    const[r1,r2,r3,r4,r5,r6]=await Promise.all([
      sb.from('clients').select('*').order('name'),
      sb.from('carriers').select('*').order('name'),
      sb.from('missions').select('*').order('created_at'),
      sb.from('cars').select('*'),
      sb.from('notifications').select('*').order('created_at'),
      sb.from('documents').select('*')
    ]);
    db.clients=(r1.data||[]).map(mapPartner);
    db.carriers=(r2.data||[]).map(mapPartner);
    // carrier_events : table optionnelle (créée par le SQL portail)
    try{const r7=await sb.from('carrier_events').select('*').order('confirmed_at');db.carrierEvents=r7.data||[];}
    catch(e){console.warn('carrier_events non disponible:',e.message);db.carrierEvents=[];};
    const cars=r4.data||[],notifs=r5.data||[],docs=r6.data||[];
    db.missions=(r3.data||[]).map(m=>({
      id:m.id,ref:m.ref||'',
      clientId:m.client_id||'',carrierId:m.carrier_id||'',
      carrierToken:m.carrier_token||'',
      pickupSite:m.pickup_site||'',pickupStreet:m.pickup_street||'',
      pickupPostal:m.pickup_postal||'',pickupCity:m.pickup_city||'',
      pickupCountry:m.pickup_country||'',pickupContact:m.pickup_contact||'',
      deliverySite:m.delivery_site||'',deliveryStreet:m.delivery_street||'',
      deliveryPostal:m.delivery_postal||'',deliveryCity:m.delivery_city||'',
      deliveryCountry:m.delivery_country||'',deliveryContact:m.delivery_contact||'',
      pickupDate:m.pickup_date||'',deliveryDate:m.delivery_date||'',
      status:m.status||'à planifier',
      cars:cars.filter(c=>c.mission_id===m.id).map(c=>({
        id:c.id,make:c.make||'',model:c.model||'',vin:c.vin||'',plate:c.plate||'',
        status:c.status||'à charger',
        docs:docs.filter(d=>d.car_id===c.id).map(d=>({id:d.id,name:d.name||'',phase:d.phase||'',date:d.date||'',url:d.url||''}))
      })),
      notifications:notifs.filter(n=>n.mission_id===m.id).map(n=>({
        id:n.id,kind:n.kind||'',status:n.status||'pending',
        pickupDate:n.pickup_date||'',deliveryDate:n.delivery_date||'',createdAt:n.created_at
      }))
    }));
  }catch(e){console.error(e);alert('Erreur de chargement : '+e.message);}
  setLoading(false);
}

let _realtimeChannel=null,_notifCount=0;

function showToast(title,msg,type,missionId){
  const c=document.getElementById('toast-container');if(!c)return;
  const id='t'+Date.now()+Math.random().toString(36).slice(2,6);
  const icons={success:title.includes('Livraison')?'✅':'🚛',info:'📷',warning:'⚠️',cmr:'📄'};
  const icon=type==='cmr'?icons.cmr:(type==='success'?icons.success:icons.info);
  const div=document.createElement('div');
  div.className='toast '+(type==='cmr'?'info':type||'info');
  div.id=id;
  div.innerHTML=`<div class="toast-icon">${icon}</div>
    <div class="toast-body">
      <div class="toast-title">${title}</div>
      <div class="toast-msg">${msg}</div>
      ${missionId?`<button class="toast-action" onclick="openDetail('${missionId}');dismissToast('${id}')">Voir la mission →</button>`:''}
    </div>
    <button class="toast-close" onclick="dismissToast('${id}')">×</button>`;
  c.appendChild(div);
  _notifCount++;_updateNotifBell();
  setTimeout(()=>dismissToast(id),12000);
}

function dismissToast(id){
  const el=document.getElementById(id);if(!el)return;
  el.classList.add('out');
  setTimeout(()=>{el.remove();_notifCount=Math.max(0,_notifCount-1);_updateNotifBell();},300);
}

function _updateNotifBell(){
  const btn=document.getElementById('notif-btn');
  const badge=document.getElementById('notif-badge');
  if(!btn||!badge)return;
  if(_notifCount>0){btn.style.display='';badge.textContent=_notifCount;}
  else{btn.style.display='none';}
}

function clearNotifBadge(){
  _notifCount=0;_updateNotifBell();
  document.querySelectorAll('.toast').forEach(t=>dismissToast(t.id));
}

function handleCarrierEvent(ev){
  if(!ev)return;
  // Met à jour le cache local
  if(!db.carrierEvents.find(e=>e.id===ev.id))db.carrierEvents.push(ev);
  // Retrouve mission + véhicule dans l'état local
  const m=db.missions.find(x=>x.id===ev.mission_id);
  const car=m?.cars?.find(x=>x.id===ev.car_id);
  const mRef=m?m.ref:(ev.mission_id||'').slice(0,8)+'…';
  const vLabel=car?`${car.make} ${car.model}`:'Véhicule';
  const phase=ev.event_type==='loading'||ev.event_type==='confirmed_loading'?'Chargement':'Livraison';

  let title,msg,type;
  if(ev.event_type==='confirmed_loading'){
    title='🚛 Chargement confirmé';
    msg=`${mRef} — ${vLabel}`;type='success';
    if(car)car.status='chargé';
  } else if(ev.event_type==='confirmed_delivery'){
    title='✅ Livraison confirmée';
    msg=`${mRef} — ${vLabel}`;type='success';
    if(car)car.status='livré';
  } else if(ev.notes&&(ev.notes.startsWith('cmr')||ev.notes==='cmr_loading'||ev.notes==='cmr_delivery')){
    title='📄 CMR reçu';
    msg=`${mRef} — ${vLabel} — ${phase}`;type='cmr';
  } else {
    title='📷 Photo reçue';
    msg=`${mRef} — ${vLabel} — ${phase}`;type='info';
  }

  showToast(title,msg,type,ev.mission_id);
  // Rafraîchit le panneau détail si la mission est ouverte
  if(detailId===ev.mission_id){try{refreshDetail();}catch(_){}}
}

function realtimeSetup(){
  if(_realtimeChannel){try{_realtimeChannel.unsubscribe();}catch(_){}}
  _realtimeChannel=sb.channel('carrier-events-admin-v1')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'carrier_events'},
      payload=>{ handleCarrierEvent(payload.new); }
    )
    .subscribe(status=>{
      if(status==='SUBSCRIBED')console.info('[Realtime] ✓ connecté — carrier_events');
      else if(status==='CHANNEL_ERROR')console.warn('[Realtime] ✗ erreur connexion — carrier_events');
    });
}

  <div class="recent-list">${db.missions.length?db.missions.slice().reverse().slice(0,6).map(m=>`<div class="recent-row"><strong>${esc(m.ref)}<small>${esc(getClient(m).name||'—')}</small></strong><span>${esc(m.pickupCity||'—')} → ${esc(m.deliveryCity||'—')}</span><span>Chargement ${pretty(m.pickupDate)}<small>Livraison ${pretty(m.deliveryDate)}</small></span>${badge(m.status)}</div>`).join(''):'<div class="empty">Aucune mission. Crée une mission pour commencer.</div>'}</div></div>
  <div class="panel"><div class="panel-title"><h2>Actions rapides</h2></div><div class="toolbar"><button class="btn soft" onclick="setView('Planning')">Ouvrir le planning</button><button class="btn soft" onclick="setView('Clients')">Gérer les clients</button><button class="btn soft" onclick="setView('Transporteurs')">Gérer les transporteurs</button></div></div>`;
}

function badge(s){return `<span class="badge ${s==='livré'||s==='chargé'||s==='payé'?'green':s==='en transport'?'blue':s==='à planifier'?'amber':''}">${esc(s)}</span>`}

function filterTool(){return `<div class="toolbar"><input type="search" placeholder="Rechercher client, mission, VIN, plaque…" value="${esc(search)}" oninput="search=this.value;render()"><select onchange="filterStatus=this.value;render()"><option>Tous les statuts</option>${['à planifier','attribué','à charger','en transport','livré','à facturer','facturé','payé'].map(x=>`<option ${filterStatus===x?'selected':''}>${x}</option>`).join('')}</select></div>`}

function filteredMissions(){
  return db.missions.filter(m=>{
    if(filterStatus!=='Tous les statuts'&&m.status!==filterStatus)return false;
    if(filterClient!=='Tous les clients'&&m.clientId!==filterClient)return false;
    if(filterCarrier!=='Tous les transporteurs'&&m.carrierId!==filterCarrier)return false;
    if(search&&!JSON.stringify([m,getClient(m),getCarrier(m)]).toLowerCase().includes(search.toLowerCase()))return false;
    return true;
  });
}

function tableRows(selectable=false,rows=filteredMissions()){
  let entries=rows.flatMap(m=>m.cars.map(c=>({m,c})));
  entries.sort((a,b)=>String(a.m[db.sort]||a.c[db.sort]||'').localeCompare(String(b.m[db.sort]||b.c[db.sort]||''),'fr',{numeric:true})*db.direction);
  return entries.map(({m,c})=>`<tr>${selectable?`<td class="check-cell"><input type="checkbox" ${db.selectedIds.includes(c.id)?'checked':''} onchange="toggleSelected('${esc(c.id)}',this.checked)"></td>`:''}<td><strong>${esc(m.ref)}</strong><small>${esc(getClient(m).name||'—')}</small></td><td><strong>${esc(c.make)} ${esc(c.model)}</strong><small>${esc(c.vin||'VIN à ajouter')}</small></td><td>${esc(c.plate||'—')}</td><td>${esc(m.pickupCity||'—')}</td><td>${esc(m.deliveryCity||'—')}</td><td>${pretty(m.pickupDate)}</td><td>${pretty(m.deliveryDate)}</td><td>${badge(c.status)}</td><td><button class="btn" onclick="openDetail('${esc(m.id)}')">Ouvrir</button></td></tr>`).join('')||`<tr><td colspan="10" class="empty">Aucun véhicule à afficher.</td></tr>`;
}

function dataTable(selectable=false){return `<div class="table-wrap"><table><thead><tr>${selectable?'<th class="check-cell">✓</th>':''}${[['ref','Mission / client'],['make','Véhicule / VIN'],['plate','Plaque'],['pickupCity','Ville chargement'],['deliveryCity','Ville déchargement'],['pickupDate','Date chargement'],['deliveryDate','Date livraison'],['status','Statut']].map(([k,l])=>`<th><button onclick="sortBy('${k}')">${l}　↕</button></th>`).join('')}<th></th></tr></thead><tbody>${tableRows(selectable)}</tbody></table></div>`}

function sortBy(k){if(db.sort===k)db.direction*=-1;else{db.sort=k;db.direction=1}render();}

function weekCalendar(){
  const today=new Date();today.setHours(0,0,0,0);
  const dow=today.getDay()||7;
  const monday=new Date(today);monday.setDate(today.getDate()-(dow-1)+(weekOffset*7));
  const days=Array.from({length:7},(_,i)=>{const d=new Date(monday);d.setDate(monday.getDate()+i);return d;});
  const sameDay=(d1,d2)=>d1.getFullYear()===d2.getFullYear()&&d1.getMonth()===d2.getMonth()&&d1.getDate()===d2.getDate();
  const fmt=(d)=>d.toLocaleDateString('fr-BE',{day:'numeric',month:'long',year:'numeric'});
  const fmtShort=(d)=>d.toLocaleDateString('fr-BE',{day:'numeric',month:'short'}).replace(/ /g,' ');
  const dayNames=['Lun.','Mar.','Mer.','Jeu.','Ven.','Sam.','Dim.'];
  const weekLabel=`Semaine du ${fmt(days[0])} au ${fmt(days[6])}`;

  const cols=days.map((d,i)=>{
    const loads=db.missions.filter(m=>{const p=m.pickupDate?new Date(m.pickupDate):null;return p&&sameDay(p,d);});
    const delivs=db.missions.filter(m=>{const v=m.deliveryDate?new Date(m.deliveryDate):null;return v&&sameDay(v,d);});
    const isToday=sameDay(d,today);
    const isWe=i>=5;
    const cards=[
      ...loads.map(m=>`<div onclick="openDetail('${esc(m.id)}')" style="border:1px solid #d0e6f8;border-left:3px solid #2675a9;border-radius:7px;padding:9px;margin-bottom:6px;cursor:pointer;background:white;transition:box-shadow .15s" onmouseenter="this.style.boxShadow='0 2px 8px #2675a920'" onmouseleave="this.style.boxShadow=''">
        <div style="display:flex;align-items:center;gap:5px;margin-bottom:3px"><span style="width:7px;height:7px;border-radius:50%;background:#2675a9;flex-shrink:0"></span><strong style="font-size:11px">${esc(m.ref)}</strong></div>
        <div style="font-size:10.5px;color:#536a7d">Chargement · ${m.cars.length} véh.</div>
        <div style="font-size:10.5px;color:#536a7d">${esc(m.pickupCity||'—')}${m.deliveryCity?' · '+esc(m.deliveryCity):''}</div>
        <div style="font-size:10px;color:#8094a6;margin-top:2px">${esc(getClient(m).name||'—')} · ${esc(getCarrier(m).name||'À attribuer')}</div>
      </div>`),
      ...delivs.map(m=>`<div onclick="openDetail('${esc(m.id)}')" style="border:1px solid #c3e6cb;border-left:3px solid #24784d;border-radius:7px;padding:9px;margin-bottom:6px;cursor:pointer;background:white;transition:box-shadow .15s" onmouseenter="this.style.boxShadow='0 2px 8px #24784d20'" onmouseleave="this.style.boxShadow=''">
        <div style="display:flex;align-items:center;gap:5px;margin-bottom:3px"><span style="width:7px;height:7px;border-radius:50%;background:#24784d;flex-shrink:0"></span><strong style="font-size:11px">${esc(m.ref)}</strong></div>
        <div style="font-size:10.5px;color:#536a7d">Livraison · ${m.cars.length} véh.</div>
        <div style="font-size:10.5px;color:#536a7d">${esc(m.deliveryCity||'—')}</div>
        <div style="font-size:10px;color:#8094a6;margin-top:2px">${esc(getClient(m).name||'—')} · ${esc(getCarrier(m).name||'À attribuer')}</div>
      </div>`)
    ];
    return `<div style="flex:1;min-width:110px;padding:0 8px;${i<6?'border-right:1px solid #e8eef4':''}${isWe?';background:#fafbfc':''}${isToday?';background:#f5f9ff':''}">
      <div style="font-size:11.5px;font-weight:700;color:${isToday?'#2675a9':'#60778b'};padding:0 0 9px;border-bottom:1px solid #edf1f4;margin-bottom:9px;white-space:nowrap">${dayNames[i]} ${fmtShort(d)}</div>
      ${cards.length?cards.join(''):'<span style="font-size:11px;color:#c4cdd5">Rien de prévu</span>'}
    </div>`;
  }).join('');

  return `<div style="background:white;border:1px solid var(--line);border-radius:9px;padding:18px;margin-bottom:18px">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;gap:10px">
      <div><div style="font-size:15px;font-weight:700">${weekLabel}</div>
        <div style="font-size:12px;color:var(--muted);margin-top:3px">Chargements et livraisons prévus · sélectionne une mission pour ouvrir sa fiche</div></div>
      <div style="display:flex;gap:6px;flex-shrink:0">
        <button class="btn" style="padding:7px 10px" onclick="weekOffset--;render()">‹</button>
        <button class="btn" style="padding:7px 11px;font-weight:700" onclick="weekOffset=0;render()">Cette semaine</button>
        <button class="btn" style="padding:7px 10px" onclick="weekOffset++;render()">›</button>
      </div>
    </div>
    <div style="display:flex;gap:4px;align-items:center;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid #eef1f4">
      <span style="width:9px;height:9px;border-radius:50%;background:#2675a9;display:inline-block"></span><span style="font-size:11px;margin-right:14px">Chargement</span>
      <span style="width:9px;height:9px;border-radius:50%;background:#24784d;display:inline-block"></span><span style="font-size:11px;margin-right:auto">Livraison</span>
      <span style="font-size:10px;color:var(--muted)">Les dates se modifient dans la fiche mission.</span>
    </div>
    <div style="display:flex;overflow-x:auto;margin:0 -8px;padding:0 0 4px">${cols}</div>
  </div>`;
}

function missionTableFull(selectable=false){
  const allMissions=filteredMissions();
  let entries=allMissions.flatMap(m=>m.cars.map(c=>({m,c})));
  // filtres par colonne
  const f=colF;
  entries=entries.filter(({m,c})=>{
    if(f.ref&&!`${m.ref} ${getClient(m).name||''}`.toLowerCase().includes(f.ref.toLowerCase()))return false;
    if(f.make&&!`${c.make} ${c.model}`.toLowerCase().includes(f.make.toLowerCase()))return false;
    if(f.vin&&!(c.vin||'').toLowerCase().includes(f.vin.toLowerCase()))return false;
    if(f.plate&&!(c.plate||'').toLowerCase().includes(f.plate.toLowerCase()))return false;
    if(f.pickupCity&&!(m.pickupCity||'').toLowerCase().includes(f.pickupCity.toLowerCase()))return false;
    if(f.deliveryCity&&!(m.deliveryCity||'').toLowerCase().includes(f.deliveryCity.toLowerCase()))return false;
    if(f.pickupDate&&!pretty(m.pickupDate).includes(f.pickupDate))return false;
    return true;
  });
  entries.sort((a,b)=>String(a.m[db.sort]||a.c[db.sort]||'').localeCompare(String(b.m[db.sort]||b.c[db.sort]||''),'fr',{numeric:true})*db.direction);
  const total=entries.length;
  const cols=[['ref','Mission / client'],['make','Véhicules'],['vin','VIN'],['plate','Plaque'],['pickupCity','Ville de chargement'],['deliveryCity','Ville de déchargement'],['pickupDate','Date de chargement']];
  const fPlaceholders={ref:'Mission / client',make:'Véhicule',vin:'VIN',plate:'Plaque',pickupCity:'Ville chargement',deliveryCity:'Ville déchargement',pickupDate:pretty(new Date().toISOString().split('T')[0])};
  const ck=(v)=>selectable?`<td class="check-cell">${v}</td>`:'';
  const thead=`<tr>${ck('<input type="checkbox" onchange="selectAll(this.checked)">')}${cols.map(([k,l])=>`<th><button onclick="sortBy('${k}')">${l}　↕</button></th>`).join('')}<th>Statut</th><th></th></tr>
  <tr style="background:#f2f5f8">${ck('')}${cols.map(([k])=>`<td style="padding:5px 8px"><input value="${esc(f[k]||'')}" placeholder="${esc(fPlaceholders[k]||'')}" style="width:100%;border:1px solid #d8e4ec;border-radius:5px;padding:5px 7px;font-size:11px;background:white;color:#20384e" oninput="colF['${k}']=this.value;render()"></td>`).join('')}<td></td><td></td></tr>`;
  const tbody=entries.map(({m,c})=>{
    const chk=selectable?`<td class="check-cell"><input type="checkbox" ${db.selectedIds.includes(c.id)?'checked':''} onchange="toggleSelected('${esc(c.id)}',this.checked)"></td>`:'';
    return `<tr>${chk}<td><strong>${esc(m.ref)}</strong><small>${esc(getClient(m).name||'—')}</small></td><td><strong>${esc(c.make)} ${esc(c.model)}</strong></td><td style="font-size:11px;color:#536a7d">${esc(c.vin||'—')}</td><td>${esc(c.plate||'—')}</td><td>${esc(m.pickupCity||'—')}</td><td>${esc(m.deliveryCity||'—')}</td><td>${pretty(m.pickupDate)}<small>${pretty(m.deliveryDate)}</small></td><td>${badge(m.status)}</td><td><button class="btn" onclick="openDetail('${esc(m.id)}')">Ouvrir</button></td></tr>`;
  }).join()||`<tr><td colspan="${selectable?10:9}" class="empty">Aucun véhicule.</td></tr>`;
  return {html:`<div class="table-wrap"><table><thead>${thead}</thead><tbody>${tbody}</tbody></table></div>`,total,missions:allMissions.length};
}

function advancedFilterBar(totalMissions,totalVehicles){
  const clientOpts=`<option>Tous les clients</option>${db.clients.map(x=>`<option value="${esc(x.id)}" ${filterClient===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}`;
  const carrierOpts=`<option>Tous les transporteurs</option>${db.carriers.map(x=>`<option value="${esc(x.id)}" ${filterCarrier===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}`;
  const statusOpts=['Tous les statuts','à planifier','attribué','à charger','en transport','livré','à facturer','facturé','payé'].map(x=>`<option ${filterStatus===x?'selected':''}>${x}</option>`).join('');
  return `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px">
    <span style="font-size:12px;color:var(--muted);margin-right:4px">Statut</span>
    <select style="border:1px solid #d8e4ec;border-radius:6px;padding:6px 9px;font-size:12px;background:#fff" onchange="filterStatus=this.value;render()">${statusOpts}</select>
    <span style="font-size:12px;color:var(--muted)">Client</span>
    <select style="border:1px solid #d8e4ec;border-radius:6px;padding:6px 9px;font-size:12px;background:#fff" onchange="filterClient=this.options[this.selectedIndex].text==='Tous les clients'?'Tous les clients':this.value;render()">${clientOpts}</select>
    <span style="font-size:12px;color:var(--muted)">Transporteur</span>
    <select style="border:1px solid #d8e4ec;border-radius:6px;padding:6px 9px;font-size:12px;background:#fff" onchange="filterCarrier=this.options[this.selectedIndex].text==='Tous les transporteurs'?'Tous les transporteurs':this.value;render()">${carrierOpts}</select>
    <span style="font-size:12px;color:var(--muted);margin-left:auto"><strong>${totalMissions}</strong> mission${totalMissions!==1?'s':''} · <strong>${totalVehicles}</strong> véhicule${totalVehicles!==1?'s':''}</span>
    ${Object.values(colF).some(v=>v)||filterStatus!=='Tous les statuts'||filterClient!=='Tous les clients'||filterCarrier!=='Tous les transporteurs'?`<button class="btn" style="font-size:11px;padding:5px 9px" onclick="filterStatus='Tous les statuts';filterClient='Tous les clients';filterCarrier='Tous les transporteurs';colF={ref:'',make:'',vin:'',plate:'',pickupCity:'',deliveryCity:'',pickupDate:''};render()">✕ Réinitialiser</button>`:''}
  </div>`;
}

function documentsPage(){
  // Documents manuels (importés via la fiche véhicule)
  const manualDocs=db.missions.flatMap(m=>m.cars.flatMap(c=>(c.docs||[]).map(d=>({
    missionRef:m.ref,clientName:getClient(m).name||'—',
    vehicleLabel:`${c.make} ${c.model}`,vin:c.vin||'',plate:c.plate||'',
    label:d.name,phase:d.phase,date:d.date,url:d.url||'',type:'doc',missionId:m.id
  }))));

  // Photos transporteur (depuis carrier_events)
  const carrierPhotos=(db.carrierEvents||[]).filter(e=>e.photo_url).map(e=>{
    const m=db.missions.find(x=>x.id===e.mission_id)||{ref:'—'};
    const car=db.missions.flatMap(x=>x.cars).find(c=>c.id===e.car_id)||{make:'',model:'',vin:'',plate:''};
    return{
      missionRef:m.ref,clientName:getClient(m).name||'—',
      vehicleLabel:`${car.make} ${car.model}`.trim()||'—',vin:car.vin||'',plate:car.plate||'',
      label:e.event_type==='loading'?'Photo chargement':'Photo livraison',
      phase:e.event_type==='loading'?'chargement':'livraison',
      date:e.confirmed_at?new Date(e.confirmed_at).toLocaleDateString('fr-BE'):'—',
      url:e.photo_url,type:'photo',missionId:m.id
    };
  });

  const all=[...manualDocs,...carrierPhotos].sort((a,b)=>a.missionRef.localeCompare(b.missionRef,'fr'));

  const photoCount=carrierPhotos.length;
  const docCount=manualDocs.length;

  return heading('Documents',`${all.length} document(s) — ${docCount} importé(s), ${photoCount} photo(s) transporteur.`)+
  `<div class="panel">
    <div class="toolbar">
      <input type="search" placeholder="Rechercher mission, véhicule, VIN…" oninput="docSearch=this.value;render()" value="${esc(typeof docSearch!=='undefined'?docSearch:'')}">
      <select onchange="docFilter=this.value;render()">
        <option value="">Tous les types</option>
        <option value="chargement" ${typeof docFilter!=='undefined'&&docFilter==='chargement'?'selected':''}>Chargement</option>
        <option value="livraison" ${typeof docFilter!=='undefined'&&docFilter==='livraison'?'selected':''}>Livraison</option>
        <option value="doc" ${typeof docFilter!=='undefined'&&docFilter==='doc'?'selected':''}>Documents importés</option>
        <option value="photo" ${typeof docFilter!=='undefined'&&docFilter==='photo'?'selected':''}>Photos transporteur</option>
      </select>
    </div>
    ${all.length?all.filter(x=>{
      const q=(typeof docSearch!=='undefined'?docSearch:'').toLowerCase();
      const f=typeof docFilter!=='undefined'?docFilter:'';
      const matchQ=!q||[x.missionRef,x.vehicleLabel,x.vin,x.plate,x.label,x.clientName].join(' ').toLowerCase().includes(q);
      const matchF=!f||(f==='doc'?x.type==='doc':f==='photo'?x.type==='photo':x.phase===f);
      return matchQ&&matchF;
    }).map(x=>`
      <div class="doc-row" style="align-items:center;gap:12px">
        ${x.type==='photo'&&x.url?`<img src="${esc(x.url)}" style="width:64px;height:48px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:pointer;flex-shrink:0" onclick="window.open('${esc(x.url)}','_blank')">`:'<div style="width:64px;height:48px;background:#f0f4f7;border-radius:6px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">📄</div>'}
        <span style="flex:1">
          <strong>${esc(x.vehicleLabel)}</strong> ${x.vin?`<small style="color:var(--muted)">VIN ${esc(x.vin)}</small>`:''}
          <small>Mission ${esc(x.missionRef)} · ${esc(x.clientName)}</small>
          <small>${esc(x.label)} · <span class="badge ${x.phase==='livraison'?'green':'blue'}" style="font-size:9px">${esc(x.phase)}</span></small>
        </span>
        <span style="text-align:right;white-space:nowrap">
          ${x.url?`<a href="${esc(x.url)}" target="_blank" class="btn" style="font-size:11px">↓ Ouvrir</a>`:'<span style="color:var(--muted);font-size:11px">Pas de fichier</span>'}

async function assignCarrier(){
  const carrierId=document.getElementById('bulk-carrier').value;
  if(!carrierId){alert('Choisis un transporteur.');return;}
  const items=selectedVehicles();
  if(!items.length){alert('Coche au moins un véhicule.');return;}
  setLoading(true);
  const mids=[...new Set(items.map(({m})=>m.id))];
  const tokens=[];
  const earlyStatuses=['à planifier','attribué'];
  for(const mid of mids){
    const m=db.missions.find(x=>x.id===mid);
    m.carrierId=carrierId;
    const shouldUpgradeStatus=earlyStatuses.includes(m.status);
    if(shouldUpgradeStatus)m.status='attribué';
    // Récupère le carrier_token depuis Supabase (généré automatiquement par la DB)
    const updatePayload={carrier_id:carrierId};
    if(shouldUpgradeStatus)updatePayload.status='attribué';
    const {data,error}=await sb.from('missions')
      .update(updatePayload)
      .eq('id',mid)
      .select('carrier_token,ref')
      .single();
    if(data?.carrier_token){
      m.carrierToken=data.carrier_token;
      tokens.push({m,token:data.carrier_token});
    }
  }
  setLoading(false);
  render();

  if(!tokens.length){alert('Transporteur affecté.');return;}

  const emailInput=document.getElementById('bulk-email').value.trim();
  const carrier=db.carriers.find(x=>x.id===carrierId);
  const carrierEmail=emailInput||carrier?.email||'';
  const baseUrl=window.location.origin+window.location.pathname;

  if(tokens.length===1){
    const {m,token}=tokens[0];
    const link=`${baseUrl}?t=${token}`;
    if(carrierEmail){
      const subject=`AutoDispatch · Transport Confirmation · ${m.ref}`;
      const body=buildCarrierEmail(m,link,carrier?.name||'');
      location.href=`mailto:${encodeURIComponent(carrierEmail)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    } else {
      try{await navigator.clipboard.writeText(link);}catch(e){}
      alert(`✓ Transporteur affecté !\n\nLien portail copié dans le presse-papier :\n${link}\n\nTu peux l'envoyer par e-mail au transporteur.`);
    }
  } else {
    const allLinks=tokens.map(({m,token})=>`${m.ref} : ${baseUrl}?t=${token}`).join('\n');
    if(carrierEmail){
      const subject=`AutoDispatch · Transport Confirmation · ${tokens.map(t=>t.m.ref).join(', ')}`;
      const missionBlocks=tokens.map(({m,token})=>{
        const link=`${baseUrl}?t=${token}`;
        const allDocs=m.cars.flatMap(c=>(c.docs||[]).filter(d=>d.url).map(d=>({car:c,doc:d})));
        const docsSection=allDocs.length
          ?`\n  📎 Documents:\n`+allDocs.map(({car,doc})=>`    • ${car.make} ${car.model}${car.plate?' ('+car.plate+')':''} – ${doc.name||doc.phase||'Document'}: ${doc.url}`).join('\n')
          :'';
        return `Order ${m.ref} · Portal link: ${link}${docsSection}`;
      }).join('\n\n');
      const body=`Dear,\n\nPlease use the links below to confirm loading and delivery of the vehicles:\n\n${missionBlocks}\n\nKind regards`;
      location.href=`mailto:${encodeURIComponent(carrierEmail)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    } else {
      try{await navigator.clipboard.writeText(allLinks);}catch(e){}
      alert(`✓ Transporteur affecté pour ${tokens.length} missions !\n\nLiens copiés dans le presse-papier.`);
    }
  }
}

// Helper — formats an address block on separate lines
function fmtAddr(site,street,postal,city,country){
  return [site,street,[postal,city].filter(Boolean).join(' '),country].filter(Boolean).join('\n');
}

function buildCarrierEmail(m,link,carrierName){
  const allDocs=m.cars.flatMap(c=>(c.docs||[]).filter(d=>d.url).map(d=>({car:c,doc:d})));
  const docsSection=allDocs.length
    ?`\n\n📎 DOCUMENTS TO DOWNLOAD (${allDocs.length}):\n`
      +allDocs.map(({car,doc})=>`  • ${car.make} ${car.model}${car.plate?' ('+car.plate+')':''} – ${doc.name||doc.phase||'Document'}:\n    ${doc.url}`).join('\n')
    :'';
  const sep='─────────────────────────────';
  return [
    `Dear${carrierName?' '+carrierName:''},`,
    ``,
    `Please use the tracking link below to confirm loading and delivery of the vehicles:`,
    ``,
    link,
    ``,
    sep,
    `Transport Order : ${m.ref}`,
    `Vehicles        : ${m.cars.length}`,
    sep,
    ``,
    `📦 COLLECTION`,
    fmtAddr(m.pickupSite,m.pickupStreet,m.pickupPostal,m.pickupCity,m.pickupCountry)||'—',
    `Date: ${pretty(m.pickupDate)}`,
    ``,
    `🏁 DELIVERY`,
    fmtAddr(m.deliverySite,m.deliveryStreet,m.deliveryPostal,m.deliveryCity,m.deliveryCountry)||'—',
    `Date: ${pretty(m.deliveryDate)}`,
    sep,
    ``,
    `VEHICLES:`,
    ...m.cars.map((c,i)=>`  ${i+1}. ${c.make} ${c.model}\n     VIN   : ${c.vin||'—'}\n     Plate : ${c.plate||'—'}`),
    docsSection||null,
    ``,
    `Via this link you will be able to:`,
    `  • Confirm loading of each vehicle with photos`,
    `  • Photograph CMRs at pickup and at delivery`,
    `  • Confirm delivery of each vehicle`,
    ``,
    `Kind regards`
  ].filter(x=>x!==null).join('\n');
}

async function saveMission(){
  const err=document.getElementById('form-error');
  const vin=val('f-vin').toUpperCase();
  if(!val('f-client')||!val('f-picksite')||!val('f-pickstreet')||!val('f-pickpostal')||!val('f-pickcity')||!val('f-delivsite')||!val('f-delivstreet')||!val('f-delivpostal')||!val('f-delivcity')||!val('f-make')||!val('f-model')){err.innerHTML='<div class="notice error">Complète le client, les noms de site, les deux adresses et la marque / le modèle.</div>';return;}
  if(vin&&!/^[A-HJ-NPR-Z0-9]{17}$/.test(vin)){err.innerHTML='<div class="notice error">Le VIN doit faire 17 caractères sans I, O ni Q.</div>';return;}
  const old=editingMission?db.missions.find(x=>x.id===editingMission):null;
  let cars=old?[...old.cars]:[];
  if(old)cars[0]={...cars[0],make:val('f-make'),model:val('f-model'),vin,plate:val('f-plate')};
  else cars=[{id:crypto.randomUUID(),make:val('f-make'),model:val('f-model'),vin,plate:val('f-plate'),status:'à charger',docs:[]}];
  document.querySelectorAll('#extra-cars .car-form').forEach(row=>{
    const get=k=>row.querySelector(`[data-extra="${k}"]`).value.trim();
    cars.push({id:crypto.randomUUID(),make:get('make'),model:get('model'),vin:get('vin').toUpperCase(),plate:get('plate').toUpperCase(),status:'à charger',docs:[]});
  });
  const m={...(old||{}),id:old?.id||crypto.randomUUID(),ref:val('f-ref'),clientId:val('f-client'),
    pickupSite:val('f-picksite'),pickupContact:val('f-pickcontact'),pickupStreet:val('f-pickstreet'),
    pickupPostal:val('f-pickpostal'),pickupCity:val('f-pickcity'),pickupCountry:val('f-pickcountry'),
    deliverySite:val('f-delivsite'),deliveryContact:val('f-delivcontact'),deliveryStreet:val('f-delivstreet'),
    deliveryPostal:val('f-delivpostal'),deliveryCity:val('f-delivcity'),deliveryCountry:val('f-delivcountry'),
    pickupDate:val('f-load-date'),deliveryDate:val('f-deliv-date'),
    status:old?.status||'à planifier',cars,notifications:old?.notifications||[]};
  if(old&&(old.pickupDate!==m.pickupDate||old.deliveryDate!==m.deliveryDate)&&(m.pickupDate||m.deliveryDate))
    m.notifications.push({id:crypto.randomUUID(),kind:'planned',pickupDate:m.pickupDate,deliveryDate:m.deliveryDate,status:'pending',createdAt:new Date().toISOString()});
  if(!old&&(m.pickupDate||m.deliveryDate))
    m.notifications.push({id:crypto.randomUUID(),kind:'planned',pickupDate:m.pickupDate,deliveryDate:m.deliveryDate,status:'pending',createdAt:new Date().toISOString()});
  setLoading(true);
  await dbUpsertMission(m);
  for(const c of m.cars)await dbUpsertCar(c,m.id);
  for(const n of m.notifications)await dbUpsertNotif(n,m.id);
  setLoading(false);
  if(old)db.missions=db.missions.map(x=>x.id===old.id?m:x);else db.missions.push(m);
  closeModal();render();
  // Auto-email client si une notification 'planned' vient d'être créée
  const newPlanned=m.notifications.filter(n=>n.kind==='planned'&&n.status==='pending');
  if(newPlanned.length){
    const latest=newPlanned[newPlanned.length-1];
    setTimeout(()=>autoEmailClient(m,latest),400);
  }
}

function partnerForm(kind,id){
  const arr=db[kind],p=id?arr.find(x=>x.id===id):{};
  document.getElementById('modal-content').innerHTML=`<div class="modal-header"><div><h2>${id?'Modifier':'Ajouter'} ${kind==='clients'?'un client':'un transporteur'}</h2><p>Coordonnées de contact et facturation.</p></div><button class="x" onclick="closeModal()">×</button></div><div class="form-grid"><div class="field"><label>SOCIÉTÉ *</label><input id="p-name" value="${esc(p.name||'')}"></div><div class="field"><label>TVA</label><input id="p-vat" value="${esc(p.vat||'')}"></div><div class="field"><label>CONTACT</label><input id="p-contact" value="${esc(p.contact||'')}"></div><div class="field"><label>TÉLÉPHONE</label><input id="p-phone" value="${esc(p.phone||'')}"></div><div class="field"><label>E-MAIL PRINCIPAL</label><input id="p-email" type="email" value="${esc(p.email||'')}"></div><div class="field"><label>E-MAIL FACTURATION</label><input id="p-billing" type="email" value="${esc(p.billingEmail||'')}"></div><div class="field wide"><label>RUE ET NUMÉRO</label><input id="p-street" value="${esc(p.street||'')}"></div><div class="field"><label>CODE POSTAL</label><input id="p-postal" value="${esc(p.postal||'')}"></div><div class="field"><label>VILLE</label><input id="p-city" value="${esc(p.city||'')}"></div><div class="field"><label>PAYS</label><input id="p-country" value="${esc(p.country||'Belgique')}"></div></div><div id="form-error"></div><div class="modal-footer"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="savePartner('${kind}','${esc(id||'')}')">Enregistrer</button></div>`;
  document.getElementById('modal').classList.add('open');
}

async function savePartner(kind,id){
  if(!val('p-name')){document.getElementById('form-error').innerHTML='<div class="notice error">Indique le nom de la société.</div>';return;}
  const p={id:id||crypto.randomUUID(),name:val('p-name'),vat:val('p-vat'),contact:val('p-contact'),phone:val('p-phone'),email:val('p-email'),billingEmail:val('p-billing'),street:val('p-street'),postal:val('p-postal'),city:val('p-city'),country:val('p-country')};
  const table=kind==='clients'?'clients':'carriers';
  setLoading(true);
  await dbUpsertPartner(table,p);
  setLoading(false);
  db[kind]=id?db[kind].map(x=>x.id===id?p:x):[...db[kind],p];
  closeModal();render();
}

async function deletePartner(kind,id){
  if(!confirm('Supprimer cette fiche ?'))return;
  const table=kind==='clients'?'clients':'carriers';
  setLoading(true);
  await dbDelete(table,id);
  setLoading(false);
  db[kind]=db[kind].filter(x=>x.id!==id);render();
}

function closeModal(){document.getElementById('modal').classList.remove('open');}

function openDetail(id){
  detailId=id;
  const m=db.missions.find(x=>x.id===id);if(!m)return;
  const portalLink=m.carrierToken?`${window.location.origin}${window.location.pathname}?t=${m.carrierToken}`:'';
  const d=document.getElementById('detail');
  d.innerHTML=`<div class="detail-head"><div><div class="eyebrow">FICHE MISSION</div><h2>${esc(m.ref)}</h2><p>${esc(getClient(m).name||'—')} · ${badge(m.status)}</p></div><button class="x" onclick="closeDetail()">×</button></div>
  <div class="detail-block"><h3>Dates et adresses</h3><div class="route"><div class="routebox"><small>ENLÈVEMENT · ${pretty(m.pickupDate)}</small><strong>${esc(m.pickupSite)}</strong><p>${esc([m.pickupStreet,m.pickupPostal,m.pickupCity,m.pickupCountry].filter(Boolean).join(', '))}<br>Contact : ${esc(m.pickupContact||'—')}</p></div><div class="routebox"><small>LIVRAISON · ${pretty(m.deliveryDate)}</small><strong>${esc(m.deliverySite)}</strong><p>${esc([m.deliveryStreet,m.deliveryPostal,m.deliveryCity,m.deliveryCountry].filter(Boolean).join(', '))}<br>Contact : ${esc(m.deliveryContact||'—')}</p></div></div><p><button class="btn" onclick="openMissionForm('${esc(m.id)}')">Modifier la mission / dates</button></p></div>
  <div class="detail-block"><h3>Transporteur</h3><div class="info-grid"><span>Société<strong>${esc(getCarrier(m).name||'À attribuer')}</strong></span><span>E-mail<strong>${esc(getCarrier(m).email||'—')}</strong></span></div>${portalLink?`<div style="margin-top:12px;padding:11px;background:#edf6fc;border:1px solid #d0e8f5;border-radius:7px;font-size:11px"><div style="font-size:10px;font-weight:800;letter-spacing:1px;color:var(--blue);margin-bottom:6px">🔗 LIEN PORTAIL TRANSPORTEUR</div><div style="word-break:break-all;color:#1e6592;margin-bottom:8px">${esc(portalLink)}</div><button class="btn soft" style="font-size:11px" onclick="copyPortalLink('${esc(m.id)}')">Copier le lien</button> <a href="${esc(portalLink)}" target="_blank" class="btn" style="font-size:11px;text-decoration:none">Ouvrir le portail ↗</a></div>`:'<p style="font-size:12px;color:var(--muted)">Aucun lien portail — affecte un transporteur depuis le Planning.</p>'}</div>
  <div class="detail-block"><h3>Notifications client</h3>
  ${(()=>{
    const kindLabels={planned:'📅 Planification',loaded:'🚛 Chargement',delivered:'✅ Livraison'};
    const sentNots=m.notifications||[];
    const hasSent=k=>sentNots.some(n=>n.kind===k&&n.status==='sent');
    const hasDraft=k=>sentNots.some(n=>n.kind===k);
    const lastOf=k=>sentNots.filter(n=>n.kind===k).slice(-1)[0];
    const notifLang=(()=>{const code=detectLang(m.deliveryCountry);return(CLIENT_NOTIF_I18N[code]||CLIENT_NOTIF_I18N.en);})();
    const langTag=detectLang(m.deliveryCountry).toUpperCase();
    const rows=['planned','loaded','delivered'].map(kind=>{
      const n=lastOf(kind);
      const sent=hasSent(kind);
      const draft=hasDraft(kind);
      const readyToSend=(kind==='planned'&&m.carrierId)||(kind==='loaded'&&m.cars.every(c=>c.status==='chargé'||c.status==='livré'))||(kind==='delivered'&&m.status==='livré');
      const label=kindLabels[kind];
      if(sent)return`<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)"><span style="font-size:12px">${label} <span style="color:var(--green);font-weight:700">✓ envoyée</span> <span style="color:var(--muted);font-size:11px">${pretty(n?.createdAt?.slice(0,10))}</span></span><button class="btn soft" style="font-size:11px" onclick="draftClient('${esc(m.id)}','${esc(n.id)}')">Renvoyer</button></div>`;
      if(draft)return`<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)"><span style="font-size:12px">${label} <span style="color:#e0850c;font-weight:700">⏳ brouillon</span></span><div style="display:flex;gap:6px"><button class="btn primary" style="font-size:11px" onclick="draftClient('${esc(m.id)}','${esc(n.id)}')">Ouvrir email</button><button class="btn" style="font-size:11px" onclick="markSent('${esc(m.id)}','${esc(n.id)}')">Marquer envoyé</button></div></div>`;
      return`<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)"><span style="font-size:12px">${label} <span style="color:var(--muted)">— non envoyée</span></span>${readyToSend?`<button class="btn" style="font-size:11px" onclick="triggerClientNotif('${esc(m.id)}','${kind}')">Préparer (${langTag})</button>`:'<span style="font-size:11px;color:var(--muted)">en attente</span>'}</div>`;
    });
    return`<div style="font-size:11px;color:var(--muted);margin-bottom:8px">Email client en <strong>${langTag}</strong> (pays de livraison)</div>`+rows.join('');
  })()}
  </div>
  <div class="detail-block"><h3>Véhicules · ${m.cars.length}</h3>${m.cars.map(c=>`<div class="notification"><h4>${esc(c.make)} ${esc(c.model)} · ${badge(c.status)}</h4><p>VIN ${esc(c.vin||'—')}<br>Plaque ${esc(c.plate||'—')}</p><div class="toolbar"><select onchange="vehicleStatus('${esc(m.id)}','${esc(c.id)}',this.value)">${['à charger','chargé','livré'].map(s=>`<option ${c.status===s?'selected':''}>${s}</option>`).join('')}</select><label class="btn">Ajouter document<input type="file" hidden onchange="addDoc('${esc(m.id)}','${esc(c.id)}',this.files[0])"></label></div>${(c.docs||[]).map(x=>`<div class="doc-row">${esc(x.name)}<small>${esc(x.phase)}</small>${x.url?`<a href="${esc(x.url)}" target="_blank" style="color:var(--blue);margin-left:8px">↓ Télécharger</a>`:''}</div>`).join('')}</div>`).join('')}</div>

  d.classList.add('open');
}

function closeDetail(){document.getElementById('detail').classList.remove('open');detailId=null;}
function refreshDetail(){render();if(detailId)openDetail(detailId);}

function getClientLang(m){
  const code=detectLang(m.deliveryCountry);
  return CLIENT_NOTIF_I18N[code]||CLIENT_NOTIF_I18N.en;
}

function buildClientEmail(m,n){
  const clientObj=getClient(m);
  const email=clientObj.email||clientObj.billingEmail;
  if(!email)return null;
  const clientName=clientObj.name||'';
  const kind=n.kind||'planned';
  const C=getClientLang(m);
  const t=C[kind]||C.planned;
  const delivLbl=(kind==='delivered')?C.delivered_lbl:C.delivery_lbl;
  const sep='─────────────────────────────';
  const subject=`${t.subject} ${m.ref}`;
  const body=[
    `${C.hello}${clientName?' '+clientName+',':','}`,
    ``,
    `${t.body_intro} ${m.ref}.`,
    `${t.body_route}`,
    ``,
    sep,
    `📦 ${C.pickup_lbl} : ${pretty(n.pickupDate)}`,
    ``,
    ...fmtAddr(m.pickupSite,m.pickupStreet,m.pickupPostal,m.pickupCity,m.pickupCountry).split('\n'),
    ``,
    `🏁 ${delivLbl} : ${pretty(n.deliveryDate)}`,
    ``,
    ...fmtAddr(m.deliverySite,m.deliveryStreet,m.deliveryPostal,m.deliveryCity,m.deliveryCountry).split('\n'),
    sep,
    ``,
    `${C.vehicles_lbl} :`,
    ...m.cars.map(c=>`  • ${c.make} ${c.model}${c.vin?'  |  VIN '+c.vin:''}${c.plate?'  |  '+c.plate:''}`),
    ``,
    `${C.contact_us}`,
    ``,
    `${C.regards}`
  ].join('\n');
  return{email,subject,body};
}

function draftClient(mid,nid){
  const m=db.missions.find(x=>x.id===mid),n=(m.notifications||[]).find(x=>x.id===nid);
  if(!n)return;
  const mail=buildClientEmail(m,n);
  if(!mail){alert('Ajoute une adresse e-mail à la fiche client (onglet Clients).');return;}
  location.href=`mailto:${encodeURIComponent(mail.email)}?subject=${encodeURIComponent(mail.subject)}&body=${encodeURIComponent(mail.body)}`;
}

async function triggerClientNotif(mid,kind){
  const m=db.missions.find(x=>x.id===mid);
  if(!m)return;
  if((m.notifications||[]).some(n=>n.kind===kind&&n.status==='sent')){
    if(!confirm('Une notification de ce type a déjà été envoyée. Créer un nouveau brouillon quand même ?'))return;
  }
  const n={id:crypto.randomUUID(),kind,pickupDate:m.pickupDate,deliveryDate:m.deliveryDate,status:'pending',createdAt:new Date().toISOString()};
  m.notifications=m.notifications||[];
  m.notifications.push(n);
  setLoading(true);
  await dbUpsertNotif(n,mid);
  setLoading(false);
  refreshDetail();
  setTimeout(()=>draftClient(mid,n.id),300);
}

function autoEmailClient(m,n){
  // Ouvre automatiquement le mailto. Si pas d'email client → notice dans la fiche.
  const mail=buildClientEmail(m,n);
  if(mail)location.href=`mailto:${encodeURIComponent(mail.email)}?subject=${encodeURIComponent(mail.subject)}&body=${encodeURIComponent(mail.body)}`;
}

async function markSent(mid,nid){
  if(!confirm('As-tu bien envoyé le message depuis ta messagerie ?'))return;
  const m=db.missions.find(x=>x.id===mid),n=m.notifications.find(x=>x.id===nid);
  n.status='sent';
  await sb.from('notifications').update({status:'sent'}).eq('id',nid);
  refreshDetail();
}

async function notifyLoaded(id){
  const m=db.missions.find(x=>x.id===id);
  if(m.notifications.some(n=>n.kind==='loaded')){alert('La notification de chargement existe déjà.');return;}
  m.status='en transport';m.cars.forEach(c=>c.status='chargé');
  setLoading(true);
  await sb.from('missions').update({status:'en transport'}).eq('id',id);
  for(const c of m.cars)await sb.from('cars').update({status:'chargé'}).eq('id',c.id);
  const n={id:crypto.randomUUID(),kind:'loaded',pickupDate:m.pickupDate,deliveryDate:m.deliveryDate,status:'pending',createdAt:new Date().toISOString()};
  m.notifications.push(n);
  await dbUpsertNotif(n,id);
  setLoading(false);
  refreshDetail();
  // Auto-email client : chargement confirmé
  setTimeout(()=>autoEmailClient(m,n),400);
}

async function missionStatus(id,status){
  const m=db.missions.find(x=>x.id===id);m.status=status;
  setLoading(true);
  await sb.from('missions').update({status}).eq('id',id);
  m.notifications=m.notifications||[];
  if(status==='en transport'&&!m.notifications.some(n=>n.kind==='loaded')){
    const n={id:crypto.randomUUID(),kind:'loaded',pickupDate:m.pickupDate,deliveryDate:m.deliveryDate,status:'pending',createdAt:new Date().toISOString()};
    m.notifications.push(n);await dbUpsertNotif(n,id);
  }
  if(status==='livré'&&!m.notifications.some(n=>n.kind==='delivered')){
    const n={id:crypto.randomUUID(),kind:'delivered',pickupDate:m.pickupDate,deliveryDate:m.deliveryDate,status:'pending',createdAt:new Date().toISOString()};
    m.notifications.push(n);await dbUpsertNotif(n,id);
  }
  setLoading(false);refreshDetail();
}

async function vehicleStatus(mid,vid,status){
  const m=db.missions.find(x=>x.id===mid),c=m.cars.find(x=>x.id===vid);
  c.status=status;
  await sb.from('cars').update({status}).eq('id',vid);
  if(status==='chargé'&&m.cars.every(x=>x.status==='chargé'||x.status==='livré')&&!m.notifications.some(n=>n.kind==='loaded'))
    await notifyLoaded(mid);
  else refreshDetail();
}

async function addDoc(mid,vid,file){
  if(!file)return;
  const m=db.missions.find(x=>x.id===mid),c=m.cars.find(x=>x.id===vid);
  setLoading(true);
  try{
    let fileUrl=null;
    const ext=file.name.split('.').pop()||'pdf';
    const path=`docs/${mid}/${vid}/${Date.now()}.${ext}`;
    const {error:uploadErr}=await sb.storage.from('carrier-photos').upload(path,file,{contentType:file.type,upsert:true});
    if(!uploadErr){
      const {data}=sb.storage.from('carrier-photos').getPublicUrl(path);
      fileUrl=data.publicUrl;
    }
    const phase=c.status==='livré'?'livraison':'chargement';
    const doc={id:crypto.randomUUID(),name:file.name,phase,date:new Date().toLocaleDateString('fr-BE'),url:fileUrl};
    c.docs=c.docs||[];c.docs.push(doc);
    await sb.from('documents').insert({id:doc.id,car_id:vid,mission_id:mid,name:doc.name,phase:doc.phase,date:doc.date,url:fileUrl});
    refreshDetail();
    if(uploadErr)alert('Document enregistré mais upload Storage échoué : '+uploadErr.message);
  }catch(e){alert('Erreur : '+e.message);}
  setLoading(false);
}

async function initCarrierPortal(){
  const portal=document.getElementById('carrier-portal');
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('app-shell').style.display='none';
  portal.style.display='block';
  setLoading(true);
  try{
    // Récupère la mission par son token (anon, pas d'auth)
    const {data:missions,error}=await sb.from('missions')
      .select('*, clients(name), carriers(name)')
      .eq('carrier_token',CARRIER_TOKEN);
    if(error)throw error;
    if(!missions||!missions.length){renderPortalError('Lien invalide ou expiré.');setLoading(false);return;}
    portalMission=missions[0];
    const [{data:cars},{data:events},{data:docs}]=await Promise.all([
      sb.from('cars').select('*').eq('mission_id',portalMission.id),
      sb.from('carrier_events').select('*').eq('mission_id',portalMission.id),
      sb.from('documents').select('*').eq('mission_id',portalMission.id)
    ]);
    portalCars=cars||[];
    portalEvents=events||[];
    portalDocs=docs||[];
    renderCarrierPortal();
  }catch(e){
    renderPortalError('Erreur : '+e.message);
  }
  setLoading(false);
}

function renderCarrierPortal(){
  const m=portalMission;
  const lang=portalLang();
  const L=tr(lang);
  const portal=document.getElementById('carrier-portal');
  portal.className='portal-wrap';
  // Date locale selon la langue du portail

  const loc=localeMap[lang]||'en-GB';
  const fmtDate=d=>d?new Date(d+'T12:00:00').toLocaleDateString(loc,{day:'numeric',month:'short'}):'—';
  portal.innerHTML=`
    <div class="portal-header">
      <div class="brand">auto<span>dispatch</span></div>
      <div style="font-size:11px;opacity:.7;margin-bottom:10px">${L.portal_subtitle}</div>
      <div class="portal-mission-bar" style="background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);margin-bottom:0">
        <div style="font-size:19px;font-weight:800">${esc(m.ref)}</div>
        <div style="font-size:12px;opacity:.8;margin-top:4px">${esc(m.clients?.name||'—')}</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;font-size:12px">
          <div><div style="font-size:9px;letter-spacing:1px;opacity:.6">${L.pickup}</div><strong>${esc(m.pickup_city||'—')}</strong><br><span style="opacity:.7">${fmtDate(m.pickup_date)}</span></div>
          <div><div style="font-size:9px;letter-spacing:1px;opacity:.6">${L.delivery}</div><strong>${esc(m.delivery_city||'—')}</strong><br><span style="opacity:.7">${fmtDate(m.delivery_date)}</span></div>
        </div>
      </div>
    </div>
    <div class="portal-body">
      <div style="font-size:11px;color:var(--muted);margin-bottom:14px;padding:10px;background:white;border-radius:8px;border:1px solid var(--line)">${L.tip}</div>
      ${portalCars.map(car=>renderCarPortalCard(car,lang,L)).join('')}
    </div>
  `;
}

// Catégories de photos — désormais localisées via getPhotoCatsLoading(lang) / getPhotoCatsDelivery(lang)

function getPortalEvents(carId,type){return portalEvents.filter(e=>e.car_id===carId&&e.event_type===type);}
function getEventsByKey(carId,type,key){return portalEvents.filter(e=>e.car_id===carId&&e.event_type===type&&e.notes===key);}
function phaseComplete(carId,type){
  // Phase complète si au moins la CMR est confirmée (photo ou confirmation manuelle)
  const cmr=getEventsByKey(carId,type,'cmr');
  return cmr.length>0;
}

function renderPhotoRow(cat,carId,eventType,locked,L){
  const evts=getEventsByKey(carId,eventType,cat.key);
  const photos=evts.filter(e=>e.photo_url);
  const confirmed=evts.length>0;
  const isRequired=cat.required;
  return `
    <div style="border:1px solid ${confirmed?'#c3e6cb':'var(--line)'};border-radius:8px;padding:11px;margin-bottom:8px;background:${confirmed?'#f6fcf8':'white'}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:${photos.length?'8px':'0'}">
        <span style="font-size:12px;font-weight:700">${cat.icon} ${cat.label}${isRequired?' <span style="color:#e05c5c;font-size:10px">*</span>':''}</span>
        <span style="display:flex;gap:6px;align-items:center">
          ${confirmed?`<span style="color:var(--green);font-size:11px;font-weight:700">✓</span>`:''}
          ${!locked?`<button type="button" style="cursor:pointer;background:${confirmed?'#e8f5ec':'var(--pale)'};border:1px solid ${confirmed?'#b8dfc4':'#d0e8f5'};color:${confirmed?'var(--green)':'var(--blue)'};padding:5px 9px;border-radius:6px;font-size:11px;font-weight:700" onclick="document.getElementById('ph_${carId}_${eventType}_${cat.key}').click()">
            ${confirmed&&!cat.multi?L.retake:L.photo}
          </button>
          <input id="ph_${carId}_${eventType}_${cat.key}" type="file" accept="image/*" capture="environment" style="display:none" onchange="portalUploadPhoto('${esc(carId)}','${esc(eventType)}',this,'${esc(cat.key)}')">
          ${!confirmed?`<button style="background:white;border:1px solid #d9e2e9;color:var(--muted);padding:5px 9px;border-radius:6px;font-size:11px;cursor:pointer" onclick="portalSkipPhoto('${esc(carId)}','${esc(eventType)}','${esc(cat.key)}')">${L.no_photo}</button>`:''}
          `:''}
        </span>
      </div>
      ${photos.length?`<div class="portal-photos" style="margin:0">${photos.map(e=>`<img src="${esc(e.photo_url)}" onclick="portalOpenPhoto('${esc(e.photo_url)}')">`).join('')}</div>`:''}
    </div>`;
}

function renderCarPortalCard(car,lang,L){
  const isLoaded=phaseComplete(car.id,'loading');
  const isDelivered=phaseComplete(car.id,'delivery');
  const loadCmrDone=getEventsByKey(car.id,'loading','cmr').length>0;
  const delivCmrDone=getEventsByKey(car.id,'delivery','cmr').length>0;
  const carDocs=portalDocs.filter(d=>d.car_id===car.id);
  const catsLoad=getPhotoCatsLoading(lang);
  const catsDel=getPhotoCatsDelivery(lang);

  return `
    <div class="portal-car">
      <div class="portal-car-head">
        <div>
          <div style="font-weight:800;font-size:16px">${esc(car.make)} ${esc(car.model)}</div>
          <div style="font-size:11px;color:var(--muted);margin-top:3px">${L.vin} : ${esc(car.vin||'—')}　·　${L.plate} : ${esc(car.plate||'—')}</div>
        </div>
        <span class="badge ${isDelivered?'green':isLoaded?'blue':''}">${isDelivered?L.badge_delivered:isLoaded?L.badge_loaded:L.badge_pending}</span>
      </div>

      <!-- DOCUMENTS REÇUS -->
      ${carDocs.length?`
      <div style="border:1px solid #d0e8f5;border-radius:8px;padding:11px;margin-bottom:10px;background:#f5fafd">
        <div style="font-size:10px;font-weight:800;letter-spacing:1px;color:#2675a9;margin-bottom:8px">${L.docs_received} (${carDocs.length})</div>
        ${carDocs.map(d=>`
          <div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid #e0eef7">
            <span style="font-size:12px;font-weight:600">📄 ${esc(d.name||'Document')}</span>
            ${d.url?`<a href="${esc(d.url)}" target="_blank" style="font-size:11px;background:var(--blue);color:white;padding:5px 10px;border-radius:6px;font-weight:700;text-decoration:none">${L.doc_open}</a>`:`<span style="font-size:11px;color:var(--muted)">${L.doc_none}</span>`}
          </div>`).join('')}
      </div>`:''}

      <!-- CHARGEMENT -->
      <div class="portal-section ${isLoaded?'done':''}">
        <div class="portal-section-label" style="margin-bottom:12px">${isLoaded?'✓ ':''}${L.loading_title}${isLoaded?L.confirmed_suffix:''}</div>
        ${catsLoad.map(cat=>renderPhotoRow(cat,car.id,'loading',isLoaded,L)).join('')}
        ${!isLoaded?`
          <button class="portal-confirm-btn" ${!loadCmrDone?'disabled style="opacity:.45;cursor:not-allowed"':''} onclick="portalConfirmPhase('${esc(car.id)}','loading')">
            ${L.btn_confirm_loading}
          </button>
          ${!loadCmrDone?`<div style="text-align:center;font-size:11px;color:var(--muted);margin-top:6px">${L.cmr_required}</div>`:''}
        `:`
          <div style="text-align:center;padding:8px;font-size:12px;color:var(--green);font-weight:700">${L.loading_done}</div>
        `}
      </div>

      <!-- LIVRAISON -->
      <div class="portal-section ${isDelivered?'done':''} ${!isLoaded&&!isDelivered?'locked':''}">
        <div class="portal-section-label" style="margin-bottom:${isLoaded?'12px':'0'}">${isDelivered?'✓ ':''}${L.delivery_title}${isDelivered?L.confirmed_suffix:!isLoaded?' ('+L.delivery_locked+')':''}</div>
        ${isLoaded?catsDel.map(cat=>renderPhotoRow(cat,car.id,'delivery',isDelivered,L)).join(''):''}
        ${isLoaded&&!isDelivered?`
          <button class="portal-confirm-btn" ${!delivCmrDone?'disabled style="opacity:.45;cursor:not-allowed"':''} onclick="portalConfirmPhase('${esc(car.id)}','delivery')">
            ${L.btn_confirm_delivery}
          </button>
          ${!delivCmrDone?`<div style="text-align:center;font-size:11px;color:var(--muted);margin-top:6px">${L.cmr_required}</div>`:''}
        `:''}
        ${isDelivered?`<div style="text-align:center;padding:8px;font-size:12px;color:var(--green);font-weight:700">${L.delivery_done}</div>`:''}
      </div>
    </div>
  `;
}

function portalOpenPhoto(url){window.open(url,'_blank');}

// Compresse une image via canvas — max 1920px, JPEG 80% → ~200–400KB au lieu de 3–8MB
function compressImage(file,maxPx=1920,quality=0.80){
  return new Promise((resolve)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(url);
      let{width:w,height:h}=img;
      if(w>maxPx||h>maxPx){const r=Math.min(maxPx/w,maxPx/h);w=Math.round(w*r);h=Math.round(h*r);}
      const canvas=document.createElement('canvas');
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      canvas.toBlob(blob=>resolve(blob||file),'image/jpeg',quality);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);resolve(file);};
    img.src=url;
  });
}

async function portalUploadPhoto(carId,eventType,input,photoKey){
  const rawFile=input.files[0];
  if(!rawFile)return;
  // Reset input pour permettre de reprendre la même photo
  input.value='';
  setLoading(true);
  try{
    // Compression avant upload : 1920px max, JPEG 80% → ~10x moins de stockage
    const file=await compressImage(rawFile);
    const path=`${portalMission.id}/${carId}/${eventType}_${photoKey}_${Date.now()}.jpg`;
    const {error:uploadErr}=await sb.storage.from('carrier-photos').upload(path,file,{contentType:'image/jpeg'});
    if(uploadErr)throw uploadErr;
    const {data:{publicUrl}}=sb.storage.from('carrier-photos').getPublicUrl(path);
    const {data:ev,error:evErr}=await sb.from('carrier_events')
      .insert({mission_id:portalMission.id,car_id:carId,event_type:eventType,photo_url:publicUrl,notes:photoKey})
      .select().single();
    if(evErr)throw evErr;
    portalEvents.push(ev);
    renderCarrierPortal();
  }catch(e){
    alert('Erreur upload : '+e.message+'\n\nVérifie que le bucket carrier-photos est créé et public dans Supabase Storage.');
  }
  setLoading(false);
}

async function portalSkipPhoto(carId,eventType,photoKey){
  // Marque la case comme "pas de photo" (confirmation sans fichier)
  setLoading(true);
  try{
    const {data:ev,error}=await sb.from('carrier_events')
      .insert({mission_id:portalMission.id,car_id:carId,event_type:eventType,photo_url:null,notes:photoKey})
      .select().single();
    if(error)throw error;
    portalEvents.push(ev);
    renderCarrierPortal();
  }catch(e){alert('Erreur : '+e.message);}
  setLoading(false);
}

async function portalConfirmPhase(carId,eventType){
  // Confirme la phase (chargement ou livraison) — met à jour le statut véhicule
  if(!confirm(eventType==='loading'?'Confirmer le chargement de ce véhicule ?':'Confirmer la livraison de ce véhicule ?'))return;
  setLoading(true);
  try{
    const newStatus=eventType==='loading'?'chargé':'livré';
    const {error}=await sb.from('cars').update({status:newStatus}).eq('id',carId);
    if(error)throw error;
    // ── Option 3 : insère un événement de confirmation
    // → déclenche le Realtime dans l'app admin + le webhook Edge Function (email opérateur)
    const car=portalCars.find(c=>c.id===carId);
    const evPayload={
      mission_id:portalMission.id,
      car_id:carId,
      event_type:'confirmed_'+eventType,   // 'confirmed_loading' | 'confirmed_delivery'
      photo_url:null,
      notes:`${car?car.make+' '+car.model:'Véhicule'} — confirmed at ${new Date().toISOString()}`
    };
    const {error:evErr}=await sb.from('carrier_events').insert(evPayload);
    if(evErr)console.warn('[portalConfirmPhase] carrier_events insert:',evErr.message);
    // Mise à jour état local portail
    if(car)car.status=newStatus;
    renderCarrierPortal();
  }catch(e){
    alert('Erreur : '+e.message);
  }
  setLoading(false);
}

function renderPortalError(msg){
  document.getElementById('carrier-portal').innerHTML=`
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:24px">
      <div style="max-width:360px;text-align:center;background:white;border:1px solid var(--line);border-radius:12px;padding:32px">
        <div style="font-size:44px;margin-bottom:16px">⚠️</div>
        <div style="font-size:20px;font-weight:800;color:var(--navy);margin-bottom:10px">Lien invalide</div>
        <p style="color:var(--muted);font-size:13px">${esc(msg||'Ce lien est invalide ou a expiré.')}</p>
      </div>
    </div>`;
}
